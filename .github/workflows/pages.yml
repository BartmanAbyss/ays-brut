# Publishes the uncompressed intro as https://bartmanabyss.github.io/ays-brut/
# so it runs with one click: WebGPU needs HTTPS, and GitHub's own file and raw views
# serve HTML as text.
#
# Needs Settings -> Pages -> Source: GitHub Actions. On a free account Pages works for
# public repos only, so it runs when the page changes or by hand (Actions -> Pages ->
# Run workflow), never on every push - while the repo is private it could only fail.

name: Pages

on:
  push:
    branches: [main]
    paths: [release/ays-brut.uncompressed.html]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site is the uncompressed intro, as index.html
        run: |
          mkdir site
          cp release/ays-brut.uncompressed.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
