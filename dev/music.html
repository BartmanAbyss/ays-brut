<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Sketchpad</title>
<!--
  Music sketchpad: the intro's pad, without the intro. Write the score, press Play
  (or Space), hear it in a second - no shader build, no start-up.

  The synth below is a COPY of song()'s pad in dev/champagne.html (PADsynth-lite table,
  two panned copies per note, one lowpass, the hall), with the same sliders and the same
  defaults, so what plays here is what the intro will play. If the pad changes there,
  change it here too. When a score is done, "Copy as SCORE" puts it on the clipboard in
  the intro's format ([start s, length s, MIDI notes...]) to paste into champagne.html.

  The music is the user's: the party bans generated music. This page only plays what is
  written into it.

  Open via the dev server: python dev/serve.py, then http://localhost:8787/music.html
-->
<style>
  :root { --bg: #15161a; --panel: #1d1f25; --line: #2c2f38; --text: #d8dae0; --dim: #8a8f9c;
          --accent: #e0b85a; --hot: #f06a6a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line);
           flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px;
           padding: 5px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.on { border-color: var(--accent); color: var(--accent); }
  label.chk { display: flex; gap: 5px; align-items: center; color: var(--dim); }
  #status { color: var(--dim); margin-left: auto; font-variant-numeric: tabular-nums; }
  #status.clip { color: var(--hot); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 0; height: calc(100vh - 51px); }
  #left { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
  textarea { flex: 1; width: 100%; resize: none; background: var(--bg); color: var(--text); border: 0;
             padding: 12px 16px; font: 13px/1.5 ui-monospace, Consolas, monospace; outline: none; tab-size: 2; }
  #err { color: var(--hot); padding: 6px 16px; min-height: 1.6em; border-top: 1px solid var(--line);
         font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  #vidbox { background: #000; border-bottom: 1px solid var(--line); position: relative; }
  #vid { display: block; width: 100%; max-height: 48vh; object-fit: contain; }
  #vidname { position: absolute; left: 8px; bottom: 6px; color: var(--dim); font-size: 11px; pointer-events: none; }
  #vidcover { position: absolute; inset: 0; cursor: pointer; }
  #time { color: var(--accent); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
  label.chk input:disabled + * , label.chk:has(input:disabled) { opacity: .45; }
  #roll { cursor: pointer; }
  #roll { height: 120px; width: 100%; display: block; border-top: 1px solid var(--line); background: #111216; }
  #ui { padding: 8px 14px; overflow-y: auto; }
  .row { display: grid; grid-template-columns: 82px 1fr 52px; gap: 8px; align-items: center; padding: 3px 0; }
  .row span:first-child { color: var(--dim); }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  .row input { width: 100%; accent-color: var(--accent); }
  .row.changed span:first-child { color: var(--accent); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 12px 0 4px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; }
    #left { border-right: 0; } textarea { min-height: 40vh; } }
</style>
</head>
<body>
<header>
  <h1>Music sketchpad</h1>
  <button id="play" title="Render the score and play it (Space)">Play</button>
  <button id="stop" title="Stop (Space)">Stop</button>
  <label class="chk" title="Play the score round and round. The loop starts on the second pass, so the tails of the last chords carry over into the first, as they would in a repeat."><input type="checkbox" id="loop" checked> loop</label>
  <button id="copy" title="Copy the score in the intro's format - [start s, length s, MIDI notes...] - to paste into SCORE in dev/champagne.html">Copy as SCORE</button>
  <label class="chk" title="Play along with the exported intro: the score's seconds are the show's, as in SCORE. Click the piano roll to move the playhead."><input type="checkbox" id="usevid" disabled> video</label>
  <button id="loadvid" title="Play along with another video file (the default is build/intro-720p.mp4 from dev/export.py)">Video...</button>
  <input type="file" id="vidfile" accept="video/*" hidden>
  <button id="defscore" title="Replace the score with the one written in music.html (asks first if yours differs)">Default score</button>
  <button id="reset" title="Put every slider back to the intro's current default">Reset sliders</button>
  <span id="time" title="The playhead, in show seconds">0.00 s</span>
  <span id="status">-</span>
</header>
<main>
  <div id="left">
    <div id="vidbox" style="display:none"><video id="vid" playsinline preload="auto"></video>
      <!-- a cover over the video: hover-zoom extensions zoom whatever <video> is under the
           mouse, and this keeps the mouse off it. Clicking it plays / stops. -->
      <div id="vidcover" title="Click to play / stop (Space)"></div>
      <div id="vidname"></div></div>
    <textarea id="score" spellcheck="false"></textarea>
    <div id="err"></div>
    <canvas id="roll"></canvas>
  </div>
  <div id="ui"></div>
</main>
<script type="module">
// ── the score ──
// A JavaScript array, evaluated as you type. Each entry: [start s, length s, notes...];
// a note is a MIDI number or a name such as 'A3', 'C#4', 'Bb2' (C4 = 60, A3 = 57).
const DEFAULT_SCORE = `// [start s, length s, notes...] - a note is a MIDI number or a name: 'A3', 'C#4', 'Bb2'
// (C4 = 60). Changes apply on the next Play.
// Open voicing: the root low, the 5th and the 10th above it, spread over two octaves.
// chord(root, kind) writes one for you: ...chord('F2', 'maj7') - kinds: 'm', 'maj7' 'maj9',
// '7' '9', 'add9', '#11', 'sus2' 'sus4', combined in that order (e.g. 'm9', 'maj7#11').
[
  [0,  6, ...chord('C3', 'maj9')],      // Cmaj9      C3 G3 B3 D4 E4
  [6,  6, ...chord('A2', 'm9')],        // Am9        A2 E3 G3 B3 C4
  [12, 6, ...chord('F2', 'maj7#11')],   // Fmaj7#11   F2 C3 E3 A3 B3
  [18, 6, ...chord('G2', 'sus4')],      // Gsus4      G2 D3 C4
]`;

// ── the pad's controls: names, ranges, defaults and tooltips as in champagne.html's SPEC ──
const SPEC = [
  ['padGain',    0.01, 0,    0.2,  0.001, 3, 'The pad\'s level per voice.'],
  ['master',     0.9,  0,    2,    0.01,  2, 'The overall level. Fixed, not normalised: watch the peak - past 1 the release clips.'],
  ['padCut',     1400, 200,  6000, 10,    0, 'The pad\'s lowpass cutoff in Hz - lower is darker and softer, higher brighter.'],
  ['padAtk',     2.5,  0.05, 8,    0.05,  2, 'Seconds a chord takes to swell in.'],
  ['padRel',     4,    0.1,  10,   0.1,   1, 'Seconds a chord takes to fade after it ends. Longer lets chords overlap into each other.'],
  ['padStagger', 0.15, 0,    1,    0.01,  2, 'The notes of a chord start up to this many seconds apart, as players do. 0 starts them together.'],
  ['padBw',      30,   0,    200,  1,     0, 'PADsynth: how wide each harmonic is smeared, in cents at the fundamental. 0 is a plain saw-like tone; 20-50 an ensemble; 100+ a choir or a wash.'],
  ['padBwScale', 1,    0,    2,    0.05,  2, 'PADsynth: how the smear grows up the harmonics. 1 is as wide in pitch at every harmonic; above 1 the highs get airier; below 1 cleaner.'],
  ['verbLen',    4,    0.5,  10,   0.1,   1, 'The pad\'s hall, tail in seconds (to -60 dB).'],
  ['verbMix',    0.5,  0,    2,    0.05,  2, 'How much of the pad goes into its hall.'],
];
const ui = {};
const KEY = 'musicSketch.v1';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
// The score is kept with the default it started from: a score nobody edited follows a new
// default in the file, an edited one stays as typed.
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ ui, score: $score.value, def: DEFAULT_SCORE })); } catch (e) {} };
const $ = id => document.getElementById(id);
const $score = $('score'), $err = $('err'), $status = $('status');

// ── note names ──
const NAMES = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function midi(n) {
  if (typeof n === 'number') return n;
  const m = /^([A-Ga-g])([#b]*)(-?\d)$/.exec(String(n).trim());
  if (!m) throw new Error('not a note: ' + JSON.stringify(n));
  let v = NAMES[m[1].toUpperCase()] + (+m[3] + 1) * 12;
  for (const a of m[2]) v += a === '#' ? 1 : -1;
  return v;
}
// chord(root, kind): the notes of a chord in the sketch's open voicing - the root where
// given, its 5th and 10th above, everything within two octaves. kind, in this order:
//   'm'                  minor (else major)
//   'maj7' 'maj9'        the major 7th (+11), with the 9th (+14) for maj9
//   '7' '9'              the minor 7th (+10), with the 9th for 9 - so 'm7', 'm9', '7', '9'
//   'add9'               the 9th alone (+14, under the 10th)
//   '#11'                the raised 11th (+18, above the 10th)
//   'sus2' / 'sus4'      the 9th / the 11th (+17) INSTEAD of the 10th
// e.g. 'maj9', 'm9', 'maj7#11', 'sus4', 'madd9'. In a score entry:
// [0, 6, ...chord('C3', 'maj9')].
const KIND = /^(m(?!aj))?(maj7|maj9|7|9)?(add9)?(#11)?(sus[24])?$/;
function chord(root, kind = '') {
  const k = KIND.exec(kind);
  if (!k) throw new Error('chord kind not known: ' + JSON.stringify(kind) + ' (see chord() for the list)');
  const [, minor, sev, add9, s11, sus] = k, r = midi(root);
  const iv = new Set([0, 7]);
  if (sev) iv.add(sev.startsWith('maj') ? 11 : 10);
  if (sev && sev.endsWith('9') || add9 || sus === 'sus2') iv.add(14);
  if (sus === 'sus4') iv.add(17);
  else if (!sus) iv.add(minor ? 15 : 16);
  if (s11) iv.add(18);
  return [...iv].sort((a, b) => a - b).map(i => r + i);
}
function parseScore() {
  const raw = Function('chord', '"use strict"; return (' + $score.value + '\n);')(chord);
  if (!Array.isArray(raw)) throw new Error('the score must be an array');
  return raw.map((e, i) => {
    if (!Array.isArray(e) || e.length < 3) throw new Error('entry ' + i + ': [start, length, notes...]');
    const [t, len, ...notes] = e;
    if (!(t >= 0) || !(len > 0)) throw new Error('entry ' + i + ': start >= 0 and length > 0');
    return [t, len, ...notes.map(midi)];
  });
}

// ── the pad: song()'s, copied ──
// PADsynth-lite (Nasca Octavian Paul's PADsynth, ZynAddSubFX): every harmonic is a band of a
// dozen sines with random phases, each a whole number of cycles per loop so the table loops.
// The same seeded sequence (Park-Miller, seed 5) as the intro, so the table is the same.
const rng = q => () => (q = q * 16807 % 2147483647) / 2147483647, TAU = 2 * Math.PI;
const PL = 1 << 17, PF = 220;
let tableKey = '', tableData = null;
function padTable(sr, r3) {
  // the table consumes r3 first, exactly as song() does, and is cached per sound
  const key = [sr, ui.padBw, ui.padBwScale].join();
  const pd = new Float32Array(PL);
  for (let h = 1; h < 25; h++) for (let j = 0; j < 12; j++) {
    const g = r3() + r3() + r3() - 1.5,
          w = TAU * Math.round(PF * h * 2 ** (g * ui.padBw * h ** (ui.padBwScale - 1) / 1200) * PL / sr) / PL,
          c = Math.cos(w), sn = Math.sin(w), ph = TAU * r3();
    if (key === tableKey) continue;           // cached: draw the numbers, skip the work
    let x = Math.cos(ph) / h, y = Math.sin(ph) / h;
    for (let i = 0; i < PL; i++) { pd[i] += y; const x1 = x * c - y * sn; y = x * sn + y * c; x = x1; }
  }
  if (key !== tableKey) { tableKey = key; tableData = pd; }
  return tableData;
}

async function render(score, sr, passes, minLen = 0) {
  const L = Math.max(...score.map(([t, len]) => t + len));   // the score's length
  const span = Math.max(L * passes, minLen), tail = ui.padRel * 2 + ui.verbLen;
  const o = new OfflineAudioContext(2, Math.ceil(sr * (span + tail)), sr);
  const gain = (v, to) => { const g = o.createGain(); g.gain.value = v; g.connect(to); return g; };
  const out = gain(ui.master, o.destination);
  const bus = gain(1, out);
  const r3 = rng(5);
  const pt = o.createBuffer(1, PL, sr);
  pt.getChannelData(0).set(padTable(sr, r3));
  const lp = o.createBiquadFilter();
  lp.frequency.value = ui.padCut; lp.connect(bus);
  for (let k = 0; k < passes; k++) for (const [t, len, ...notes] of score) for (const m of notes) {
    const t0 = k * L + t + r3() * ui.padStagger;
    for (const pn of [-0.6, 0.6]) {
      const v = o.createBufferSource(), pan = o.createStereoPanner(), e = gain(0, pan);
      v.buffer = pt; v.loop = true; v.playbackRate.value = 2 ** ((m - 57) / 12);   // table at 220 Hz, MIDI 57
      pan.pan.value = pn; pan.connect(lp);
      e.gain.setTargetAtTime(ui.padGain, t0, ui.padAtk / 3);
      e.gain.setTargetAtTime(0, t0 + len, ui.padRel / 3);
      v.connect(e); v.start(t0, r3() * PL / sr); v.stop(t0 + len + ui.padRel * 2);
    }
  }
  // the hall: two channels of noise decaying to -60 dB (the intro seeds it from its own rnd)
  const rnd = rng(7);
  const cv = o.createConvolver(), ir = o.createBuffer(2, Math.ceil(sr * ui.verbLen), sr);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c);
    for (let i = 0; i < d.length; i++) d[i] = (rnd() * 2 - 1) * Math.exp(-7 * i / d.length);
  }
  cv.buffer = ir; cv.connect(out); bus.connect(gain(ui.verbMix, cv));
  const b = await o.startRendering();
  let pk = 0;
  for (let c = 0; c < 2; c++) for (const x of b.getChannelData(c)) pk = Math.max(pk, Math.abs(x));
  return { b, L, pk };
}

// ── playback ──
// Without a video: the score, looped or once. With one (the intro exported by
// dev/export.py, served from build/ by dev/serve.py): the score is show time - the same
// seconds SCORE uses in the intro - rendered once over the whole video and started with it
// at the playhead. The audio is the clock; the video is nudged back whenever it drifts.
let ac = null, src = null, playing = null, renderId = 0, pos = 0, cache = null;
const vid = $('vid');
let haveVideo = false;
const videoOn = () => haveVideo && $('usevid').checked;
async function play() {
  let score;
  try { score = parseScore(); $err.textContent = ''; }
  catch (e) { $err.textContent = e.message; return; }
  if (!score.length) { $err.textContent = 'the score is empty'; return; }
  ac = ac || new AudioContext();
  await ac.resume();
  const id = ++renderId;
  const sync = videoOn(), loop = !sync && $('loop').checked, len = sync ? vid.duration : 0;
  // a seek or a replay of the same score and sound reuses the render
  const key = JSON.stringify([score, SPEC.map(([k]) => ui[k]), loop, len, ac.sampleRate]);
  let r = cache && cache.key === key ? cache : null;
  if (!r) {
    $status.textContent = 'rendering...'; $status.className = '';
    const t0 = performance.now();
    r = await render(score, ac.sampleRate, loop ? 2 : 1, len);
    r.key = key; r.ms = Math.round(performance.now() - t0);
    cache = r;
  }
  if (id !== renderId) return;                 // a newer Play overtook this one
  stop(false);
  const s = src = ac.createBufferSource();
  s.buffer = r.b; s.connect(ac.destination);
  let off = 0;
  if (loop) { s.loop = true; s.loopStart = r.L; s.loopEnd = 2 * r.L; }
  if (sync) {
    vid.currentTime = Math.min(pos, vid.duration - 0.05);
    try { await vid.play(); } catch (e) {}
    if (id !== renderId) return;
    off = vid.currentTime;                     // start the audio where the video really is
  }
  s.start(0, off);
  playing = { start: ac.currentTime - off, L: r.L, loop, sync, src: s };
  // Only this source's own end may stop playback. Stopping the previous one (above) fires
  // its onended a moment later, and checking the CURRENT source there stopped the new one:
  // a Play during playback rendered and then went silent.
  s.onended = () => { if (playing && playing.src === s) stop(); };
  $('play').classList.add('on');
  $status.textContent = 'peak ' + r.pk.toFixed(2) + (r.pk > 1 ? '  CLIPS: lower master' : '') +
                        '   rendered in ' + r.ms + ' ms';
  $status.className = r.pk > 1 ? 'clip' : '';
}
// the time being heard: the audio clock less the output latency
function now() {
  if (!playing) return pos;
  const t = ac.currentTime - (ac.outputLatency || 0) - playing.start;
  return playing.loop && t > playing.L ? (t - playing.L) % playing.L : Math.max(0, t);
}
function stop(clear = true) {
  if (clear && playing && playing.sync) pos = now();   // a stop leaves the playhead there
  // unhook first: a stopped source fires onended later, and play() may still be waiting on
  // the video then, with the old source still current - it stopped the new playback
  if (src) { src.onended = null; try { src.stop(); } catch (e) {} src = null; }
  if (clear) { playing = null; vid.pause(); $('play').classList.remove('on'); }
}
function seek(t) {
  pos = Math.max(0, Math.min(t, vid.duration || t));
  if (videoOn()) vid.currentTime = pos;
  if (playing && playing.sync) play();         // cached: restarts at once
}
function useVideo(url, name) {
  haveVideo = false;
  vid.src = url;
  vid.onloadedmetadata = () => {
    haveVideo = true;
    $('usevid').disabled = false; $('usevid').checked = true;
    $('vidname').textContent = name + ' ' + vid.duration.toFixed(1) + ' s';
    vid.volume = ui.vidVol;
    showVideo();
  };
  vid.onerror = () => {
    $('usevid').disabled = true; $('usevid').checked = false;
    $('vidname').textContent = 'no ' + name + ' - export it, or load one';
    showVideo();
  };
}
function showVideo() {
  $('vidbox').style.display = videoOn() ? '' : 'none';
  $('loop').disabled = videoOn();
}

// ── the piano roll: what the score holds, and where playback is ──
const roll = $('roll'), g2 = roll.getContext('2d');
function drawRoll() {
  const w = roll.clientWidth, h = roll.clientHeight, dpr = devicePixelRatio || 1;
  if (roll.width !== w * dpr) { roll.width = w * dpr; roll.height = h * dpr; }
  g2.setTransform(dpr, 0, 0, dpr, 0, 0);
  g2.clearRect(0, 0, w, h);
  let score; try { score = parseScore(); } catch (e) { score = []; }
  // keep the video on the audio clock: a hitch in either moves them apart
  if (playing && playing.sync && !vid.seeking && Math.abs(vid.currentTime - now()) > 0.08) vid.currentTime = now();
  if (playing && playing.sync && vid.paused && now() < vid.duration) vid.play().catch(() => {});
  const t = now();
  const shot = SHOTS.find(([, a, b]) => t >= a && t < b);
  $('time').textContent = t.toFixed(2) + ' s' + (shot ? '  ' + shot[0] : '');
  if (score.length) {
    const L = rollLen(score);
    const all = score.flatMap(([, , ...n]) => n), lo = Math.min(...all) - 2, hi = Math.max(...all) + 2;
    const X = t => 8 + (w - 16) * t / L, Y = m => h - 6 - (h - 12) * (m - lo) / (hi - lo);
    // the shots: a band each, the blacks between them darker, the name at the top
    g2.font = '10px system-ui';
    SHOTS.forEach(([name, a, b], i) => {
      if (a >= L) return;
      const x0 = X(a), x1 = X(Math.min(b, L));
      g2.fillStyle = name === 'black' ? '#08080a' : i % 2 ? '#191b21' : '#15161b';
      g2.fillRect(x0, 0, x1 - x0, h);
      g2.fillStyle = '#4a5060'; g2.fillRect(x0, 0, 1, h);
      if (name !== 'black' && x1 - x0 > 24) {
        g2.save(); g2.beginPath(); g2.rect(x0, 0, x1 - x0 - 2, h); g2.clip();
        g2.fillStyle = '#8a8f9c'; g2.fillText(name, x0 + 3, 11);
        g2.restore();
      }
    });
    const step = L > 40 ? 5 : 1;               // a grid line a second, or every 5 s on a long roll
    g2.strokeStyle = '#2c2f3888'; g2.fillStyle = '#5a5f6c';
    for (let s = 0; s <= L; s += step) {
      g2.beginPath(); g2.moveTo(X(s), 14); g2.lineTo(X(s), h); g2.stroke();
      if (step > 1 && s % 10 === 0) g2.fillText(s, X(s) + 2, h - 3);
    }
    g2.fillStyle = '#e0b85a';
    for (const [t, len, ...notes] of score) for (const m of notes) g2.fillRect(X(t), Y(m) - 2, X(t + len) - X(t) - 1, 4);
    if (t <= L && (playing || videoOn())) { g2.fillStyle = playing ? '#f0f0f0' : '#8a8f9c'; g2.fillRect(X(t), 0, 1.5, h); }
  }
  requestAnimationFrame(drawRoll);
}
// The shots, [name, start s, end s], read from the harness's shot block on load - the one the
// timeline editor saves - and laid end to end, as the intro does (build/timeline.py starts).
let SHOTS = [];
fetch('/champagne.html').then(r => r.text()).then(src => {
  const block = src.slice(src.indexOf('// SHOTS:BEGIN'), src.indexOf('// SHOTS:END'));
  let s = 0;
  for (const m of block.matchAll(/\{\s*name:\s*'([^']*)',\s*dur:\s*([\d.]+)/g)) {
    SHOTS.push([m[1], s, s + +m[2]]); s += +m[2];
  }
}).catch(() => {});
// the roll spans the score, or the whole video when one plays along
const rollLen = score => Math.max(...score.map(([t, len]) => t + len), videoOn() ? vid.duration : 0);
// Click or drag on the roll to move the playhead. While dragging, playback pauses and the
// video follows the pointer; letting go resumes from there if it was playing (restarting
// the audio on every move would only stutter).
let drag = null;
const rollTime = e => {
  let score; try { score = parseScore(); } catch (err) { return null; }
  const r = roll.getBoundingClientRect();
  return (e.clientX - r.left - 8) / (r.width - 16) * rollLen(score);
};
const scrub = e => {
  const t = rollTime(e);
  if (t === null) return;
  pos = Math.max(0, Math.min(t, vid.duration));
  if (vid.fastSeek && drag) vid.fastSeek(pos); else vid.currentTime = pos;
};
roll.onpointerdown = e => {
  if (!videoOn()) return;
  drag = { was: !!playing };
  if (playing) stop();
  roll.setPointerCapture(e.pointerId);
  scrub(e);
};
roll.onpointermove = e => { if (drag) scrub(e); };
roll.onpointerup = roll.onpointercancel = e => {
  if (!drag) return;
  const was = drag.was; drag = null;
  scrub(e);                                    // land exactly where the pointer let go
  if (was) play();
};

// ── the panel ──
const stored = load();
// the sketchpad's own controls, not the intro's
const VSPEC = [
  ['vidVol', 1, 0, 1, 0.01, 2, 'The video\'s own sound - the intro as exported: liquid, drips, the cork - under the pad. 0 mutes it.'],
];
function buildUI() {
  const box = $('ui');
  box.innerHTML = '';
  const rows = (title, spec, live) => {
    box.insertAdjacentHTML('beforeend', '<h2>' + title + '</h2>');
    for (const [k, def, lo, hi, st, dec, tip] of spec) {
      ui[k] = stored.ui && stored.ui[k] !== undefined ? stored.ui[k] : def;
      const row = document.createElement('label'); row.className = 'row'; row.title = tip;
      row.innerHTML = `<span>${k}</span><input type="range" min="${lo}" max="${hi}" step="${st}"><output></output>`;
      const inp = row.querySelector('input'), out = row.querySelector('output');
      const show = () => { out.textContent = (+ui[k]).toFixed(dec); row.classList.toggle('changed', ui[k] !== def); };
      inp.value = ui[k]; show();
      inp.oninput = () => { ui[k] = +inp.value; show(); save(); live(); };
      inp.onchange = () => { if (playing && spec === SPEC) play(); };   // let go of a pad slider: hear it
      box.append(row);
    }
  };
  rows('Pad (as in the intro)', SPEC, () => {});
  rows('Video', VSPEC, () => { vid.volume = ui.vidVol; });
}
// (the first version stored no default: its unedited score is the one with this line)
const unedited = !stored.score || stored.score === stored.def ||
                 (!stored.def && stored.score.includes('Plain root-position triads for now'));
$score.value = unedited ? DEFAULT_SCORE : stored.score;
buildUI();
$score.oninput = () => { save(); try { parseScore(); $err.textContent = ''; } catch (e) { $err.textContent = e.message; } };
$('play').onclick = play;
$('stop').onclick = () => stop();
$('loop').onchange = () => { if (playing) play(); };
$('usevid').onchange = () => { showVideo(); if (playing) play(); };
$('loadvid').onclick = () => $('vidfile').click();
$('vidcover').onclick = () => { playing ? stop() : play(); };
$('vidfile').onchange = () => { const f = $('vidfile').files[0]; if (f) { stop(); pos = 0; useVideo(URL.createObjectURL(f), f.name); } };
// ?video=intro.mp4 picks another export from build/
const vname = new URLSearchParams(location.search).get('video') || 'intro-720p.mp4';
useVideo('/build/' + vname, 'build/' + vname);
$('defscore').onclick = () => {
  if ($score.value !== DEFAULT_SCORE && !confirm('Replace your score with the default? Yours is lost.')) return;
  $score.value = DEFAULT_SCORE; $score.oninput();
  if (playing) play();
};
$('reset').onclick = () => { stored.ui = null; buildUI(); save(); if (playing) play(); };
$('copy').onclick = async () => {
  try {
    const s = parseScore().map(e => '    [' + e.join(', ') + '],').join('\n');
    await navigator.clipboard.writeText(s);
    $status.textContent = 'copied ' + parseScore().length + ' entries as SCORE rows';
  } catch (e) { $err.textContent = e.message; }
};
addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target !== $score) { e.preventDefault(); playing ? stop() : play(); }
});
drawRoll();
// for checks from the harness tooling: render without playing, report the peak
window.__chord = chord;
window.__render = async () => { const r = await render(parseScore(), 48000, 1); return { secs: r.b.duration, peak: r.pk }; };
</script>
</body>
</html>
