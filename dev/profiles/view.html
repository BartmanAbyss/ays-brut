<!doctype html>
<meta charset="utf-8">
<title>Profile viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- A whole-show performance profile over show time. Serve dev/ (python dev/serve.py) and
     open http://localhost:8787/profiles/view.html?f=<file>.json - the default is the newest
     the index lists. Files are written by a run recorder (README, "Profiling a whole run"). -->
<style>
  :root { --bg:#111; --fg:#ddd; --dim:#888; --grid:#2a2a2a; --sim:#6c8ebf; --build:#8fbf6c;
          --photon:#d8b25a; --render:#c8665a; --frame:#fff; --budget:#ff5a5a; --target:#ffb15a; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui, sans-serif; }
  header { padding:10px 16px; display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; }
  header b { font-size:15px; }
  label { color:var(--dim); }
  #wrap { position:relative; margin:0 16px; }
  canvas { display:block; width:100%; }
  #tip { position:absolute; pointer-events:none; background:#000d; border:1px solid #444; padding:6px 8px;
         border-radius:4px; white-space:pre; font:12px ui-monospace, monospace; display:none; }
  .key { display:inline-block; width:10px; height:10px; margin-right:4px; vertical-align:-1px; }
  table { border-collapse:collapse; margin:12px 16px 24px; font:12px ui-monospace, monospace; }
  th, td { padding:3px 10px; text-align:right; border-bottom:1px solid var(--grid); }
  th:first-child, td:first-child { text-align:left; }
  .over { color:var(--budget); }
</style>
<header>
  <b id="title">profile</b>
  <span id="meta"></span>
  <label>smooth <select id="smooth"><option value="1">off</option><option value="5">5 frames</option>
    <option value="15" selected>15 frames</option><option value="60">60 frames</option></select></label>
  <label><input type="checkbox" id="frame" checked> frame interval</label>
  <span><span class="key" style="background:var(--sim)"></span>sim
    <span class="key" style="background:var(--build)"></span>build
    <span class="key" style="background:var(--photon)"></span>photon
    <span class="key" style="background:var(--render)"></span>render
    <span class="key" style="background:var(--frame)"></span>frame interval
    <span class="key" style="background:var(--budget)"></span>16.6 ms (5070)
    <span class="key" style="background:var(--target)"></span>19 ms (4070 target)</span>
</header>
<div id="wrap"><canvas id="c"></canvas><div id="tip"></div></div>
<table id="shots"></table>
<script>
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const Q = new URLSearchParams(location.search);
(async () => {
  const f = Q.get('f') || (await (await fetch('index.json')).json()).at(-1);
  const D = await (await fetch(f)).json();
  const C = D.columns, col = n => C.indexOf(n);
  const R = D.rows.filter(r => r[col('showT')] > 0);
  document.getElementById('title').textContent = f;
  document.getElementById('meta').textContent = `${D.width}x${D.height}, ${D.gpu}, ${D.refresh}, ${D.date} - ${R.length} frames`;
  const passes = ['sim', 'build', 'photon', 'render'];
  const cv = document.getElementById('c'), tip = document.getElementById('tip');
  const end = D.showEnd;

  function smoothed(n) {
    const out = R.map(r => r.slice());
    if (n <= 1) return out;
    for (const name of [...passes, 'frameMs', 'total']) {
      const k = col(name);
      let s = 0;
      for (let i = 0; i < R.length; i++) {
        s += R[i][k];
        if (i >= n) s -= R[i - n][k];
        out[i][k] = s / Math.min(i + 1, n);
      }
    }
    return out;
  }

  function draw() {
    const S = smoothed(+document.getElementById('smooth').value);
    const W = cv.clientWidth, H = Math.max(360, Math.min(innerHeight - 160, 640));
    const dpr = devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + 'px';
    const g = cv.getContext('2d'); g.scale(dpr, dpr);
    const L = 44, B = 36, T = 8, Rm = 8, pw = W - L - Rm, ph = H - B - T;
    // scale to the 99.5th percentile: the first frames (shaders warming up) run to 100+ ms
    const peaks = S.map(r => Math.max(r[col('total')], document.getElementById('frame').checked ? r[col('frameMs')] : 0)).sort((a, b) => a - b);
    const top = Math.max(30, Math.ceil(peaks[Math.floor(peaks.length * .995)] / 5) * 5 + 5);
    const x = t => L + t / end * pw, y = ms => T + ph - Math.min(ms, top) / top * ph;
    // shots: alternating bands, names on top
    D.shots.forEach((s, i) => {
      const a = x(s.start), b = x(D.shots[i + 1]?.start ?? end);
      g.fillStyle = s.black ? '#000' : i % 2 ? '#181818' : '#141414';
      g.fillRect(a, T, b - a, ph);
      g.save(); g.beginPath(); g.rect(a, T, b - a, ph); g.clip();
      g.fillStyle = css('--dim'); g.font = '11px system-ui'; g.fillText(s.name, a + 3, T + 12);
      g.restore();
    });
    // grid
    g.strokeStyle = css('--grid'); g.fillStyle = css('--dim'); g.font = '11px system-ui'; g.lineWidth = 1;
    for (let ms = 0; ms <= top; ms += top > 60 ? 20 : 5) {
      g.beginPath(); g.moveTo(L, y(ms) + .5); g.lineTo(L + pw, y(ms) + .5); g.stroke();
      g.fillText(ms + ' ms', 4, y(ms) + 4);
    }
    for (let t = 0; t <= end; t += 10) g.fillText(t + ' s', x(t) - 8, H - 14);
    // stacked passes
    const base = new Float32Array(S.length);
    for (const p of passes) {
      const k = col(p);
      g.beginPath();
      S.forEach((r, i) => { const v = base[i] + r[k]; i ? g.lineTo(x(r[col('showT')]), y(v)) : g.moveTo(x(r[col('showT')]), y(v)); });
      for (let i = S.length - 1; i >= 0; i--) g.lineTo(x(S[i][col('showT')]), y(base[i]));
      g.closePath(); g.fillStyle = css('--' + p); g.globalAlpha = .85; g.fill(); g.globalAlpha = 1;
      S.forEach((r, i) => base[i] += r[k]);
    }
    // frame interval
    if (document.getElementById('frame').checked) {
      g.beginPath(); g.strokeStyle = css('--frame'); g.lineWidth = 1;
      S.forEach((r, i) => { const p = [x(r[col('showT')]), y(r[col('frameMs')])]; i ? g.lineTo(...p) : g.moveTo(...p); });
      g.stroke();
    }
    // budgets
    [['--budget', 16.6], ['--target', 19]].forEach(([c, ms]) => {
      g.setLineDash([5, 4]); g.strokeStyle = css(c); g.beginPath(); g.moveTo(L, y(ms) + .5); g.lineTo(L + pw, y(ms) + .5); g.stroke(); g.setLineDash([]);
    });
    cv.onmousemove = e => {
      const t = (e.offsetX - L) / pw * end;
      if (t < 0 || t > end) { tip.style.display = 'none'; return; }
      let i = 0; while (i < S.length - 1 && S[i + 1][col('showT')] < t) i++;
      const r = S[i], raw = R[i];
      tip.textContent = `show ${r[col('showT')].toFixed(2)} s  (${D.shots[raw[col('shot')]]?.name ?? '?'})\n` +
        passes.map(p => `${p.padEnd(7)}${r[col(p)].toFixed(2)} ms`).join('\n') +
        `\ngpu    ${r[col('total')].toFixed(2)} ms\nframe  ${r[col('frameMs')].toFixed(2)} ms\nsteps  ${raw[col('simSteps')]}   drops alive ${raw[col('alive')]}\ntop glass ${raw[col('topLevel')]} mm`;
      tip.style.display = 'block';
      tip.style.left = Math.min(e.offsetX + 14, cv.clientWidth - 190) + 'px'; tip.style.top = (e.offsetY + 10) + 'px';
    };
    cv.onmouseleave = () => tip.style.display = 'none';
  }

  // per shot: median and 95th percentile of the GPU total, worst frame, frames over budget
  const q = (a, p) => { const s = [...a].sort((u, v) => u - v); return s[Math.min(s.length - 1, Math.floor(p * s.length))] ?? 0; };
  let html = '<tr><th>shot</th><th>from</th><th>frames</th><th>gpu median</th><th>gpu p95</th><th>gpu max</th><th>render p95</th><th>sim p95</th><th>&gt;16.6</th><th>&gt;19</th></tr>';
  D.shots.forEach((s, i) => {
    const rs = R.filter(r => r[col('shot')] === i);
    if (!rs.length) return;
    const tot = rs.map(r => r[col('total')]);
    const cell = v => `<td class="${v > 16.6 ? 'over' : ''}">${v.toFixed(1)}</td>`;
    html += `<tr><td>${s.name}</td><td>${s.start.toFixed(2)}</td><td>${rs.length}</td>${cell(q(tot, .5))}${cell(q(tot, .95))}${cell(Math.max(...tot))}` +
      `${cell(q(rs.map(r => r[col('render')]), .95))}${cell(q(rs.map(r => r[col('sim')]), .95))}` +
      `<td>${tot.filter(v => v > 16.6).length}</td><td>${tot.filter(v => v > 19).length}</td></tr>`;
  });
  document.getElementById('shots').innerHTML = html;
  draw();
  addEventListener('resize', draw);
  document.getElementById('smooth').onchange = draw;
  document.getElementById('frame').onchange = draw;
})();
</script>
