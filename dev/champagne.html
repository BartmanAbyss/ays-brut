  const SCORE = [
//#D{
    // ?testpad=1: one plain held chord to judge the pad's timbre by. A test signal, never
    // shipped: these lines are dev-only.
    ...(cfg.testPad ? [[1, SHOW_END - 6, 45, 52, 57, 60, 64]] : []),
//#D}
  ];

  // The whole soundtrack, rendered offline before the click: a slow render costs load time,
  // never a hitch, and the browser's own oscillators are band-limited and its convolver
  // makes a hall from a buffer of noise. Seeded, so every run sounds the same.
//#D{
  let solo = null;   // a track name: song() renders that track alone, dry (a stem)
//#D}
  async function song(sr) {
    const o = new OfflineAudioContext(2, sr * (SHOW_END + 1), sr);
    // Three independent random sequences from one generator (Park-Miller): the liquid, the
    // pad and the bubbles each have their own, so editing one never reshuffles another.
    const rng = q => () => (q = q * 16807 % 2147483647) / 2147483647,
          rnd = rng(7), TAU = 2 * Math.PI;
    const gain = (v, to) => { const g = o.createGain(); g.gain.value = v; g.connect(to); return g; };
    // Two buses, each with a reverb of its own (built at the end): the pad's goes into a big
    // hall, the liquid's into a short room - one 4 s hall for both made the drips sound
    // like a cave.
    // A fixed master gain, not normalising: scanning and scaling 6 M rendered samples was
    // ~60 bytes. The harness shows the mix's peak in the audio column (red past 1).
    const out = gain(ui.master, o.destination);
    let bus = gain(1, out);
    const pb = bus;
//#D{
    // A stem keeps one track and leaves out the hall: each track routes into `bus` as it
    // is built, so the soloed one gets a line straight to the output and the others a gain
    // connected to nothing - which the renderer never pulls, so they cost nothing either.
    const only = solo;   // read once, before the first await: renders may overlap
    const tap = k => { if (only) bus = k === only ? gain(1, o.destination) : o.createGain(); };
    const keep = only === 'pad' && { ...ui };
    if (keep) Object.assign(ui, { drips: 0, pourBub: 0, fizzRate: 0 });
//#D}

    // The pad's own random sequence: editing the score must not reshuffle the drips.
    const r3 = rng(5);

    // The pad: PADsynth-lite. Nasca Octavian Paul's PADsynth (ZynAddSubFX) treats every
    // harmonic as a BAND of frequencies with random phases - the pitch scatter of an
    // ensemble - and renders one long table that loops seamlessly. Lite: no FFT; each band
    // is a dozen sines, each a whole number of cycles per loop so the table still loops,
    // summed with a rotating phasor - and 2 pi has to be exact (TAU): with 6.2832 the top
    // partials drifted up to 0.2 rad over one loop, and the seam clicked every 2.7 s. The band is padBw cents wide at the fundamental and
    // scales as h^(padBwScale - 1) in cents (1: as wide in pitch at every harmonic). Built
    // before the notes, so the score cannot change it.
    const PL = 1 << 17, PF = 220,    // loop length (2.7 s at 48 kHz), the pitch it is built at
          pt = o.createBuffer(1, PL, sr), pd = pt.getChannelData(0);
    for (let h = 1; h < 25; h++) for (let j = 0; j < 12; j++) {
      const g = r3() + r3() + r3() - 1.5,   // roughly gaussian
            w = TAU * Math.round(PF * h * 2 ** (g * ui.padBw * h ** (ui.padBwScale - 1) / 1200) * PL / sr) / PL,
            c = Math.cos(w), sn = Math.sin(w), ph = TAU * r3();
      let x = Math.cos(ph) / h, y = Math.sin(ph) / h;
      for (let i = 0; i < PL; i++) { pd[i] += y; const x1 = x * c - y * sn; y = x * sn + y * c; x = x1; }
    }

    // The score on the table: two copies per note from different points of the loop, panned
    // apart, notes of a chord up to padStagger apart, through one lowpass. (It replaced a
    // pad of five detuned saws per note, which sounded synthetic even with random detune,
    // drift and a Solina ensemble - and cost more: +136 bytes against +111.)
//#D{
    tap('pad');
//#D}
    const lp = o.createBiquadFilter();
    lp.frequency.value = ui.padCut; lp.connect(bus);
    for (const [t, len, ...notes] of SCORE) for (const m of notes) {
      const t0 = t + r3() * ui.padStagger;
      for (const pn of [-0.6, 0.6]) {
        const v = o.createBufferSource(), pan = o.createStereoPanner(), e = gain(0, pan);
        v.buffer = pt; v.loop = true; v.playbackRate.value = 2 ** ((m - 57) / 12);   // the table is built at PF = 220 Hz, MIDI 57
        pan.pan.value = pn; pan.connect(lp);
        e.gain.setTargetAtTime(ui.padGain, t0, ui.padAtk / 3);
        e.gain.setTargetAtTime(0, t0 + len, ui.padRel / 3);
        v.connect(e); v.start(t0, r3() * PL / sr); v.stop(t0 + len + ui.padRel * 2);
      }
    }

    const lb = bus = gain(1, out);

    // The liquid. Measured over a det run of the show: the pour runs throughout, the top
    // glass is already overflowing at t = 0 (the show starts from a warmed-up state), and
    // the second tier reaches its spill level between 19 and 26 s, which doubles the spray.
    // Loudness follows the camera too: 1 at the macro shot's distance, quieter when wide.
    const near = t => Math.min(1, 0.2 / evalShow(t).dist);
    // The drip and splash moments: a Poisson process whose rate follows the spill - each
    // [time, drip or splash, loudness from the camera, pan]. (A stream hiss and drips and
    // splashes of their own - sines chirping upward, high-passed noise - came first; the
    // bubble model below replaced them.)
    const EV = [];
    for (let t = 0; t < SHOW_END;) {
      const u = Math.min(1, Math.max(0, (t - 19) / 7));
      t -= Math.log(1 - rnd()) / (ui.drips * (1 + u * u * (3 - 2 * u)) + 1e-6);
      EV.push([t, rnd() < 0.7, near(t), rnd() * 0.8 + 0.1]);
    }

    // ── the liquid: the bubble model ──
    // van den Doel, "Physically based models for liquid sounds" (ACM TAP 2005): liquid
    // sound is bubbles ringing. A bubble of radius r rings at the Minnaert frequency 3/r Hz
    // (r in m), damped by d = 0.043 f + 0.0014 f^1.5 - so small bubbles are short high
    // ticks and only large ones ring - and one near the surface rises in pitch,
    // f(t) = f0 (1 + xi d t), xi ~0.1 for a falling drop (the old drips rose 2-4x, the
    // paper's "blowing through a straw"). Real liquid is a POPULATION: sizes drawn from
    // rates 1/r^gamma, loudness D r^alpha with D = rnd^beta (most bubbles deep and faint),
    // and only the loud, near-surface ones rise.
    const r2 = rnd;
    const bx = [0, 1, 2, 3, 4].map(() => o.createBuffer(2, sr * (SHOW_END + 1), sr)),
          BX = bx.map(b => [b.getChannelData(0), b.getChannelData(1)]);
    // one bubble: radius rm in mm, amplitude a, rise xi, pan 0..1, starting at t
    const bub = (Y, t, rm, a, xi, pan) => {
      const f = 3000 / rm, d = 0.043 * f + 0.0014 * f ** 1.5, k = Math.exp(-d / sr),
            i0 = t * sr | 0, n = 6 * sr / d | 0, gl = Math.sqrt(1 - pan), gr = Math.sqrt(pan);
      let ph = 0, e = a;
      for (let i = 0; i < n; i++, e *= k) {
        ph += f * (1 + xi * d * i / sr) / sr;
        const v = e * Math.sin(TAU * ph);
        Y[0][i0 + i] += v * gl; Y[1][i0 + i] += v * gr;
      }
    };
    // one bubble drawn from the population between lo and hi mm; b skews its depth (b = 1:
    // evenly loud, ui.bBeta: mostly deep and faint - right for a crowd of bubbles, wrong for
    // the one bubble a falling drop makes, which was then nearly always inaudible)
    const pop = (Y, t, a, lo, hi, pan, b = ui.bBeta) => {
      // inverse CDF of rates ~ 1/r^gamma; at gamma = 1 exactly the power form divides by
      // zero, so it takes 1e-3 there - log-uniform to within a hair (folded away in the
      // release, where gamma is a constant)
      const g = 1 - ui.bGamma || 1e-3, u = r2(), D = r2() ** b,
            rm = (lo ** g + u * (hi ** g - lo ** g)) ** (1 / g);
      // loudness relative to the largest size the call allows: with r^alpha in mm, one rare
      // 7 mm bubble near the surface peaked at 2.2 and the peak normalising turned the whole
      // soundtrack down 2.5x for it
      bub(Y, t, rm, a * D * (rm / hi) ** ui.bAlpha, D > ui.bRiseCut ? ui.bXi : 0, pan);
    };
    for (const [t, drip, nr, pan] of EV) {
      if (drip) {
        // a drip: its bubble, and often one or two smaller ones as it breaks up
        pop(BX[0], t, ui.dripGain * nr, ui.bRmin, ui.bRmax, pan, 1);
        for (let j = r2() * 3 | 0; j--;)
          pop(BX[0], t + 0.002 + r2() * 0.02, ui.dripGain * nr * 0.5, ui.bRmin, ui.bRmax / 2, pan);
      } else {
        // a splash: a cloud of bubbles, densest at the impact and thinning out
        for (let j = 0; j < ui.splashN; j++)
          pop(BX[1], t + ui.splashLen * r2() ** 2, ui.splashGain * nr, ui.bRmin, ui.bRmax,
              Math.min(1, Math.max(0, pan + (r2() - 0.5) * 0.3)));
      }
    }
    // the pour: a dense population of bubbles, louder with the glugs - the same pulse the
    // shader gives the bottle's flow (on show time here; equal to sim time while the
    // timeline runs at speed 1)
    const glugP = t => {
      const g = 6.2831853 * ui.glugHz * t;
      return 0.5 + 0.5 * ui.glug * Math.sin(g + 1.5 * Math.sin(g * 0.31)) * (0.6 + 0.4 * Math.sin(g * 0.13));
    };
    for (let t = 0; t < SHOW_END; t -= Math.log(1 - r2()) / ui.pourBub)
      pop(BX[2], t, ui.pourGain * near(t) * 2 * glugP(t), ui.bRmin, ui.bRmax, 0.3 + r2() * 0.4);
    // fizz: CO2 bubbles bursting at the surface of every filled glass - tiny (0.15-0.5 mm),
    // high, quick, rising in pitch as the cavity collapses (Poujol et al., "Sound of
    // effervescence", Phys. Rev. Fluids 2021). AT the surface, so not the population's
    // depth model: every burst is heard, at a random strength.
    for (let t = 0; t < SHOW_END; t -= Math.log(1 - r2()) / ui.fizzRate)
      bub(BX[3], t, 0.15 + r2() * 0.35, ui.fizzGain * near(t) * r2(), ui.fizzXi, r2());
    // The cork, before any picture, so the sound alone has to say what it is. Three parts:
    // the crack - a millisecond of broadband noise as the gas jet escapes (at about twice
    // the speed of sound: Liger-Belair et al., Science Advances 2019); the plop - the open
    // neck ringing as a Helmholtz resonator, gliding to popF as the cork clears it, over a
    // low thump of the gas expanding; and the rush - high-passed noise fading as the rest of
    // the gas leaves.
    for (let i = 0, ph = 0, tp = 0, lo = 0, i0 = ui.popT * sr | 0; i < sr * ui.hissLen * 4; i++) {
      const s = i / sr, x = r2() * 2 - 1,
            f = ui.popF * (1 - (1 - ui.popGlide) * Math.exp(-s / 0.008));
      // the thump falls like a kick drum: from twice popThumpF down to it within ~20 ms
      ph += f / sr; tp += ui.popThumpF * (1 + Math.exp(-s / 0.01)) / sr; lo += (x - lo) * 0.3;
      const v = ui.popGain * (Math.sin(TAU * ph) * Math.exp(-s / ui.popDecay)
        + ui.popThump * Math.sin(TAU * tp) * Math.exp(-s / ui.popThumpLen)
        + x * Math.exp(-s / 0.0007)
        + ui.hissGain * (x - lo) * Math.min(1, s / 0.01) * Math.exp(-s / ui.hissLen));
      BX[4][0][i0 + i] += v; BX[4][1][i0 + i] += v;
    }
    for (const b of bx) {
//#D{
      tap(['drips', 'splashes', 'pour', 'fizz', 'pop'][bx.indexOf(b)]);
//#D}
      const n = o.createBufferSource();
      n.buffer = b; n.connect(bus); n.start();
    }
//#D{
    if (keep) Object.assign(ui, keep);
    // the sample-loop tracks ARE their stems: a full render leaves them here for the player
    if (!only) song.raw = { drips: bx[0], splashes: bx[1], pour: bx[2], fizz: bx[3], pop: bx[4] };
//#D}

    // the reverbs: two channels of noise decaying to -60 dB, verbLen for the pad's hall and
    // fxVerbLen for the liquid's room (filled last, so their lengths do not move the random
    // sequence the drips are drawn from)
    for (const [from, len, mix] of [[pb, ui.verbLen, ui.verbMix], [lb, ui.fxVerbLen, ui.fxVerbMix]]) {
      const cv = o.createConvolver(), ir = o.createBuffer(2, sr * len, sr);
      for (let c = 0; c < 2; c++) {
        const d = ir.getChannelData(c);
        for (let i = 0; i < d.length; i++) d[i] = (rnd() * 2 - 1) * Math.exp(-7 * i / d.length);
      }
      cv.buffer = ir; cv.connect(out); from.connect(gain(mix, cv));
    }

    const b = await o.startRendering();
//#D{
    if (only) return b;   // stems stay raw: the live player applies the master gain
    // the mix's peak, shown in the audio column: past 1 the release clips
    let pk = 0;
    for (let c = 0; c < 2; c++) for (const x of b.getChannelData(c)) pk = Math.max(pk, Math.abs(x));
    song.peak = pk;
    const hd = document.querySelector('#uia .head');
    if (hd) { hd.textContent = 'audio - peak ' + pk.toFixed(2) + (pk > 1 ? '  CLIPS: lower master' : '');
              hd.style.color = pk > 1 ? '#f66' : ''; }
    // ?tick=1: a short click every half second over the top, to check the picture against
    // the audio
    if (cfg.tick) for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c);
      for (let i = 0; i < d.length; i++) {
        const k = i % (sr >> 1);
        if (k < 2000) d[i] += Math.sin(k * 0.3) * Math.exp(-k / 300) * 0.5;
      }
    }
//#D}
    return b;
  }
//#D{
  window.__song = song;   // await __song(48000) -> the AudioBuffer, for checking levels
  window.__stem = k => stem(k);   // await __stem('pad') -> one track alone, dry

  // ── live stems (harness only) ──
  // With ?gate=1 the harness plays the soundtrack as four stems through a live hall, so
  // each track switches on and off while the show runs (the trk* boxes), and letting go of
  // an audio slider re-renders just the stems it touches and swaps them in where playback
  // is. With everything on it is the release mix: the same stems, a hall built the same
  // way, and the gain the release normalises by (re-measured after every change).
  const STEMS = { pad: 'trkPad', drips: 'trkDrips', splashes: 'trkSplash', pour: 'trkPour', fizz: 'trkFizz',
                  pop: 'trkPop' };
  const BUB = ['drips', 'splashes', 'pour', 'fizz'];
  const AFFECTS = { padGain: ['pad'], padCut: ['pad'], padAtk: ['pad'], padRel: ['pad'],
                    padStagger: ['pad'], padBw: ['pad'], padBwScale: ['pad'], drips: ['drips', 'splashes'],
                    bRmin: BUB, bRmax: BUB, bGamma: BUB, bXi: BUB, bRiseCut: BUB, bBeta: BUB,
                    bAlpha: BUB, dripGain: ['drips'], splashGain: ['splashes'],
                    splashN: ['splashes'], splashLen: ['splashes'], pourGain: ['pour'],
                    pourBub: ['pour'], glug: ['pour'], glugHz: ['pour'], fizzGain: ['fizz'], fizzRate: ['fizz'], fizzXi: ['fizz'],
                    popT: ['pop'], popGain: ['pop'], popF: ['pop'], popGlide: ['pop'],
                    popDecay: ['pop'], popThump: ['pop'], popThumpF: ['pop'], popThumpLen: ['pop'],
                    hissGain: ['pop'], hissLen: ['pop'] };
  const live = window.__live = { buf: {}, src: {}, g: {} };
  let liveJob = Promise.resolve();
  function stem(k) {
    // the sample-loop tracks come straight from the last full render (song.raw); the pad
    // and the stream need a render of their own
    if (song.raw?.[k]) return Promise.resolve(song.raw[k]);
    // song() reads `solo` synchronously as it starts, so clearing it at once keeps any
    // render started meanwhile a full mix
    solo = k;
    const r = song(ac.sampleRate);
    solo = null;
    return r;
  }
  function hall(len) {   // a reverb into the master, built as song() builds its own
    // the release's hall: two channels of noise decaying to -60 dB over len
    const ir = ac.createBuffer(2, ac.sampleRate * len | 0, ac.sampleRate);
    let sd = 11;
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < d.length; i++)
        d[i] = ((sd = sd * 16807 % 2147483647) / 2147483647 * 2 - 1) * Math.exp(-7 * i / d.length);
    }
    const cv = ac.createConvolver();
    cv.buffer = ir; cv.connect(live.master);
    return cv;
  }
  async function liveSetup() {
    const g = (v, to) => { const x = ac.createGain(); x.gain.value = v; x.connect(to); return x; };
    live.master = g(ui.master, ac.destination);
    // the pad's bus into a hall, the liquid's into a room - as in song()
    live.mixP = g(1, live.master); live.mixL = g(1, live.master);
    live.cvP = hall(ui.verbLen); live.cvL = hall(ui.fxVerbLen);
    live.sendP = g(0, live.cvP); live.mixP.connect(live.sendP);
    live.sendL = g(0, live.cvL); live.mixL.connect(live.sendL);
    for (const k in STEMS) {
      live.g[k] = g(0, k === 'pad' ? live.mixP : live.mixL);
      live.buf[k] = await stem(k);
    }
    liveApply();
  }
  function liveApply() {
    if (!live.master) return;
    const now = ac.currentTime;
    for (const k in STEMS) live.g[k].gain.setTargetAtTime(ui[STEMS[k]] ? 1 : 0, now, 0.02);
    live.master.gain.setTargetAtTime(ui.master, now, 0.02);
    live.sendP.gain.setTargetAtTime(ui.trkVerb ? ui.verbMix : 0, now, 0.02);
    live.sendL.gain.setTargetAtTime(ui.trkVerb ? ui.fxVerbMix : 0, now, 0.02);
  }
  function liveStart(k, at, off) {
    const s = ac.createBufferSource();
    s.buffer = live.buf[k]; s.connect(live.g[k]); s.start(at, off);
    live.src[k]?.stop(at);
    live.src[k] = s;
  }
  // after "hear audio", a slider let go: re-render what it touches, swap it in at the
  // playback position, then re-measure the release's normalising gain
  function liveChange(key) {
    liveJob = liveJob.then(async () => {
      if (!live.master) return;
      if (key === 'verbLen' || key === 'fxVerbLen') {
        const P = key === 'verbLen', old = P ? live.cvP : live.cvL, send = P ? live.sendP : live.sendL;
        const cv = hall(ui[key]);
        if (P) live.cvP = cv; else live.cvL = cv;
        send.disconnect(); send.connect(cv);
        setTimeout(() => old.disconnect(), 100);
      }
      await song(ac.sampleRate);   // first: it refreshes song.raw and the mix's gain
      for (const k of AFFECTS[key] || []) {
        live.buf[k] = await stem(k);
        if (tA !== undefined) {
          const now = ac.currentTime + 0.05;
          liveStart(k, now, Math.max(0, now - tA));
        }
      }
      liveApply();
    });
  }
  for (const k in STEMS) uiEl[STEMS[k]].inp.addEventListener('input', liveApply);
  uiEl.trkVerb.inp.addEventListener('input', liveApply);
  for (const k of [...Object.keys(AFFECTS), 'verbMix', 'verbLen', 'fxVerbMix', 'fxVerbLen', 'master'])
    uiEl[k].inp.addEventListener('change', () => { liveApply(); liveChange(k); });
//#D}

  // ── start screen ──
  // Behind the gate the click starts everything: fullscreen, the audio, the render loop.
  // The text appears only once all of it is ready - pipelines compiled, soundtrack
  // rendered - so it doubles as "loaded".
  let ac, tA;                  // the audio context, and the audio time the show starts at
  if (cfg.gate) {
    ac = new AudioContext();
//#D{
    // The harness says what is happening: its HUD reads "booting" until the first frame and
    // hides the release's bare "click". Only this box starts the show, so the panel stays
    // usable meanwhile - set the track boxes before starting if you like.
    const say = document.createElement('div');
    say.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);' +
      'padding:24px 36px;font:22px sans-serif;color:#fff;background:#000c;border:1px solid #fff4;' +
      'border-radius:8px;z-index:9;cursor:pointer';
    say.textContent = 'rendering audio...';
    document.body.append(say);
//#D}
    const b = await song(ac.sampleRate);
//#D{
    if (!cfg.tick) await liveSetup();   // the harness plays stems instead (?tick=1 keeps the mix)
//#D}
    onclick = () => {
      onclick = null;
      // fullscreen is the screen: size the canvas once, here, rather than on every resize
      // (the release always; the harness only with ?fs=1). The BODY goes fullscreen, not the
      // canvas: fullscreen shows only that element and what is inside it, and with the canvas
      // the lettering's overlay beside it vanished - in Chrome, not in the browser pane,
      // which never goes fullscreen. The body's backdrop is black, as the canvas's was.
      if (cfg.fs) { canvas.width = screen.width; canvas.height = screen.height; document.body.requestFullscreen(); }
      ac.resume();
      const src = ac.createBufferSource();
      src.buffer = b; src.connect(ac.destination);
      src.start(tA = ac.currentTime + 0.1);
//#D{
      if (live.master) { src.disconnect(); for (const k in STEMS) liveStart(k, tA, 0); }
//#D}
      requestAnimationFrame(frame);
    };
    document.body.append('click');   // unstyled on purpose: -55 bytes against centred white-on-black
//#D{
    say.textContent = 'click here to start: show + sound';
    const go = onclick;
    onclick = null;
    say.onclick = () => { say.remove(); go(); if (cfg.paused) ac.suspend(); };
    pauseHook = v => { if (tA !== undefined) v ? ac.suspend() : ac.resume(); };
//#D}
  } else if (!cfg.paused) requestAnimationFrame(frame);

  // frame-count driven, not wall-clock: rAF pauses when the page isn't painting
  //#D{
  function runSelftest() {
    {
      const r = {};
      r.no_shader_errors = errors.filter(e => e.startsWith('[wgsl]')).length === 0;
      r.no_gpu_errors    = errors.filter(e => e.startsWith('[gpu]')).length === 0;
      r.rendered_frames  = probe.frames > 10;
      r.timestamps       = hasTS && probe.gpuMs.render > 0 && probe.gpuMs.build > 0;
      r.build_under_4ms  = (probe.gpuMs.build ?? 99) < 4;
      r.frame_under_16ms = (probe.gpuMs.total ?? 99) < 16.6;
      r.PASS = Object.values(r).every(Boolean);
      probe.selftest = r;
      console.log('SELFTEST ' + (r.PASS ? 'PASS' : 'FAIL') + ' ' + JSON.stringify(r));
    }
  }
  //#D}
})().catch(e => fail('main', e));
</script>
</body>
</html>
