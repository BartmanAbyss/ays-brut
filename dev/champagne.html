    if (doProf) { rp.setPipeline(renderX || renderProf); }   // renderX: a variant may add PROF: 1
    else if (renderX) { rp.setPipeline(renderX); }   // renderX (dev)
    rp.draw(3); rp.end();

    if (hasTS && !qbusy && qrd.mapState === 'unmapped') {
      enc.resolveQuerySet(qset, 0, LABELS.length * 2, qres, 0);
      enc.copyBufferToBuffer(qres, 0, qrd, 0, LABELS.length * 16);
    }
    if (gbusy === false && glassRd.mapState === 'unmapped') enc.copyBufferToBuffer(vecB, COARSE_N * 16, glassRd, 0, NG * 16);
    if (pbusy === false && partRd.mapState === 'unmapped') enc.copyBufferToBuffer(partBuf, 0, partRd, 0, PSAMP * 32);
    if (dbusy === false && pudRd.mapState === 'unmapped') enc.copyBufferToBuffer(fltB, PN * PN * 4, pudRd, 0, PCN * PCN * 4);
    if (doProf) { enc.copyBufferToBuffer(profB, 0, profRd, 0, 64 * 128 * 4); }
    device.queue.submit([enc.finish()]);
    if (doProf) { const r = profReq; profReq = null; flushProfile(r); }
    readTimestamps();
    readLevels();
    readParts();
    readPuddle();

    if (!cfg.gate) resize();   // the pane can be shown or resized without firing a resize event
    frameNo++; simStep += simSteps; probe.frames = frameNo; probe.ok = true;
    const dt = now - last; last = now;
    acc += dt; accN++;
    if (acc > 400) { probe.frameMs = acc / accN; probe.fps = 1000 / probe.frameMs; acc = 0; accN = 0; updateHud(); }
    if (cfg.selftest && !probe.selftest && frameNo > 10 && probe.gpuMs.total !== undefined) runSelftest();
    // A redraw must not schedule anything: frameOnce un-pauses so that frame() runs, and
    // this line used to see 'not paused' and queue a full frame - which stepped the sim
    // before noticing the pause. Every slider move on a paused page cost one hidden step.
    if (cfg.paused || redrawOnly) { updateHud(); return; }
    if (!cfg.still || frameNo < cfg.warm) requestAnimationFrame(frame); else updateHud();
  }

  //#D{
  function frameOnce() {
    const was = cfg.paused; cfg.paused = false; redrawOnly = true;
    frame();
    redrawOnly = false; cfg.paused = was;
  }
  //#D}

  //#D{
  function updateHud() {
    const g = probe.gpuMs;
    const f = k => g[k] !== undefined ? g[k].toFixed(2) : '—';
    hudEl.textContent =
      canvas.width + 'x' + canvas.height + '  view=' + (Q.get('view') ?? 'beauty') +
      '  part=' + cfg.npart + '\n' +
      'cpu   ' + probe.frameMs.toFixed(2) + ' ms   ' + probe.fps.toFixed(0) + ' fps\n' +
      'sim   ' + f('sim') + ' ms\n' +
      'build ' + f('build') + ' ms\n' +
      'rend  ' + f('render') + ' ms\n' +
      'gpu   ' + f('total') + ' ms\n' +
      't     ' + probe.time.toFixed(2) + ' s' + (cfg.t !== null ? ' (fixed)' : '') + (cfg.det ? '  det' : '') + '\n' +
      (ui.show ? 'show  ' + probe.showT.toFixed(2) + ' / ' + SHOW_END +
        '  shot ' + probe.shot + String.fromCharCode(10) : '') +
      'step  ' + probe.step + '  x' + probe.frameSteps +
        '   drift ' + (probe.drift * 1000).toFixed(1) + ' ms' +
        (probe.resyncs ? '   resync ' + probe.resyncs : '') + String.fromCharCode(10) +
      (probe.adapter?.vendor ?? '?') + ' / ' + (probe.adapter?.architecture ?? '?') +
      (errors.length ? '\nERRORS ' + errors.length : '');
  }

  //#D}
  // ── timeline ──
  // Keys are [t, angle deg, dist, camY, tgtY, simSpeed, ease]. Two keys sharing a t are
  // a CUT: the later one wins at that instant, so the change is immediate rather than a
  // one-frame blend. `ease` applies to the segment STARTING at that key - 1 for
  // smootherstep in and out, 0 for linear, so a long drift can run through several keys
  // without stalling at each one. simSpeed is keyed too: the fill takes ~30 s of sim time
  // and the camera does not want to wait for it, so the wide shots run the fluid faster.
  const SHOW = [
    [  0, 200, 1.000, 0.620, 0.280, 1.0, 1],   // high and wide, tower still empty
    [  9, 216, 0.820, 0.470, 0.270, 1.0, 1],
    [  9,  39, 0.180, 0.520, 0.480, 1.0, 1],   // cut: macro, stream into the top glass
    [ 18,  62, 0.170, 0.550, 0.492, 1.0, 1],
    [ 18,  39, 0.260, 0.400, 0.320, 1.0, 1],   // cut: tier 2 taking the overflow
    [ 27,  10, 0.300, 0.360, 0.300, 1.0, 1],
    [ 27, 124, 0.330, 0.170, 0.220, 1.0, 1],   // cut: low, looking up through the stems
    [ 36, 152, 0.360, 0.300, 0.240, 1.0, 1],
    [ 36,  32, 0.420, 0.460, 0.010, 1.0, 1],   // cut: down onto the table, caustics
    [ 45,  92, 0.460, 0.500, 0.010, 1.0, 1],
    [ 45, 250, 0.560, 0.400, 0.260, 1.0, 1],   // cut: pull back out
    [ 56, 300, 0.950, 0.500, 0.270, 1.0, 0],
    [ 60, 322, 1.000, 0.520, 0.270, 1.0, 0],
  ];
  const SHOW_END = SHOW[SHOW.length - 1][0];
  function evalShow(t) {
    t = Math.max(0, Math.min(t, SHOW_END));
    let i = 0;
    while (i < SHOW.length - 1 && SHOW[i + 1][0] <= t) { i++; }
    const a = SHOW[i], b = SHOW[Math.min(i + 1, SHOW.length - 1)];
    const span = b[0] - a[0];
    let u = span > 1e-6 ? (t - a[0]) / span : 0;
    if (a[6]) { u = u * u * u * (u * (u * 6 - 15) + 10); }   // smootherstep, as for shapes
    const m = k => a[k] + (b[k] - a[k]) * u;
    return { shot: i, angle: m(1), dist: m(2), camY: m(3), tgtY: m(4), speed: m(5) };
  }
  //#D{
  // Sim seconds elapsed by show time t. A seek needs the same integral the frame loop
  // builds step by step, or scrubbing would land somewhere playback never visits.
  function showIntegral(t) {
    let c = 0;
    const n = Math.round(t / SIM_DT);
    for (let i = 0; i < n; i++) { c += evalShow(i * SIM_DT).speed * SIM_DT * ui.simSpeed; }
    return c;
  }
  function seekShow(t) {
    const want = showIntegral(t);
    if (want < clockT - 1e-6) {
      // The fluid has no inverse - you cannot un-pour it - so going back means building
      // the state again from zero. Reload carrying the target; load-time seek does the rest.
      const q = new URLSearchParams(location.search);
      q.set('show', '1'); q.set('showt', t.toFixed(2));
      location.search = q.toString();
      return;
    }
    showStep = Math.round(t / SIM_DT); showT = showStep * SIM_DT; showPend = 0;
    clockT = want;
    burstSteps = Math.max(0, Math.ceil(want / SIM_DT) - simStep);   // may pass the cap
    if (cfg.paused) { requestAnimationFrame(frameOnce); }
  }

  //#D}
  // ── debug panel ──
  //#D{
  const SPEC = [
    ['show',     'check', false],
    ['showT',    'range', 0,    0,    SHOW_END, 0.05, 2],
    ['spin',     'check', true],
    ['angle',    'range', 0,    0,    360,  0.5,  1],
    ['dist',     'range', 0.80, 0.10, 1.80, 0.01, 2],
    ['camY',     'range', 0.44, 0.01, 1.10, 0.005,2],
    ['tgtY',     'range', 0.26, 0.00, 0.62, 0.005,2],
    ['lightAz',  'range', -45,  -180, 180,  1,    0],
    ['lightEl',  'range', 45.6,   5,  85,  0.5,  1],
    ['gridEnv',  'check', false],
    ['rtrace',   'range', 1,    0,    2,    1,    0],
    ['drops',    'check', true],
    ['bubbles',  'check', true],
    ['waves',    'check', true],
    ['puddle',   'check', true],
    ['reflect',  'check', true],
    ['autofill', 'check', true],
    ['fill',     'range', 80,   0,    100,  1,    0],
    ['pourRate', 'range', 120,  1,    250,  1,    0],
    ['dropVol',  'range', 6,    1,    60,   1,    0],
    ['dropRad',  'range', 2.0,  0.4,  6.0,  0.1,  1],
    ['foam',     'range', 1.0,  0.0,  3.0,  0.05, 2],
    ['bottle',   'check', true],
    ['botTilt',  'range', 118,  0,    170,  1,    0],
    ['botAz',    'range', 205, -180,  180,  1,    0],
    ['pourWander','range', 9,   0,    30,   0.5,  1],
    ['wanderSpd','range', 4.0,  0.2,  12,   0.1,  1],
    ['shutter',  'range', 0.5,  0.0,  2.5,  0.05, 2],
    ['bounces',  'range', 10,   2,    28,   1,    0],
    ['simSpeed', 'range', 1,    0,    16,   0.5,  1],
    ['expo',     'range', 1.45, 0.20, 4.00, 0.05, 2],
    ['cgain',    'range', 0.05, 0.00, 0.30, 0.005,3],
  ];
  const PRESET = {
    tower: { dist: 0.800, camY: 0.440, tgtY: 0.260, angle: 39 },
    bottl: { dist: 0.520, camY: 0.175, tgtY: 0.175, angle: 0 },     // solo bottle, use view=bottle
    pour:  { dist: 0.170, camY: 0.565, tgtY: 0.495, angle: 39 },   // top glass + incoming stream
    macro: { dist: 0.180, camY: 0.520, tgtY: 0.480, angle: 39 },   // top glass close-up
    tier2: { dist: 0.260, camY: 0.400, tgtY: 0.320, angle: 39 },   // middle tier
    top:   { dist: 0.420, camY: 0.460, tgtY: 0.010, angle: 32 },   // table / caustics
  };
  const TIPS = {
    view: 'Which pass to visualise. tir = red where the ray hit total internal reflection. beauty = final image. steps = raymarch cost heatmap, blue cheap and red expensive. normals = surface normals of the first hit. medium = what the first hit is, blue glass / gold champagne / grey table. liquid = the liquid field alone with the glass hidden. glass = the glass alone with the liquid hidden.',
    res: 'Render resolution. 1920x1080 is what the compo runs at and what the 16.6 ms budget means; 1280x720 for quick looks; fit renders at the window size. Letterboxed, and written into the URL so a reload keeps it.',
    cams: 'Camera presets. tower = the whole tower. macro = close-up of the top glass. tier2 = the middle tier. top = looking down at the table for the caustics.',
    show: 'Run the timeline: camera and simulation speed come from the SHOW keyframe table instead of these sliders, driven by the show clock. The sliders still read out what the timeline is doing.',
    showT: 'Scrub the show clock. Dragging moves the camera at once; on release the fluid catches up. Going backwards rebuilds the fluid from zero, so it reloads the page with ?showt= - the sim has no inverse.',
    spin: 'Auto-rotate the camera. Uncheck to drive the angle slider by hand.',
    angle: 'Camera orbit angle around the tower, in degrees. Only used when spin is off.',
    dist: 'Camera distance from the tower axis, in metres. Smaller is closer.',
    camY: 'Camera height above the table, in metres. The tower is 0.51 m tall.',
    tgtY: 'Height the camera aims at, in metres. 0.26 is mid-tower, 0.48 is the top glass.',
    lightAz: 'Key light azimuth in degrees: swings the light around the tower. Moves the specular, the shadows and the caustics together.',
    lightEl: 'Key light elevation in degrees above the horizon. Low is raking and dramatic, high is overhead.',
    gridEnv: 'Swap the environment for a lat-long UV test grid: green horizon, magenta poles, orange dot at the key light. Shows which direction a reflection or refraction samples.',
    rtrace: 'Traced reflections. 0 = environment lookup only (cheapest; near-grazing champagne turns into a flat bright disc). 1 = trace where air meets the champagne surface (and the splash zone just above it) and the bottle - where reflections read. 2 = trace glass reflections too - how it used to be, and on the pour shot about 40% of the render pass.',
    drops: 'Render the particle field: pour stream, splashes and droplets. Off leaves only the bulk liquid, but the simulation keeps running so the glasses still fill.',
    bubbles: 'Rising CO2 bubbles, carved out of the liquid as real geometry, so light refracts through every one.',
    puddle: 'The spreading pool of spilled champagne on the table. Off removes it from the scene entirely.',
    waves: 'Surface ripples from the per-glass wave equation. Off gives a perfectly flat liquid surface.',
    reflect: 'The Fresnel reflection lobe at every interface. Off removes all reflections. Diagnostic only, not physical.',
    autofill: 'Let the simulation decide the liquid levels. Uncheck to force every glass to the fill slider instead.',
    fill: 'Forced liquid level, as a percent of the spill level. Only used when autofill is off.',
    pourRate: 'Drops leaving the bottle per frame. Raise it for a dense continuous stream, lower it for separate falling drops.',
    wanderSpd: 'How quickly the bottle drifts around. Higher makes the pour restless and the stream whip about; lower is a slow lazy sway.',
    bottle: 'Show the magnum. It is an analytic shape only - there is no fluid simulated inside it yet.',
    botTilt: 'Tilt from upright, in degrees. 0 is standing up; pouring needs to go past horizontal, so 110-130 is the useful range. The mouth stays at the pour point and the body swings around it.',
    botAz: 'Which direction the magnum is held from, in degrees.',
    pourWander: 'How far the bottle drifts while pouring, in mm. A real pour is not perfectly aimed; the stream inherits the drift so it trails rather than falling dead straight. 0 is a perfectly steady pour.',
    shutter: 'Shutter length, in frames. Each drop is smeared into a streak along its own velocity, the way a camera records a moving liquid. 0 freezes every drop as a separate sphere; higher values turn fast spray into continuous ribbons.',
    foam: 'Mousse. Foam is generated where drops land, then collapses over a few seconds, so it builds up under the pour and around the rim where spill comes in. 0 disables it.',
    dropRad: 'Rendered radius of a droplet in mm. Below about 1.7 mm (the fine grid cell half-diagonal at 256 cubed) drops start falling between voxels, so a dense stream breaks up into scattered drops.',
    dropVol: 'Volume of one drop in microlitres. Together with pourRate this sets how fast the glasses fill: mL/s = pourRate x dropVol x 60 / 1000.',
    bounces: 'Maximum refraction/reflection interfaces per ray. Deep interior shots need 20+; the wide tower is fine around 8. Each extra bounce costs render time, and too few shatters the image into checkerboard shards where rays run out.',
    simSpeed: 'Simulation speed multiplier. The fluid runs on a fixed 1/60 s step whose index comes from the master clock, so refresh rate does not change its speed and a slow frame is caught up over the next ones (16 steps per frame maximum). Watch drift in the HUD: it should stay under one step. 0 freezes it while the camera keeps moving.',
    expo: 'Exposure applied before tonemapping.',
    cgain: 'Brightness of the photon caustic map on the table. It carries the direct light too, so 0 leaves the table lit by ambient only.',
  };
  const DIG = k => SPEC.find(x => x[0] === k)[6] ?? 2;
  const ui = {}, uiEl = {};
  const uiRoot = document.getElementById('ui');
  {
    const row = document.createElement('div'); row.className = 'row';
    const lab = document.createElement('label'); lab.textContent = 'view';
    const sel = document.createElement('select');
    sel.style.flex = '1'; sel.style.minWidth = '0';
    for (const k in VIEWS) {
      const o = document.createElement('option');
      o.value = VIEWS[k]; o.textContent = k; sel.append(o);
    }
    sel.value = cfg.view;
    row.title = TIPS.view;
    sel.oninput = () => { ui.view = parseFloat(sel.value); if (cfg.paused) requestAnimationFrame(frameOnce); };
    row.append(lab, sel); uiRoot.append(row);
  }
  ui.view = cfg.view;
  {
    const bar = document.createElement('div'); bar.className = 'cams';
    bar.title = TIPS.cams;
    for (const name of ['tower', 'pour', 'macro', 'tier2', 'top', 'bottl']) {
      const b = document.createElement('button');
      b.textContent = name;
      b.onclick = () => {
        ui.spin = false; uiEl.spin.inp.checked = false;
        ui.show = false; uiEl.show.inp.checked = false;
        for (const k in PRESET[name]) setUI(k, PRESET[name][k]);
        if (cfg.paused) requestAnimationFrame(frameOnce);
      };
      bar.append(b);
    }
    uiRoot.append(bar);
  }
  {
    // Resolution, at the very top. The budget is set at 1920x1080 and quick looks want
    // 1280x720; a click beats editing the URL. Applies live and keeps the URL in step, so
    // a reload or a pasted link agrees with what is on screen. `fit` goes back to the
    // window size.
    const bar = document.createElement('div'); bar.className = 'cams';
    bar.title = TIPS.res;
    for (const [label, w, h] of [['1920x1080', 1920, 1080], ['1280x720', 1280, 720], ['fit', 0, 0]]) {
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = () => {
        cfg.w = w; cfg.h = h;
        if (!w) { canvas.style.width = canvas.style.height = canvas.style.margin = ''; }
        lastVW = lastVH = -1;             // force the letterbox to recompute
        resize();
        const q = new URLSearchParams(location.search);
        if (w) { q.set('w', w); q.set('h', h); } else { q.delete('w'); q.delete('h'); }
        history.replaceState(null, '', '?' + q.toString());
        if (cfg.paused) requestAnimationFrame(frameOnce);
      };
      bar.append(b);
    }
    uiRoot.prepend(bar);
  }
  for (const [k, kind, def, lo, hi, st] of SPEC) {
    ui[k] = def;
    const row = document.createElement('div'); row.className = 'row';
    const lab = document.createElement('label'); lab.textContent = k;
    const inp = document.createElement('input');
    const out = document.createElement('span');
    if (kind === 'check') { inp.type = 'checkbox'; inp.checked = def; }
    else { inp.type = 'range'; inp.min = lo; inp.max = hi; inp.step = st; inp.value = def;
           out.textContent = (+def).toFixed(DIG(k)); }
    inp.oninput = () => {
      ui[k] = (kind === 'check') ? inp.checked : parseFloat(inp.value);
      if (kind !== 'check') out.textContent = (+ui[k]).toFixed(DIG(k));
      if (cfg.paused) requestAnimationFrame(frameOnce);   // keep the view live while paused
    };
    row.title = TIPS[k] || '';
    row.append(lab, inp, out); uiRoot.append(row);
    uiEl[k] = { inp, out };
  }
  function setUI(k, v) {
    ui[k] = v; uiEl[k].inp.value = v;
    uiEl[k].out.textContent = (+v).toFixed(DIG(k));
  }
  if (PRESET[cfg.cam]) {
    ui.spin = false; uiEl.spin.inp.checked = false;
    for (const k in PRESET[cfg.cam]) setUI(k, PRESET[cfg.cam][k]);
  }
  setUI('bounces', cfg.bounces);
  setUI('expo', cfg.expo);
  setUI('cgain', cfg.cgain);
  if (cfg.camQ.length) { ui.spin = false; uiEl.spin.inp.checked = false;
    for (const [k, v] of cfg.camQ) setUI(k, v); }
  if (cfg.fillQ !== null) { ui.autofill = false; uiEl.autofill.inp.checked = false; setUI('fill', cfg.fillQ); }

  // Scrubbing. oninput moves the camera at once, which is what blocking shots needs;
  // the fluid only follows on release, because catching it up is a burst of sim steps
  // and doing that per mouse-move would stall the drag.
  uiEl.showT.inp.oninput = () => {
    ui.showT = parseFloat(uiEl.showT.inp.value);
    showStep = Math.round(ui.showT / SIM_DT); showT = showStep * SIM_DT; showPend = 0;
    if (cfg.paused) { requestAnimationFrame(frameOnce); }
  };
  uiEl.showT.inp.onchange = () => seekShow(parseFloat(uiEl.showT.inp.value));
  if (cfg.show) {
    ui.show = true;  uiEl.show.inp.checked = true;
    ui.spin = false; uiEl.spin.inp.checked = false;
  }
  if (cfg.showt > 0) { seekShow(cfg.showt); }
  // seed the toggles from the URL params
  for (const [k, v] of [['drops', cfg.pfield], ['bubbles', cfg.bub], ['gridEnv', cfg.envg],
                        ['waves', cfg.wav], ['reflect', cfg.refl > 0.5],
                        ['puddle', Q.get('puddle') !== '0']]) {
    ui[k] = v; uiEl[k].inp.checked = v;
  }
  // Every range slider is also a URL parameter of the same name, so a framing or a look
  // travels as a link. Done last so it wins over presets.
  for (const [k, kind] of SPEC) { if (kind === 'range' && Q.has(k)) setUI(k, qf(k, ui[k])); }
  document.getElementById('restart').onclick = () => location.reload();
  document.getElementById('ff').onclick = () => { ffSteps = 1200; if (cfg.paused) requestAnimationFrame(frameOnce); };

  const btn = document.getElementById('pause');
  function setPaused(v) {
    const was = cfg.paused;
    cfg.paused = v;
    btn.textContent = v ? 'resume' : 'pause';
    // Resume from the moment we stopped, or the clock banks the whole pause and the sim
    // tries to catch up through it.
    if (was && !v) { last = performance.now(); requestAnimationFrame(frame); }
  }
  btn.onclick = () => setPaused(!cfg.paused);
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); setPaused(!cfg.paused); } });
  window.__pause  = () => { setPaused(true);  return 'paused'; };
  window.__resume = () => { setPaused(false); return 'running'; };
  setPaused(cfg.paused);
  //#D}

  // ── start screen and music ──
  // The song is the user's to compose - the party bans generated music. song() fills the
  // stereo buffers (L, R at sample rate sr) once, here, before the click, so a slow player
  // costs load time and never a hitch; until it exists the show plays silence of its own
  // length. Behind the gate the click starts everything: fullscreen, the audio, the render
  // loop. The text appears only once all of this is ready, so it doubles as "loaded".
  function song(L, R, sr) {
//#D{
    // ?tick=1: a short click every half second, to check the picture against the audio
    if (cfg.tick) for (let i = 0; i < L.length; i++) {
      const k = i % (sr >> 1);
      L[i] = R[i] = k < 2000 ? Math.sin(k * 0.3) * Math.exp(-k / 300) * 0.5 : 0;
    }
//#D}
  }
  let ac, tA;                  // the audio context, and the audio time the show starts at
  if (cfg.gate) {
    ac = new AudioContext();
    const b = ac.createBuffer(2, ac.sampleRate * (SHOW_END + 1), ac.sampleRate);
    song(b.getChannelData(0), b.getChannelData(1), ac.sampleRate);
    onclick = () => {
      onclick = null;
      // fullscreen is the screen: size the canvas once, here, rather than on every resize
      canvas.width = screen.width; canvas.height = screen.height;
      canvas.requestFullscreen();
      ac.resume();
      const src = ac.createBufferSource();
      src.buffer = b; src.connect(ac.destination);
      src.start(tA = ac.currentTime + 0.1);
      requestAnimationFrame(frame);
    };
    document.body.append('click');   // unstyled on purpose: -55 bytes against centred white-on-black
  } else if (!cfg.paused) requestAnimationFrame(frame);

  // frame-count driven, not wall-clock: rAF pauses when the page isn't painting
  //#D{
  function runSelftest() {
    {
      const r = {};
      r.no_shader_errors = errors.filter(e => e.startsWith('[wgsl]')).length === 0;
      r.no_gpu_errors    = errors.filter(e => e.startsWith('[gpu]')).length === 0;
      r.rendered_frames  = probe.frames > 10;
      r.timestamps       = hasTS && probe.gpuMs.render > 0 && probe.gpuMs.build > 0;
      r.build_under_4ms  = (probe.gpuMs.build ?? 99) < 4;
      r.frame_under_16ms = (probe.gpuMs.total ?? 99) < 16.6;
      r.PASS = Object.values(r).every(Boolean);
      probe.selftest = r;
      console.log('SELFTEST ' + (r.PASS ? 'PASS' : 'FAIL') + ' ' + JSON.stringify(r));
    }
  }
  //#D}
})().catch(e => fail('main', e));
</script>
</body>
</html>
