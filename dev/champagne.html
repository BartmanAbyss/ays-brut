  const lim = {};
  for (const k in want) if (adapter.limits[k] !== undefined) lim[k] = Math.min(want[k], adapter.limits[k]);
  const device = await adapter.requestDevice({
    requiredFeatures: hasTS ? ['timestamp-query'] : [],
    requiredLimits: lim,
  });
  device.addEventListener('uncapturederror', e => fail('gpu', e.error.message));
  device.lost.then(i => { if (i.reason !== 'destroyed') fail('device-lost', i.message); });

  const ctx = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: 'opaque' });

  // ── shader ──
  const code = document.getElementById('wgsl-main').textContent;
  device.pushErrorScope('validation');
  const module = device.createShaderModule({ code });
  for (const m of (await module.getCompilationInfo()).messages) {
    if (m.type === 'error') fail('wgsl', 'line ' + m.lineNum + ':' + m.linePos + ' ' + m.message);
  }

  // ── layouts ──
  const VIS = GPUShaderStage.COMPUTE | GPUShaderStage.FRAGMENT;
  const bgl0 = device.createBindGroupLayout({ entries: [
    { binding: 0, visibility: VIS, buffer: { type: 'uniform' } },
    { binding: 1, visibility: VIS, buffer: { type: 'storage' } },
    { binding: 2, visibility: VIS, buffer: { type: 'storage' } },
    { binding: 3, visibility: VIS, buffer: { type: 'storage' } },
    { binding: 4, visibility: VIS, buffer: { type: 'storage' } },
    { binding: 5, visibility: VIS, buffer: { type: 'storage' } },
    { binding: 6, visibility: VIS, buffer: { type: 'storage' } },
    { binding: 7, visibility: VIS, buffer: { type: 'storage' } },
    { binding: 8, visibility: VIS, buffer: { type: 'storage' } },
    { binding: 9, visibility: VIS, buffer: { type: 'storage' } },
    { binding: 10, visibility: VIS, buffer: { type: 'storage' } },
    { binding: 11, visibility: VIS, buffer: { type: 'storage' } },
    { binding: 12, visibility: VIS, buffer: { type: 'storage' } },
    { binding: 13, visibility: VIS, buffer: { type: 'storage' } },
    { binding: 14, visibility: VIS, buffer: { type: 'storage' } },
  ]});
  const bgl1 = device.createBindGroupLayout({ entries: [
    { binding: 0, visibility: VIS, buffer: { type: 'uniform', hasDynamicOffset: true, minBindingSize: 16 } },
  ]});
  const layout = device.createPipelineLayout({ bindGroupLayouts: [bgl0, bgl1] });

  // ── buffers ──
  const S = GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC;
  const ubo     = device.createBuffer({ size: 208, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const SUBSLOT = JFA_STRIDES.length;        // sub-step indices live after the JFA strides
  const jbo     = device.createBuffer({ size: 256 * (JFA_STRIDES.length + 16), usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const partBuf = device.createBuffer({ size: cfg.npart * 32, usage: S });
  const fineBuf = device.createBuffer({ size: FINE_N * 4, usage: S });
  const fineF   = device.createBuffer({ size: FINE_N * 4, usage: S });
  const coarse  = device.createBuffer({ size: COARSE_N * 16, usage: S });
  const glassB  = device.createBuffer({ size: NG * 16, usage: S });
  const gvol    = device.createBuffer({ size: NG * 2 * 4, usage: S });
  const waveB   = device.createBuffer({ size: NG * WN * WN * 16, usage: S });
  const wimp    = device.createBuffer({ size: NG * WN * WN * 2 * 4, usage: S });
  const caust   = device.createBuffer({ size: CN * CN * 3 * 4, usage: S });
  const caustF  = device.createBuffer({ size: CN * CN * 3 * 4, usage: S });
  const pud     = device.createBuffer({ size: PN * PN * 4, usage: S });
  const pudA    = device.createBuffer({ size: PN * PN * 4, usage: S });
  device.queue.writeBuffer(pud,  0, new Float32Array(PN * PN));
  device.queue.writeBuffer(pudA, 0, new Uint32Array(PN * PN));
  const pudC    = device.createBuffer({ size: PCN * PCN * 16, usage: S });
  const occB    = device.createBuffer({ size: COARSE_N * 4, usage: S });
  device.queue.writeBuffer(pudC, 0, new Float32Array(PCN * PCN * 4));
  const glassRd = device.createBuffer({ size: NG * 16, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const pudRd = device.createBuffer({ size: PCN * PCN * 16, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const PSAMP = Math.min(cfg.npart, 16384);
  const partRd = device.createBuffer({ size: PSAMP * 32, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  device.queue.writeBuffer(glassB, 0, new Float32Array(NG * 4));
  device.queue.writeBuffer(gvol,   0, new Uint32Array(NG * 2));
  device.queue.writeBuffer(waveB,  0, new Float32Array(NG * WN * WN * 4));
  device.queue.writeBuffer(wimp,   0, new Int32Array(NG * WN * WN * 2));

  // particles start dead and stagger in
  {
    const init = new Float32Array(cfg.npart * 8);
    for (let i = 0; i < cfg.npart; i++) init[i * 8 + 3] = -1;   // life
    device.queue.writeBuffer(partBuf, 0, init);
  }
  for (let i = 0; i < JFA_STRIDES.length; i++) {
    device.queue.writeBuffer(jbo, i * 256, new Float32Array([JFA_STRIDES[i], 0, 0, 0]));
  }
  for (let i = 0; i < 16; i++) {
    device.queue.writeBuffer(jbo, (SUBSLOT + i) * 256, new Float32Array([i, 0, 0, 0]));
  }

  const bg0 = device.createBindGroup({ layout: bgl0, entries: [
    { binding: 0, resource: { buffer: ubo } },
    { binding: 1, resource: { buffer: partBuf } },
    { binding: 2, resource: { buffer: fineBuf } },
    { binding: 3, resource: { buffer: fineF } },
    { binding: 4, resource: { buffer: coarse } },
    { binding: 5, resource: { buffer: glassB } },
    { binding: 6, resource: { buffer: gvol } },
    { binding: 7, resource: { buffer: waveB } },
    { binding: 8, resource: { buffer: wimp } },
    { binding: 9, resource: { buffer: caust } },
    { binding: 10, resource: { buffer: caustF } },
    { binding: 11, resource: { buffer: pud } },
    { binding: 12, resource: { buffer: pudA } },
    { binding: 13, resource: { buffer: pudC } },
    { binding: 14, resource: { buffer: occB } },
  ]});
  const bg1 = device.createBindGroup({ layout: bgl1, entries: [
    { binding: 0, resource: { buffer: jbo, size: 16 } },
  ]});

  const comp = n => device.createComputePipeline({ layout, compute: { module, entryPoint: n } });
  const P = {
    sim:     comp('simParticles'),
    clearF:  comp('clearFine'),
    clearC:  comp('clearCoarse'),
    scatter: comp('scatterFine'),
    seed:    comp('seedCoarse'),
    jfa:     comp('jfaCoarse'),
    resolve: comp('resolveFine'),
    glass:   comp('glassUpdate'),
    wave:    comp('waveUpdate'),
    decay:   comp('causticDecay'),
    photon:  comp('photons'),
    cblur:   comp('causticBlur'),
    puddle:  comp('puddleUpdate'),
    pudC:    comp('puddleCoarse'),
    pudJ:    comp('puddleJFA'),
  };
  const render = device.createRenderPipeline({
    layout,
    vertex:   { module, entryPoint: 'vs' },
    fragment: { module, entryPoint: 'fs', targets: [{ format }] },
    primitive:{ topology: 'triangle-list' },
  });
  const verr = await device.popErrorScope();
  if (verr) fail('pipeline', verr.message);

  // ── timing: 3 labelled pass groups ──
  const LABELS = ['sim', 'build', 'photon', 'render'];
  let qset = null, qres = null, qrd = null, qbusy = false;
  if (hasTS) {
    qset = device.createQuerySet({ type: 'timestamp', count: LABELS.length * 2 });
    qres = device.createBuffer({ size: LABELS.length * 16, usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC });
    qrd  = device.createBuffer({ size: LABELS.length * 16, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  }
  const ts = i => hasTS ? { querySet: qset, beginningOfPassWriteIndex: i * 2, endOfPassWriteIndex: i * 2 + 1 } : undefined;

  let lastVW = -1, lastVH = -1;
  function resize() {
    const bw = Math.max(1, Math.floor(cfg.w || canvas.clientWidth));
    const bh = Math.max(1, Math.floor(cfg.h || canvas.clientHeight));
    if (canvas.width  !== bw) canvas.width  = bw;
    if (canvas.height !== bh) canvas.height = bh;
    if (!cfg.w || !cfg.h) return;
    // The CSS stretches the canvas to the viewport, so an explicit w/h of a different
    // aspect silently distorts the picture. Letterbox rather than lie about proportions.
    // A viewport of zero (pane hidden at load, tab restored in the background) scaled it
    // to 0px and left it there - invisible, while the GPU went on rendering full size -
    // because the explicit-size path skipped the resize listener. Never apply a zero, and
    // re-check whenever the viewport changes rather than only at load.
    if (innerWidth < 1 || innerHeight < 1) return;
    if (innerWidth === lastVW && innerHeight === lastVH) return;
    lastVW = innerWidth; lastVH = innerHeight;
    const k = Math.min(innerWidth / cfg.w, innerHeight / cfg.h);
    canvas.style.width  = (cfg.w * k) + 'px';
    canvas.style.height = (cfg.h * k) + 'px';
    canvas.style.margin = ((innerHeight - cfg.h * k) / 2) + 'px auto 0';
  }
  resize();
  addEventListener('resize', resize);

  const SIM_DT = 1 / 60;
  let simAcc = 0;
  const f32 = new Float32Array(48);
  const t0 = performance.now();
  let last = t0, acc = 0, accN = 0, frameNo = 0, simStep = 0, ffSteps = 0;
  const pudBound = [0, 0, 0.02];   // wet-region bounding circle, from the coarse readback

  function writeUniforms(time) {
    let ang;
    if (ui.spin) { ang = time * 0.25; setUI('angle', (ang * 180 / Math.PI) % 360); }
    else         { ang = ui.angle * Math.PI / 180; }
    const cam = [Math.sin(ang) * ui.dist, ui.camY, Math.cos(ang) * ui.dist];
    const tgt = [0, ui.tgtY, 0];
    f32[0] = canvas.width; f32[1] = canvas.height; f32[2] = time; f32[3] = ui.view;
    f32[4] = cam[0]; f32[5] = cam[1]; f32[6] = cam[2];
    f32[7] = 1.6;
    f32[8] = tgt[0]; f32[9] = tgt[1]; f32[10] = tgt[2]; f32[11] = cfg.steps;
    // a real pour is not perfectly aimed: let the bottle wander on a slow Lissajous
    const K = ui.wanderSpd;
    const wob = tt => [Math.sin(tt * 0.37 * K) * 0.62 + Math.sin(tt * 0.91 * K + 1.3) * 0.38,
                       Math.cos(tt * 0.29 * K + 2.1) * 0.62 + Math.sin(tt * 0.73 * K + 0.7) * 0.38];
    const W = ui.pourWander * 0.001;
    const w0 = wob(time), w1 = wob(time + 0.02);
    f32[12] = w0[0] * W; f32[13] = 0.555; f32[14] = w0[1] * W;
    f32[37] = (w1[0] - w0[0]) * W / 0.02;      // bottle drift velocity
    f32[38] = (w1[1] - w0[1]) * W / 0.02;
    f32[15] = SIM_DT;                           // fixed step    // emitPos (inside domain), dt
    f32[16] = simStep; f32[17] = Math.max(1, Math.round((cfg.npart / 6) / ui.pourRate)); f32[18] = cfg.npart; f32[19] = ui.dropVol * 1e-9;
    f32[20] = cfg.nphoton; f32[21] = ui.cgain;
    f32[22] = cfg.single ? 1 : 0; f32[23] = cfg.noliq ? 1 : 0;
    f32[24] = ui.bubbles ? 1 : 0; f32[25] = ui.expo; f32[26] = ui.waves ? 1 : 0; f32[27] = ui.drops ? 1 : 0; f32[28] = ui.bounces; f32[29] = ui.reflect ? 1 : 0; f32[30] = ui.autofill ? -1 : ui.fill / 100; f32[31] = ui.gridEnv ? 1 : 0; f32[32] = ui.rtrace ? 1 : 0;
    f32[33] = ui.lightAz * Math.PI / 180; f32[34] = ui.lightEl * Math.PI / 180;
    f32[35] = ui.dropRad * 0.001; f32[36] = ui.foam; f32[39] = ui.shutter * SIM_DT;
    f32[40] = ui.botTilt * Math.PI / 180; f32[41] = ui.botAz * Math.PI / 180;
    f32[42] = ui.bottle ? 1 : 0;
    f32[43] = pudBound[0]; f32[44] = pudBound[1]; f32[45] = pudBound[2]; f32[46] = ui.puddle ? 1 : 0;
    device.queue.writeBuffer(ubo, 0, f32);
  }

  async function readTimestamps() {
    if (!hasTS || qbusy || qrd.mapState !== 'unmapped') return;
    qbusy = true;
    try {
      await qrd.mapAsync(GPUMapMode.READ);
      const b = new BigInt64Array(qrd.getMappedRange().slice(0));
      qrd.unmap();
      let tot = 0;
      LABELS.forEach((l, i) => {
        const ms = Number(b[i * 2 + 1] - b[i * 2]) / 1e6;
        probe.gpuMs[l] = ms; tot += ms;
      });
      probe.gpuMs.total = tot;
    } catch (e) {}
    qbusy = false;
  }

  let dbusy = false;
  async function readPuddle() {
    if (dbusy || pudRd.mapState !== 'unmapped') return;
    dbusy = true;
    try {
      await pudRd.mapAsync(GPUMapMode.READ);
      const a = new Float32Array(pudRd.getMappedRange().slice(0));
      pudRd.unmap();
      let mx = 0, wet = 0, x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
      const PEXT = 0.55, CELL = 2 * PEXT / PCN;
      for (let k = 0; k < PCN * PCN; k++) {
        const h = a[k * 4];
        if (h > mx) mx = h;
        if (h > 0.0004) {
          wet++;
          const bx = (k % PCN) * CELL - PEXT, bz = Math.floor(k / PCN) * CELL - PEXT;
          if (bx < x0) x0 = bx; if (bx + CELL > x1) x1 = bx + CELL;
          if (bz < z0) z0 = bz; if (bz + CELL > z1) z1 = bz + CELL;
        }
      }
      if (wet) {
        pudBound[0] = (x0 + x1) / 2; pudBound[1] = (z0 + z1) / 2;
        pudBound[2] = 0.5 * Math.hypot(x1 - x0, z1 - z0) + CELL;
      } else { pudBound[0] = 0; pudBound[1] = 0; pudBound[2] = 0; }
      probe.puddle = { maxMM: +(mx * 1000).toFixed(2), wetBlocks: wet, ofBlocks: PCN * PCN,
                       boundR: +pudBound[2].toFixed(3) };
    } catch (e) {}
    dbusy = false;
  }

  let pbusy = false;
  async function readParts() {
    if (pbusy || partRd.mapState !== 'unmapped') return;
    pbusy = true;
    try {
      await partRd.mapAsync(GPUMapMode.READ);
      const a = new Float32Array(partRd.getMappedRange().slice(0));
      partRd.unmap();
      const POOL = Math.max(Math.floor(cfg.npart / 6), 1);
      let alive = 0, aliveBottle = 0, ymin = 1e9, ymax = -1e9;
      for (let k = 0; k < PSAMP; k++) {
        const life = a[k * 8 + 3];
        if (life > 0) {
          alive++;
          if (k < POOL) { aliveBottle++; const y = a[k * 8 + 1]; if (y < ymin) ymin = y; if (y > ymax) ymax = y; }
        }
      }
      probe.parts = { sampled: PSAMP, alive, aliveBottle, pool: POOL,
                      bottleY: aliveBottle ? [+ymin.toFixed(3), +ymax.toFixed(3)] : null };
    } catch (e) {}
    pbusy = false;
  }

  let gbusy = false;
  async function readLevels() {
    if (gbusy || glassRd.mapState !== 'unmapped') return;
    gbusy = true;
    try {
      await glassRd.mapAsync(GPUMapMode.READ);
      const a = new Float32Array(glassRd.getMappedRange().slice(0));
      glassRd.unmap();
      probe.levels = Array.from({length: NG}, (_, i) => +(a[i*4]*1000).toFixed(2));  // mm
      probe.filled = probe.levels.filter(v => v > 0.1).length;
    } catch (e) {}
    gbusy = false;
  }

  const WG = (n, s) => Math.ceil(n / s);

  function frame() {
    const now = performance.now();
    // One sim step per rendered frame, never more. Catching up after a hitch would make
    // the fluid jump, and because the emitter's spawn cadence is keyed to the frame, extra
    // substeps advanced the drops without emitting new ones - the stream visibly thinned.
    // A slow frame therefore runs slightly slow rather than skipping ahead.
    simAcc += Math.min((now - last) / 1000, 0.25) * ui.simSpeed;
    // simSpeed deliberately runs more steps; the cap only stops a HITCH from being caught
    // up, which would make the fluid jump. Leftover time is discarded, not banked.
    const maxSub = Math.min(16, Math.max(1, Math.ceil(ui.simSpeed)));
    const simSteps = Math.min(maxSub, Math.floor(simAcc / SIM_DT)) + ffSteps;
    simAcc = Math.min(simAcc - Math.min(maxSub, Math.floor(simAcc / SIM_DT)) * SIM_DT, SIM_DT);
    ffSteps = 0;
    const time = cfg.t !== null ? cfg.t : (now - t0) / 1000;
    probe.time = time;
    writeUniforms(time);

    const enc = device.createCommandEncoder();

    // 1 — particles
    let cp = enc.beginComputePass({ timestampWrites: ts(0) });
    cp.setBindGroup(0, bg0); cp.setBindGroup(1, bg1, [0]);
    // Fixed-step accumulator: the sim must advance at the same rate on a 60 Hz compo
    // machine as on a 165 Hz monitor. Driving dt off the frame rate made it 2.75x fast here.
    cp.setPipeline(P.sim);
    for (let k = 0; k < simSteps; k++) {
      cp.setBindGroup(1, bg1, [(SUBSLOT + (k % 16)) * 256]);
      cp.dispatchWorkgroups(WG(cfg.npart, 64));
    }
    cp.setBindGroup(1, bg1, [0]);
    cp.end();

    // 2 — build the distance field (ordered dispatches share one pass)
    cp = enc.beginComputePass({ timestampWrites: ts(1) });
    cp.setBindGroup(0, bg0); cp.setBindGroup(1, bg1, [0]);
    cp.setPipeline(P.puddle);  cp.dispatchWorkgroups(WG(PN * PN, 256));
    cp.setPipeline(P.pudC);    cp.dispatchWorkgroups(WG(PCN * PCN, 64));
    cp.setPipeline(P.pudJ);
    for (let k = 0; k < JFA_STRIDES.length; k++) {
      cp.setBindGroup(1, bg1, [k * 256]);
      cp.dispatchWorkgroups(WG(PCN * PCN, 64));
    }
    cp.setBindGroup(1, bg1, [0]);
    cp.setPipeline(P.glass);   cp.dispatchWorkgroups(1);
    cp.setPipeline(P.wave);
    for (let k = 0; k < 3; k++) cp.dispatchWorkgroups(WG(NG * WN * WN, 64));
    cp.setPipeline(P.clearF);  cp.dispatchWorkgroups(WG(FINE_N, 512));
    cp.setPipeline(P.clearC);  cp.dispatchWorkgroups(WG(COARSE_N, 64));
    cp.setPipeline(P.scatter); cp.dispatchWorkgroups(WG(cfg.npart, 64));
    cp.setPipeline(P.seed);    cp.dispatchWorkgroups(WG(cfg.npart, 64));
    cp.setPipeline(P.jfa);
    for (let i = 0; i < JFA_STRIDES.length; i++) {
      cp.setBindGroup(1, bg1, [i * 256]);
      cp.dispatchWorkgroups(WG(COARSE_N, 64));
    }
    cp.setBindGroup(1, bg1, [0]);
    cp.setPipeline(P.resolve); cp.dispatchWorkgroups(WG(FINE_N, 512));
    cp.end();

    // 2b — caustics: fade the photon map, then shoot this frame's photons
    cp = enc.beginComputePass({ timestampWrites: ts(2) });
    cp.setBindGroup(0, bg0); cp.setBindGroup(1, bg1, [0]);
    cp.setPipeline(P.decay);  cp.dispatchWorkgroups(WG(CN * CN * 3, 256));
    cp.setPipeline(P.photon); cp.dispatchWorkgroups(WG(cfg.nphoton, 64));
    cp.setPipeline(P.cblur);  cp.dispatchWorkgroups(WG(CN * CN, 256));
    cp.end();

    // 3 — render
    const desc = {
      colorAttachments: [{
        view: ctx.getCurrentTexture().createView(),
        clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: 'clear', storeOp: 'store',
      }],
    };
    if (hasTS) desc.timestampWrites = ts(3);
    const rp = enc.beginRenderPass(desc);
    rp.setPipeline(render); rp.setBindGroup(0, bg0); rp.setBindGroup(1, bg1, [0]);
    rp.draw(3); rp.end();

    if (hasTS && !qbusy && qrd.mapState === 'unmapped') {
      enc.resolveQuerySet(qset, 0, LABELS.length * 2, qres, 0);
      enc.copyBufferToBuffer(qres, 0, qrd, 0, LABELS.length * 16);
    }
    if (gbusy === false && glassRd.mapState === 'unmapped') enc.copyBufferToBuffer(glassB, 0, glassRd, 0, NG * 16);
    if (pbusy === false && partRd.mapState === 'unmapped') enc.copyBufferToBuffer(partBuf, 0, partRd, 0, PSAMP * 32);
    if (dbusy === false && pudRd.mapState === 'unmapped') enc.copyBufferToBuffer(pudC, 0, pudRd, 0, PCN * PCN * 16);
    device.queue.submit([enc.finish()]);
    readTimestamps();
    readLevels();
    readParts();
    readPuddle();

    resize();   // the pane can be shown or resized without firing a resize event
    frameNo++; simStep += simSteps; probe.frames = frameNo; probe.ok = true;
    const dt = now - last; last = now;
    acc += dt; accN++;
    if (acc > 400) { probe.frameMs = acc / accN; probe.fps = 1000 / probe.frameMs; acc = 0; accN = 0; updateHud(); }
    if (cfg.selftest && !probe.selftest && frameNo > 10 && probe.gpuMs.total !== undefined) runSelftest();
    if (cfg.paused) { updateHud(); return; }
    if (!cfg.still || frameNo < cfg.warm) requestAnimationFrame(frame); else updateHud();
  }

  function frameOnce() { const was = cfg.paused; cfg.paused = false; frame(); cfg.paused = was; }

  function updateHud() {
    const g = probe.gpuMs;
    const f = k => g[k] !== undefined ? g[k].toFixed(2) : '—';
    hudEl.textContent =
      canvas.width + 'x' + canvas.height + '  view=' + (Q.get('view') ?? 'beauty') +
      '  part=' + cfg.npart + '\n' +
      'cpu   ' + probe.frameMs.toFixed(2) + ' ms   ' + probe.fps.toFixed(0) + ' fps\n' +
      'sim   ' + f('sim') + ' ms\n' +
      'build ' + f('build') + ' ms\n' +
      'rend  ' + f('render') + ' ms\n' +
      'gpu   ' + f('total') + ' ms\n' +
      't     ' + probe.time.toFixed(2) + ' s' + (cfg.t !== null ? ' (fixed)' : '') + '\n' +
      (probe.adapter?.vendor ?? '?') + ' / ' + (probe.adapter?.architecture ?? '?') +
      (errors.length ? '\nERRORS ' + errors.length : '');
  }

  // ── debug panel ──
  const SPEC = [
    ['spin',     'check', true],
    ['angle',    'range', 0,    0,    360,  0.5,  1],
    ['dist',     'range', 0.80, 0.10, 1.80, 0.01, 2],
    ['camY',     'range', 0.44, 0.01, 1.10, 0.005,2],
    ['tgtY',     'range', 0.26, 0.00, 0.62, 0.005,2],
    ['lightAz',  'range', -45,  -180, 180,  1,    0],
    ['lightEl',  'range', 45.6,   5,  85,  0.5,  1],
    ['gridEnv',  'check', false],
    ['rtrace',   'check', true],
    ['drops',    'check', true],
    ['bubbles',  'check', true],
    ['waves',    'check', true],
    ['puddle',   'check', true],
    ['reflect',  'check', true],
    ['autofill', 'check', true],
    ['fill',     'range', 80,   0,    100,  1,    0],
    ['pourRate', 'range', 120,  1,    250,  1,    0],
    ['dropVol',  'range', 6,    1,    60,   1,    0],
    ['dropRad',  'range', 2.0,  0.4,  6.0,  0.1,  1],
    ['foam',     'range', 1.0,  0.0,  3.0,  0.05, 2],
    ['bottle',   'check', true],
    ['botTilt',  'range', 118,  0,    170,  1,    0],
    ['botAz',    'range', 205, -180,  180,  1,    0],
    ['pourWander','range', 9,   0,    30,   0.5,  1],
    ['wanderSpd','range', 4.0,  0.2,  12,   0.1,  1],
    ['shutter',  'range', 0.5,  0.0,  2.5,  0.05, 2],
    ['bounces',  'range', 10,   2,    28,   1,    0],
    ['simSpeed', 'range', 1,    0,    16,   0.5,  1],
    ['expo',     'range', 1.45, 0.20, 4.00, 0.05, 2],
    ['cgain',    'range', 0.05, 0.00, 0.30, 0.005,3],
  ];
  const PRESET = {
    tower: { dist: 0.800, camY: 0.440, tgtY: 0.260, angle: 39 },
    bottl: { dist: 0.520, camY: 0.175, tgtY: 0.175, angle: 0 },     // solo bottle, use view=bottle
    pour:  { dist: 0.170, camY: 0.565, tgtY: 0.495, angle: 39 },   // top glass + incoming stream
    macro: { dist: 0.180, camY: 0.520, tgtY: 0.480, angle: 39 },   // top glass close-up
    tier2: { dist: 0.260, camY: 0.400, tgtY: 0.320, angle: 39 },   // middle tier
    top:   { dist: 0.420, camY: 0.460, tgtY: 0.010, angle: 32 },   // table / caustics
  };
  const TIPS = {
    view: 'Which pass to visualise. tir = red where the ray hit total internal reflection. beauty = final image. steps = raymarch cost heatmap, blue cheap and red expensive. normals = surface normals of the first hit. medium = what the first hit is, blue glass / gold champagne / grey table. liquid = the liquid field alone with the glass hidden. glass = the glass alone with the liquid hidden.',
    cams: 'Camera presets. tower = the whole tower. macro = close-up of the top glass. tier2 = the middle tier. top = looking down at the table for the caustics.',
    spin: 'Auto-rotate the camera. Uncheck to drive the angle slider by hand.',
    angle: 'Camera orbit angle around the tower, in degrees. Only used when spin is off.',
    dist: 'Camera distance from the tower axis, in metres. Smaller is closer.',
    camY: 'Camera height above the table, in metres. The tower is 0.51 m tall.',
    tgtY: 'Height the camera aims at, in metres. 0.26 is mid-tower, 0.48 is the top glass.',
    lightAz: 'Key light azimuth in degrees: swings the light around the tower. Moves the specular, the shadows and the caustics together.',
    lightEl: 'Key light elevation in degrees above the horizon. Low is raking and dramatic, high is overhead.',
    gridEnv: 'Swap the environment for a lat-long UV test grid: green horizon, magenta poles, orange dot at the key light. Shows which direction a reflection or refraction samples.',
    rtrace: 'Trace real reflection rays instead of just sampling the environment. Off is cheaper but paints flat bright discs on near-grazing surfaces.',
    drops: 'Render the particle field: pour stream, splashes and droplets. Off leaves only the bulk liquid, but the simulation keeps running so the glasses still fill.',
    bubbles: 'Rising CO2 bubbles, carved out of the liquid as real geometry, so light refracts through every one.',
    puddle: 'The spreading pool of spilled champagne on the table. Off removes it from the scene entirely.',
    waves: 'Surface ripples from the per-glass wave equation. Off gives a perfectly flat liquid surface.',
    reflect: 'The Fresnel reflection lobe at every interface. Off removes all reflections. Diagnostic only, not physical.',
    autofill: 'Let the simulation decide the liquid levels. Uncheck to force every glass to the fill slider instead.',
    fill: 'Forced liquid level, as a percent of the spill level. Only used when autofill is off.',
    pourRate: 'Drops leaving the bottle per frame. Raise it for a dense continuous stream, lower it for separate falling drops.',
    wanderSpd: 'How quickly the bottle drifts around. Higher makes the pour restless and the stream whip about; lower is a slow lazy sway.',
    bottle: 'Show the magnum. It is an analytic shape only - there is no fluid simulated inside it yet.',
    botTilt: 'Tilt from upright, in degrees. 0 is standing up; pouring needs to go past horizontal, so 110-130 is the useful range. The mouth stays at the pour point and the body swings around it.',
    botAz: 'Which direction the magnum is held from, in degrees.',
    pourWander: 'How far the bottle drifts while pouring, in mm. A real pour is not perfectly aimed; the stream inherits the drift so it trails rather than falling dead straight. 0 is a perfectly steady pour.',
    shutter: 'Shutter length, in frames. Each drop is smeared into a streak along its own velocity, the way a camera records a moving liquid. 0 freezes every drop as a separate sphere; higher values turn fast spray into continuous ribbons.',
    foam: 'Mousse. Foam is generated where drops land, then collapses over a few seconds, so it builds up under the pour and around the rim where spill comes in. 0 disables it.',
    dropRad: 'Rendered radius of a droplet in mm. Below about 1.7 mm (the fine grid cell half-diagonal at 256 cubed) drops start falling between voxels, so a dense stream breaks up into scattered drops.',
    dropVol: 'Volume of one drop in microlitres. Together with pourRate this sets how fast the glasses fill: mL/s = pourRate x dropVol x 60 / 1000.',
    bounces: 'Maximum refraction/reflection interfaces per ray. Deep interior shots need 20+; the wide tower is fine around 8. Each extra bounce costs render time, and too few shatters the image into checkerboard shards where rays run out.',
    simSpeed: 'Simulation speed multiplier. The fluid runs on a fixed 1/60 s step driven by real elapsed time, so refresh rate does not change its speed. At most one step per frame: a slow frame runs slightly slow rather than jumping to catch up. 0 freezes it while the camera keeps moving.',
    expo: 'Exposure applied before tonemapping.',
    cgain: 'Brightness of the photon caustic map on the table. It carries the direct light too, so 0 leaves the table lit by ambient only.',
  };
  const DIG = k => SPEC.find(x => x[0] === k)[6] ?? 2;
  const ui = {}, uiEl = {};
  const uiRoot = document.getElementById('ui');
  {
    const row = document.createElement('div'); row.className = 'row';
    const lab = document.createElement('label'); lab.textContent = 'view';
    const sel = document.createElement('select');
    sel.style.flex = '1'; sel.style.minWidth = '0';
    for (const k in VIEWS) {
      const o = document.createElement('option');
      o.value = VIEWS[k]; o.textContent = k; sel.append(o);
    }
    sel.value = cfg.view;
    row.title = TIPS.view;
    sel.oninput = () => { ui.view = parseFloat(sel.value); if (cfg.paused) requestAnimationFrame(frameOnce); };
    row.append(lab, sel); uiRoot.append(row);
  }
  ui.view = cfg.view;
  {
    const bar = document.createElement('div'); bar.className = 'cams';
    bar.title = TIPS.cams;
    for (const name of ['tower', 'pour', 'macro', 'tier2', 'top', 'bottl']) {
      const b = document.createElement('button');
      b.textContent = name;
      b.onclick = () => {
        ui.spin = false; uiEl.spin.inp.checked = false;
        for (const k in PRESET[name]) setUI(k, PRESET[name][k]);
        if (cfg.paused) requestAnimationFrame(frameOnce);
      };
      bar.append(b);
    }
    uiRoot.append(bar);
  }
  for (const [k, kind, def, lo, hi, st] of SPEC) {
    ui[k] = def;
    const row = document.createElement('div'); row.className = 'row';
    const lab = document.createElement('label'); lab.textContent = k;
    const inp = document.createElement('input');
    const out = document.createElement('span');
    if (kind === 'check') { inp.type = 'checkbox'; inp.checked = def; }
    else { inp.type = 'range'; inp.min = lo; inp.max = hi; inp.step = st; inp.value = def;
           out.textContent = (+def).toFixed(DIG(k)); }
    inp.oninput = () => {
      ui[k] = (kind === 'check') ? inp.checked : parseFloat(inp.value);
      if (kind !== 'check') out.textContent = (+ui[k]).toFixed(DIG(k));
      if (cfg.paused) requestAnimationFrame(frameOnce);   // keep the view live while paused
    };
    row.title = TIPS[k] || '';
    row.append(lab, inp, out); uiRoot.append(row);
    uiEl[k] = { inp, out };
  }
  function setUI(k, v) {
    ui[k] = v; uiEl[k].inp.value = v;
    uiEl[k].out.textContent = (+v).toFixed(DIG(k));
  }
  if (PRESET[cfg.cam]) {
    ui.spin = false; uiEl.spin.inp.checked = false;
    for (const k in PRESET[cfg.cam]) setUI(k, PRESET[cfg.cam][k]);
  }
  setUI('bounces', cfg.bounces);
  setUI('expo', cfg.expo);
  setUI('cgain', cfg.cgain);
  if (cfg.camQ.length) { ui.spin = false; uiEl.spin.inp.checked = false;
    for (const [k, v] of cfg.camQ) setUI(k, v); }
  if (cfg.fillQ !== null) { ui.autofill = false; uiEl.autofill.inp.checked = false; setUI('fill', cfg.fillQ); }
  // seed the toggles from the URL params
  for (const [k, v] of [['drops', cfg.pfield], ['bubbles', cfg.bub], ['gridEnv', cfg.envg],
                        ['waves', cfg.wav], ['reflect', cfg.refl > 0.5],
                        ['puddle', Q.get('puddle') !== '0']]) {
    ui[k] = v; uiEl[k].inp.checked = v;
  }
  document.getElementById('restart').onclick = () => location.reload();
  document.getElementById('ff').onclick = () => { ffSteps = 1200; if (cfg.paused) requestAnimationFrame(frameOnce); };

  const btn = document.getElementById('pause');
  function setPaused(v) {
    const was = cfg.paused;
    cfg.paused = v;
    btn.textContent = v ? 'resume' : 'pause';
    if (was && !v) requestAnimationFrame(frame);
  }
  btn.onclick = () => setPaused(!cfg.paused);
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); setPaused(!cfg.paused); } });
  window.__pause  = () => { setPaused(true);  return 'paused'; };
  window.__resume = () => { setPaused(false); return 'running'; };
  setPaused(cfg.paused);

  if (!cfg.paused) requestAnimationFrame(frame);

  // frame-count driven, not wall-clock: rAF pauses when the page isn't painting
  function runSelftest() {
    {
      const r = {};
      r.no_shader_errors = errors.filter(e => e.startsWith('[wgsl]')).length === 0;
      r.no_gpu_errors    = errors.filter(e => e.startsWith('[gpu]')).length === 0;
      r.rendered_frames  = probe.frames > 10;
      r.timestamps       = hasTS && probe.gpuMs.render > 0 && probe.gpuMs.build > 0;
      r.build_under_4ms  = (probe.gpuMs.build ?? 99) < 4;
      r.frame_under_16ms = (probe.gpuMs.total ?? 99) < 16.6;
      r.PASS = Object.values(r).every(Boolean);
      probe.selftest = r;
      console.log('SELFTEST ' + (r.PASS ? 'PASS' : 'FAIL') + ' ' + JSON.stringify(r));
    }
  }
})().catch(e => fail('main', e));
</script>
</body>
</html>
