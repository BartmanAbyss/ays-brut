    // at 74 fps, 37% slow at 38 - and against music that error accumulates over the
    // whole run. A deficit is now KEPT and worked off over the following frames rather
    // than discarded, which is the part that makes a hitch cost nothing in the end.
    // The show clock advances in whole SIM_DT steps locked to wall time (later, to the
    // audio clock). The sim clock is the INTEGRAL of the timeline's speed over those
    // steps - integrating against the wall delta instead would make a timeline that
    // varies speed frame-rate dependent all over again, the bug this replaced.
    // Behind the gate (always, in the release) the show clock is the AUDIO clock: as many
    // whole steps as the music has played since it started, so the picture follows the
    // music. Otherwise wall time, banked and capped as before.
    let nShow;
    if (cfg.gate) {
      nShow = Math.max(0, Math.floor((ac.currentTime - tA) / SIM_DT) - showStep);
    } else {
      showPend += redrawOnly ? 0 : (cfg.det ? SIM_DT : Math.min((now - last) / 1000, 0.25));
      nShow = Math.floor(showPend / SIM_DT);
      showPend -= nShow * SIM_DT;
//#D{
      if (seekTo >= 0 && !redrawOnly) {
        nShow = Math.min(15, seekTo - showStep); showPend = 0;
        if (nShow <= 0) { nShow = 0; seekTo = -1; }
      }
      // the editor keeps a shot's start state only on its exact first step, and a frame
      // that took two steps used to skip it - then a loop of that shot replayed the whole
      // show from 0. Stop on every shot start; playback carries the rest to the next frame
      if (ed && !redrawOnly && nShow > 1) {
        const k = ed.clampShow(nShow);
        if (seekTo < 0) showPend += (nShow - k) * SIM_DT;
        nShow = k;
      }
//#D}
    }
    for (let i = 0; i < nShow; i++) {
      const sp = ui.show ? evalShow((showStep + i) * SIM_DT).speed : ui.speed;
      clockT += SIM_DT * sp * ui.simSpeed;
    }
    showStep += nShow; showT = showStep * SIM_DT;
//#D{
    if (ed) ed.onShow();         // loop wrap, the shot's own slider values, the playhead
    else if (ui.show) showOv();  // the plain show applies a shot's own values too
//#D}
    if (ui.show && nShow) { setUI('showT', Math.min(showT, SHOW_END).toFixed(2)); }
    // Fast-forward is a deliberate burst, not a hitch: it has to actually simulate its
    // steps or the glasses never fill, so it raises the ceiling for this frame only. The
    // substep slots wrap every 16, so a burst reuses RNG streams - fine when skipping
    // ahead, not fine as a steady state.
    const ffNow = ffSteps; ffSteps = 0;
    clockT += ffNow * SIM_DT;

    // 16 is the steady-state ceiling: the sub-step index wraps at 16 (it reaches the shader
    // as the dispatch's grid height), and reusing one would make two substeps share an RNG
    // stream - the bug that used to thin the pour whenever a frame ran long.
    const burst = burstSteps; burstSteps = 0;
    // Slow motion: below speed 1 each step covers LESS sim time, one step per show step,
    // so the liquid moves every frame. Skipping steps instead (whole 1/60 s steps, run
    // less often) showed the same frame several times over - at 0.25, motion at 15 fps.
    // At speed 1 and above steps are 1/60 s as before, more of them when faster; seeks and
    // fast-forward always take full steps.
    let big = ffNow + burst > 0;
//#D{
    if (seekTo >= 0) big = true;   // a replay takes full steps, as many as it needs
//#D}
    const hu = big ? 1 : Math.min(1, (ui.show ? evalShow(showT).speed : ui.speed) * ui.simSpeed);
    stepDt = hu * SIM_DT;
    const want = hu > 0 ? Math.floor((clockT / SIM_DT - simU) / hu + 1e-6) : 0;
    let simSteps = redrawOnly ? 0 : Math.max(0, Math.min(16 + ffNow + burst, want));
//#D{
    if (seekTo >= 0 && !redrawOnly) simSteps = Math.max(0, want);
//#D}
    if (!redrawOnly && (want - simSteps) * hu > LAG_STEPS) {
      // Persistently too slow to hold the clock. In a demo sync beats continuity: drop
      // the steps we cannot afford so the picture stays with the music, and count it so
      // the cost is visible rather than silent.
      simU = clockT / SIM_DT - simSteps * hu;
      probe.resyncs++;
    }

    // The narrow band is rebuilt ONCE per frame, but a particle moved `simSteps` steps to
    // get where it is. A streak sized to one step therefore leaves a gap whenever the
    // frame rate is under 60 - the pour breaks back into the bead chain the swept capsule
    // was introduced to fix, and fast drops pin to the length cap. Size the shutter to the
    // motion this frame actually represents.
    // Bounded, and never from a deliberate burst: a seek runs thousands of steps in one
    // frame and would size the streak to all of them.
    // In slow motion the frame stands for less sim time, so the streak shortens - as a
    // high-speed camera's exposure does.
    if (!redrawOnly && simSteps) { frameSim = big ? 1 : Math.min(simSteps * hu, 4); }
    const time = cfg.t !== null ? cfg.t : clockT;
    probe.time  = time;
    probe.step  = Math.round(simU + simSteps * hu);
    probe.drift = clockT - (simU + simSteps * hu) * SIM_DT;
    probe.showT = showT; probe.shot = ui.show ? evalShow(showT).shot : -1;
    probe.frameSteps = +frameSim.toFixed(3); probe.streakMM = ui.shutter * SIM_DT * frameSim * 1000;
    writeUniforms(time);
    drawText(showT);

    const enc = device.createCommandEncoder();
    const doProf = !!profReq;
    if (doProf) { enc.clearBuffer(profB); }

    // One compute pass per group (each timed in the harness). A dispatch is
    // [entry point, workgroups, index]; the index reaches the shader as the grid's height
    // (see simParticles), and defaults to 0.
    const pass = (i, list) => {
      const cp = enc.beginComputePass({ timestampWrites: ts(i) });
      cp.setBindGroup(0, bg0);
      for (const [n, w, k = 0] of list) { cp.setPipeline(P[n]); cp.dispatchWorkgroups(w, k + 1); }
      cp.end();
    };

    // 1 — the simulation. Everything that ADVANCES STATE runs once per sim step, on the
    // clock: particles, the per-glass volume ODE (in the first wave dispatch, flagged by
    // its grid height) and the wave field (three sub-steps). The last two used to sit in
    // the per-frame build pass (with a table puddle that was cut later), so
    // the bulk advanced at the FRAME rate while the particles advanced on the clock; it hid
    // at 60 fps and showed when a seek ran 3000 steps in one frame and filled one glass.
    const sim = [];
    for (let k = 0; k < simSteps; k++) {
      const wv = ['waveUpdate', WG(NG * WN * WN, 64)];
      sim.push(['simParticles', WG(cfg.npart, 64), k % 16], [...wv, 1], wv, wv);
    }
    pass(0, sim);

    // 2 — structures for rendering, from the final state, once per frame
    pass(1, [
      ['clearFine', WG(FINE_N / 2, 256)], ['scatterFine', WG(cfg.npart, 64)],
      ...JFA_STRIDES.map((_, k) => ['jfaCoarse', WG(COARSE_N, 64), k]),
      ['resolveFine', WG(FINE_N / 2, 256)],
    ]);

    // 2b — caustics: fade the photon map, shoot this frame's photons, blur. A redraw keeps
    // the photon map it already has.
    pass(2, redrawOnly ? [] : [['causticDecay', WG(CN * CN * 3, 256)],
                               ['photons', WG(cfg.nphoton, 64)], ['causticBlur', WG(CN * CN, 256)]]);

    // 3 — render
    const rp = enc.beginRenderPass({
      colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store' }],
      timestampWrites: ts(3),
    });
    rp.setPipeline(render); rp.setBindGroup(0, bg0);
    if (doProf) { rp.setPipeline(renderX || renderProf); }   // renderX: a variant may add PROF: 1
    else if (renderX) { rp.setPipeline(renderX); }   // renderX (dev)
    rp.draw(3); rp.end();

    if (hasTS && !qbusy && qrd.mapState === 'unmapped') {
      enc.resolveQuerySet(qset, 0, LABELS.length * 2, qres, 0);
      enc.copyBufferToBuffer(qres, 0, qrd, 0, LABELS.length * 16);
    }
    if (gbusy === false && glassRd.mapState === 'unmapped') enc.copyBufferToBuffer(vecB, COARSE_N * 16, glassRd, 0, NG * 16);
    if (pbusy === false && partRd.mapState === 'unmapped') enc.copyBufferToBuffer(partBuf, 0, partRd, 0, PSAMP * 32);
    if (doProf) { enc.copyBufferToBuffer(profB, 0, profRd, 0, 64 * 128 * 4); }
    device.queue.submit([enc.finish()]);
    if (doProf) { const r = profReq; profReq = null; flushProfile(r); }
    readTimestamps();
    readLevels();
    readParts();

    if (!cfg.fs) resize();   // the pane can be shown or resized without firing a resize event
    frameNo++; simU += simSteps * hu; probe.frames = frameNo; probe.ok = true;
//#D{
    if (ed) ed.afterFrame();     // keeps the simulation's state at a shot's first frame
//#D}
    const dt = now - last; last = now;
    acc += dt; accN++;
    if (acc > 400) { probe.frameMs = acc / accN; probe.fps = 1000 / probe.frameMs; acc = 0; accN = 0; updateHud(); }
    if (cfg.selftest && !probe.selftest && frameNo > 10 && probe.gpuMs.total !== undefined) runSelftest();
    // A redraw must not schedule anything: frameOnce un-pauses so that frame() runs, and
    // this line used to see 'not paused' and queue a full frame - which stepped the sim
    // before noticing the pause. Every slider move on a paused page cost one hidden step.
    if ((cfg.paused && seekTo < 0) || redrawOnly) { updateHud(); return; }   // a seek runs on while paused
    if (!cfg.still || frameNo < cfg.warm) requestAnimationFrame(frame); else updateHud();
  }

  //#D{
  function frameOnce() {
    const was = cfg.paused; cfg.paused = false; redrawOnly = true;
    frame();
    redrawOnly = false; cfg.paused = was;
  }
  //#D}

  //#D{
  function updateHud() {
    const g = probe.gpuMs;
    const f = k => g[k] !== undefined ? g[k].toFixed(2) : '—';
    hudEl.textContent =
      canvas.width + 'x' + canvas.height + '  view=' + (Q.get('view') ?? 'beauty') +
      '  part=' + cfg.npart + '\n' +
      'cpu   ' + probe.frameMs.toFixed(2) + ' ms   ' + probe.fps.toFixed(0) + ' fps\n' +
      'sim   ' + f('sim') + ' ms\n' +
      'build ' + f('build') + ' ms\n' +
      'rend  ' + f('render') + ' ms\n' +
      'gpu   ' + f('total') + ' ms\n' +
      't     ' + probe.time.toFixed(2) + ' s' + (cfg.t !== null ? ' (fixed)' : '') + (cfg.det ? '  det' : '') + '\n' +
      (ui.show ? 'show  ' + probe.showT.toFixed(2) + ' / ' + SHOW_END +
        '  shot ' + probe.shot + String.fromCharCode(10) : '') +
      'step  ' + probe.step + '  x' + probe.frameSteps +
        '   drift ' + (probe.drift * 1000).toFixed(1) + ' ms' +
        (probe.resyncs ? '   resync ' + probe.resyncs : '') + String.fromCharCode(10) +
      (probe.adapter?.vendor ?? '?') + ' / ' + (probe.adapter?.architecture ?? '?') +
      (errors.length ? '\nERRORS ' + errors.length : '');
  }

  //#D}
  //#D{
  // EDITOR-MODEL:BEGIN - the timeline editor's logic as pure functions: no DOM, no page
  // state, every edit returns a new value. dev/tests/editor.test.mjs loads this block.
  const ED = (() => {
    const r6 = x => Math.round(x * 1e6) / 1e6;   // build/timeline.py r6, bit for bit
    const clone = v => JSON.parse(JSON.stringify(v));
    // the sliders the timeline drives, and their key column (build/timeline.py SLIDER_COL)
    const COL = { angle: 1, dist: 2, camY: 3, tgtY: 4, speed: 5, lightEl: 8, botTilt: 10, tableY: 11, envAmt: 12 };
    // the other sliders a shot may set for itself (build/timeline.py PER_SHOT): the looks, and
    // how the bottle wanders while it pours. The rest of the simulation's settings stay
    // global; the debug switches are not looks. A wander set by one shot changes the start of
    // the shots after it - signature() covers that, since it holds every earlier shot whole.
    // The wander's phase follows its speed, so the bottle jumps where wanderSpd changes:
    // change it across a cut to black.
    const PER_SHOT = ['lightAz', 'expo', 'cgain', 'shutter', 'bkBreath', 'bkSpeed', 'bkLife',
                      'pourWander', 'wanderSpd', 'pourRate', 'botShare', 'botStand'];
    // the globals the simulation depends on: a loop's saved start state is stale once one moves
    const SIM = ['autofill', 'fill', 'pourRate', 'botShare', 'dropVol', 'dropRad', 'foam', 'glug', 'glugHz',
                 'bottle', 'botAz', 'pourWander', 'wanderSpd', 'simSpeed', 'waves'];
    // shot start times, plus the end of the show: n + 1 entries
    const starts = shots => { const a = [0]; for (const s of shots) a.push(r6(a[a.length - 1] + s.dur)); return a; };
    // the shots end to end, as SHOW: a key repeating the one before it exactly is dropped
    function flatten(shots) {
      const out = [];
      let t0 = 0;
      for (const s of shots) {
        for (const k of s.keys) {
          const row = [r6(t0 + k[0]), ...k.slice(1)];
          const p = out[out.length - 1];
          if (!(p && row.every((v, j) => v === p[j]))) out.push(row);
        }
        t0 = r6(t0 + s.dur);
      }
      return out;
    }
    // the shot playing at t; on a boundary, the one starting there (a cut: the later wins)
    function shotAt(shots, t) {
      const st = starts(shots);
      let i = 0;
      while (i < shots.length - 1 && t >= st[i + 1]) i++;
      return i;
    }
    // stretch shots by f, their keys with them; nothing else moves but what comes after
    function scale(shots, idx, f) {
      if (!(f > 0) || !isFinite(f)) throw new Error('scale factor must be a positive number');
      const s = clone(shots);
      for (const i of new Set(idx)) {
        const sh = s[i], d = Math.max(0.05, r6(sh.dur * f));
        const g = d / sh.dur;
        for (const k of sh.keys) k[0] = r6(k[0] * g);
        sh.dur = d; sh.keys[sh.keys.length - 1][0] = d;
      }
      return s;
    }
    const setDur = (shots, i, d) => scale(shots, [i], d / shots[i].dur);
    // where a moment of the old timeline lands in the new one, for keeping the playhead
    // on the same frame of a shot while it is stretched
    function mapTime(before, after, t) {
      const a = starts(before), b = starts(after), i = shotAt(before, t);
      const u = Math.min(1, Math.max(0, (t - a[i]) / before[i].dur));
      return r6(b[i] + u * after[i].dur);
    }
    function shiftColumn(shots, i, col, delta) {
      const s = clone(shots);
      for (const k of s[i].keys) k[col] = r6(k[col] + delta);
      return s;
    }
    // multiply one column of one shot: a speed is recorded as a factor, so a ramp keeps its
    // shape (0.25 -> 1 doubled is 0.5 -> 2) and a stop stays a stop
    function scaleColumn(shots, i, col, f) {
      const s = clone(shots);
      for (const k of s[i].keys) k[col] = r6(k[col] * f);
      return s;
    }
    function resetColumn(shots, saved, i, col) {
      const s = clone(shots);
      s[i].keys.forEach((k, j) => { const b = saved[i] && saved[i].keys[j]; if (b) k[col] = b[col]; });
      return s;
    }
    const columnChanged = (shots, saved, i, col) => !saved[i] ||
      shots[i].keys.length !== saved[i].keys.length ||
      shots[i].keys.some((k, j) => k[col] !== saved[i].keys[j][col]);
    function setOverride(shots, i, k, v) {
      if (!PER_SHOT.includes(k)) throw new Error(k + ' is a global slider: a shot cannot set it');
      const s = clone(shots);
      s[i].ov = { ...(s[i].ov || {}), [k]: v };
      return s;
    }
    function clearOverride(shots, i, k) {
      const s = clone(shots);
      if (s[i].ov) delete s[i].ov[k];
      return s;
    }
    // a shot's own fade: in from its start and out to its end over `fade` seconds, whatever
    // its length. null: the shot has none, and its keys' fade column applies as before
    function fadeAt(shots, t) {
      const i = shotAt(shots, t), s = shots[i];
      if (s.fade === undefined) return null;
      if (!(s.fade > 0)) return 1;
      const u = t - starts(shots)[i];
      return Math.min(1, Math.max(0, Math.min(u, s.dur - u) / s.fade));
    }
    function setFade(shots, i, f) {
      const s = clone(shots);
      if (f === null || f === undefined) delete s[i].fade;
      else {
        if (!(f >= 0) || !isFinite(f)) throw new Error('a fade is a number of seconds, 0 or more');
        s[i].fade = r6(f);
      }
      return s;
    }
    const effective = (shots, i, globals, k) =>
      shots[i].ov && k in shots[i].ov ? shots[i].ov[k] : globals[k];
    // why a slider row is marked: 'key' - its column in this shot is not what was saved;
    // 'shot' - this shot sets it; 'global' - its global value is not the default; '' - none
    function status(st, saved, defaults, i, k) {
      if (k in COL) return columnChanged(st.shots, saved, i, COL[k]) ? 'key' : '';
      if (st.shots[i].ov && k in st.shots[i].ov) return 'shot';
      return st.globals[k] !== defaults[k] ? 'global' : '';
    }
    const shotChanged = (shots, saved, i) => JSON.stringify(shots[i]) !== JSON.stringify(saved[i]);
    // what a shot's start state depends on: every shot before it, and the simulation's globals
    const signature = (shots, i, globals) => JSON.stringify([shots.slice(0, i), SIM.map(k => globals[k])]);
    // the span a loop plays: from the first selected shot's start to the last one's end
    // how many of n show steps to take from `step` so as not to pass over a shot's first
    // step: the editor keeps a shot's start state only when a frame lands exactly on it
    function clampSteps(startSteps, step, n) {
      let k = n;
      for (const s of startSteps) if (s > step && s - step < k) k = s - step;
      return k;
    }
    function loopSpan(shots, sel) {
      const st = starts(shots);
      return [st[Math.min(...sel)], st[Math.max(...sel) + 1]];
    }

    function history(limit = 500) {
      const u = [], r = [];
      return {
        push(prev) { u.push(clone(prev)); if (u.length > limit) u.shift(); r.length = 0; },
        undo(cur) { if (!u.length) return null; r.push(clone(cur)); return u.pop(); },
        redo(cur) { if (!r.length) return null; u.push(clone(cur)); return r.pop(); },
        get canUndo() { return u.length > 0; },
        get canRedo() { return r.length > 0; },
      };
    }
    // what save sends: the shots, and each global changed in the editor that is no longer
    // its default (a value that only came from the URL is not saved)
    function savePayload(st, defaults) {
      const globals = {};
      for (const k of st.touched) if (st.globals[k] !== defaults[k]) globals[k] = st.globals[k];
      return { shots: clone(st.shots), globals };
    }
    // a key's columns by name (build/timeline.py COLS), and what moves between two keys
    const COLS = ['t', 'angle', 'dist', 'camY', 'tgtY', 'speed', 'ease', 'fade', 'lightEl', 'pour',
                  'botTilt', 'tableY', 'envAmt'];
    const keyChanges = (a, b) => COLS.map((n, c) => [n, a[c], b[c]])
      .filter(([n, x, y], c) => c > 0 && n !== 'ease' && x !== y);
    // the keys as the strip shows them: show time, shot, index in the shot
    function keyList(shots) {
      const st = starts(shots), out = [];
      shots.forEach((s, i) => s.keys.forEach((k, j) => out.push({ t: r6(st[i] + k[0]), i, j, k })));
      return out;
    }
    return { r6, clone, COL, COLS, PER_SHOT, SIM, starts, flatten, shotAt, scale, setDur, mapTime,
             keyChanges, keyList,
             shiftColumn, scaleColumn, resetColumn, columnChanged, setOverride, clearOverride, effective,
             fadeAt, setFade, clampSteps,
             status, shotChanged, signature, loopSpan, history, savePayload };
  })();
  // EDITOR-MODEL:END
  function flattenShots(shots) { return ED.flatten(shots); }

  // ── timeline ──

  // without a cut. ov: the shot's own values for the few look sliders a shot may set

  // pour, bottle tilt deg, table height m, environment brightness]. Two keys sharing a t are a CUT: the later one wins at that
  // instant, so the change is immediate rather than a one-frame blend. `ease` applies to
  // the segment STARTING at that key - 1 for smootherstep in and out, 0 for linear, so a

  addEventListener('keydown', e => {
    if ((e.key === 'h' || e.key === 'H') && !typing(e) && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault(); document.body.classList.toggle('nohud');
    }
  });
  window.__pause  = () => { setPaused(true);  return 'paused'; };
  window.__resume = () => { setPaused(false); return 'running'; };
  setPaused(cfg.paused);

  // ── timeline editor (?edit=1) ──
  // The shots end to end on one line at the bottom, each as wide as it is long. Click one
  // to select it and jump to its start; ctrl- or shift-click adds to the selection. "loop"
  // plays the selection over and over. The simulation's state at a shot's first frame is
  // kept on the GPU (20 MB a shot, up to 12), so a loop or a jump back starts there
  // instead of replaying the show from 0 - and replays only when something before the shot
  // that the simulation depends on has changed (ED.signature).
  // "rec": slider moves go into the shot under the playhead instead of the global settings.
  // The timeline's own sliders (ED.COL) shift all of that shot's keys by the move; the look
  // sliders in ED.PER_SHOT become the shot's own values (blue / red labels). The rest are
  // global, rec or not (yellow when not the default). The button at a marked row's end puts
  // it back. Everything is undoable (ctrl+z, ctrl+y / ctrl+shift+z). "save" writes the shots
  // and the changed defaults into this file through dev/serve.py, or downloads them.
  function makeEditor() {
    document.body.classList.add('edit');
    const SKIP = new Set(['show', 'showT', 'spin']);
    const KEYS = SPEC.map(x => x[0]).filter(k => !SKIP.has(k) && !AUDIO.has(k));
    const KIND = Object.fromEntries(SPEC.map(x => [x[0], x[1]]));
    const defaults = Object.fromEntries(SPEC.map(x => [x[0], x[2]]));
    const FIELD = { angle: 'angle', dist: 'dist', camY: 'camY', tgtY: 'tgtY', speed: 'speed',
                    lightEl: 'el', botTilt: 'tilt', tableY: 'tableY', envAmt: 'env' };
    let st = { shots: ED.clone(SHOTS), globals: {}, touched: [] };
    for (const k of KEYS) if (!(k in ED.COL)) st.globals[k] = ui[k];
    let saved = ED.clone(SHOTS);
    const hist = ED.history();
    let sel = [0], cur = -1, rec = false, loop = false;
    const stats = { restores: 0, captures: 0, wraps: 0, rewinds: 0 };
    const snaps = new Map();          // shot index -> the simulation at its first frame
    const SNAP_BUFS = [1, 4, 5];      // particles, atomics (volumes, waves, photons), vec4s
    const SNAP_MAX = 12;              // ~20 MB each: the whole show's shots
    const total = () => ED.starts(st.shots)[st.shots.length];
    const stepOf = t => Math.round(t / SIM_DT);

    // ── the strip ──
    const root = document.createElement('div'); root.id = 'tl';
    const bar = document.createElement('div'); bar.className = 'bar';
    const spanEl = document.createElement('div'); spanEl.className = 'span';
    const ph = document.createElement('div'); ph.className = 'ph';
    bar.append(spanEl, ph);
    const tools = document.createElement('div'); tools.className = 'tools';
    const btn = (label, title, fn, cls = '') => {
      const b = document.createElement('button'); b.textContent = label; b.title = title;
      b.className = cls; b.onclick = fn; tools.append(b); return b;
    };
    const field = (title, val) => {
      const i = document.createElement('input'); i.type = 'number'; i.step = '0.05'; i.min = '0.05';
      i.title = title; i.value = val; tools.append(i); return i;
    };
    const text = t => { const e = document.createElement('span'); e.textContent = t; tools.append(e); return e; };
    const bU = btn('undo', 'Undo the last change (ctrl+z).', () => undo());
    const bR = btn('redo', 'Redo (ctrl+y or ctrl+shift+z).', () => redo());
    const bRec = btn('rec', 'Record: slider moves go into the shot under the playhead. The camera, light, table, bottle and environment sliders shift that shot\'s keys; the look sliders (light azimuth, exposure, caustics, shutter, bokeh) and the bottle\'s wander and flow (pourWander, wanderSpd, pourRate, botShare) become the shot\'s own values. Everything else stays global.', () => setRec(!rec));
    const bLoop = btn('loop', 'Play the selected shots over and over. Each pass starts from the simulation as it was at the first frame, kept on the GPU.', () => setLoop(!loop), 'lp');
    text('len');
    const lenIn = field('Length of the selected shot in seconds. Its keys stretch with it; the shots after it move.', '');
    text('s  fade');
    const fadeIn = field('Fade in and out of the selected shot, in seconds - the same at both ends, whatever its length. 0 cuts hard. Empty: the shot keeps the fades in its keys.', '');
    text('s  ×');
    const facIn = field('Factor for "scale".', '1.5');
    btn('scale', 'Stretch every selected shot by the factor, keys and all.', () => scaleSel(parseFloat(facIn.value)));
    btn('-10%', 'Shorten the selected shots by 10%.', () => scaleSel(1 / 1.1));
    btn('+10%', 'Lengthen the selected shots by 10%.', () => scaleSel(1.1));
    btn('save', 'Write the shots and the changed slider defaults into dev/champagne.html (needs python dev/serve.py as the server; otherwise downloads them as timeline.json).', () => save(false));
    const msg = document.createElement('span'); msg.className = 'msg'; tools.append(msg);
    const keyEl = text('blue keys · red shot · yellow global'); keyEl.className = 'key';
    // above the shots: the timeline's speed and fade as curves, and every key as a diamond
    const curves = document.createElement('canvas'); curves.className = 'curves';
    curves.title = 'orange: the simulation speed (log scale; lines at 0.25, 1 and 8). grey: the fade.';
    const keysEl = document.createElement('div'); keysEl.className = 'keys';
    root.append(curves, keysEl, bar, tools);
    const fmt = v => +(+v).toFixed(3);
    function drawKeys() {
      keysEl.textContent = '';
      const T = total(), list = ED.keyList(st.shots);
      list.forEach((e, n) => {
        const d = document.createElement('div');
        const next = list[n + 1] && list[n + 1].i === e.i ? list[n + 1] : null;
        const prev = list[n - 1];
        d.className = 'kf' + (e.k[6] ? ' ease' : '') + (prev && prev.t === e.t ? ' cut' : '');
        d.style.left = (e.t / T * 100) + '%';
        d.dataset.t = e.t;
        const vals = ED.COLS.slice(1).map((c, m) => c + ' ' + fmt(e.k[m + 1])).join('  ');
        const moves = next ? ED.keyChanges(e.k, next.k).map(([c, a, b]) => c + ' ' + fmt(a) + ' -> ' + fmt(b)) : [];
        d.title = st.shots[e.i].name + ', key ' + (e.j + 1) + ' at +' + fmt(e.k[0]) + ' s (show ' + fmt(e.t) + ' s)\n' +
          vals + (next ? '\n\nto the next key (' + fmt(next.t - e.t) + ' s, ' + (e.k[6] ? 'eased' : 'linear') + '): ' +
          (moves.length ? moves.join(', ') : 'nothing moves') : '\n\nthe shot\'s last key');
        d.onclick = ev => { ev.stopPropagation(); jump(e.t); };
        keysEl.append(d);
      });
    }
    function drawCurves() {
      const w = Math.max(1, Math.round(curves.clientWidth * devicePixelRatio));
      const h = Math.max(1, Math.round(curves.clientHeight * devicePixelRatio));
      if (curves.width !== w) curves.width = w;
      if (curves.height !== h) curves.height = h;
      const g = curves.getContext('2d'), T = total();
      g.clearRect(0, 0, w, h);
      // log2 speed from 1/8 (bottom) to 8 (top)
      const y = sp => h - 1 - (Math.log2(Math.max(sp, 1 / 8)) + 3) / 6 * (h - 2);
      g.strokeStyle = '#333'; g.lineWidth = 1;
      for (const sp of [0.25, 1, 8]) { g.beginPath(); g.moveTo(0, y(sp) + 0.5); g.lineTo(w, y(sp) + 0.5); g.stroke(); }
      g.fillStyle = '#ffffff22'; g.beginPath(); g.moveTo(0, h);
      for (let x = 0; x <= w; x++) {
        const t = x / w * T, f = ED.fadeAt(st.shots, t);
        g.lineTo(x, h - (f !== null ? f : evalShow(t).fade) * (h - 1));
      }
      g.lineTo(w, h); g.fill();
      g.strokeStyle = '#ff9f43'; g.lineWidth = devicePixelRatio; g.beginPath();
      for (let x = 0; x <= w; x++) { const v = y(evalShow(x / w * T).speed); x ? g.lineTo(x, v) : g.moveTo(x, v); }
      g.stroke();
    }
    addEventListener('resize', () => drawCurves());
    document.body.append(root);
    fadeIn.onchange = () => {
      if (sel.length !== 1) return;
      const v = fadeIn.value.trim() === '' ? null : parseFloat(fadeIn.value);
      if (v !== null && !(v >= 0)) { note('a fade is a number of seconds, 0 or more'); draw(); return; }
      change(() => { st.shots = ED.setFade(st.shots, sel[0], v); });
    };
    lenIn.onchange = () => {
      const d = parseFloat(lenIn.value);
      if (sel.length === 1 && d > 0) change(() => { st.shots = ED.setDur(st.shots, sel[0], d); });
    };
    let noteT = 0;
    function note(t) { msg.textContent = t; msg.title = t; noteT = performance.now(); }

    function draw() {
      const T = total(), stt = ED.starts(st.shots);
      for (const e of [...bar.querySelectorAll('.shot')]) e.remove();
      st.shots.forEach((s, i) => {
        const e = document.createElement('div');
        e.className = 'shot' + (s.name === 'black' ? ' black' : '') + (sel.includes(i) ? ' sel' : '') +
          (i === cur ? ' cur' : '') + (ED.shotChanged(st.shots, saved, i) ? ' mod' : '');
        e.style.width = (s.dur / T * 100) + '%';
        e.textContent = s.name + ' ' + +s.dur.toFixed(2);
        const ov = Object.entries(s.ov || {}).map(([k, v]) => k + ' ' + v).join(', ');
        e.title = (s.note || s.name) + '\n' + stt[i].toFixed(2) + ' - ' + stt[i + 1].toFixed(2) +
          ' s (' + +s.dur.toFixed(3) + ' s)' + (s.fade !== undefined ? '\nfades over ' + s.fade + ' s' : '') +
          (ov ? '\nits own: ' + ov : '');
        // a click plays from the point clicked in the shot (ctrl/shift only selects)
        e.onclick = ev => {
          const r = e.getBoundingClientRect();
          const u = r.width > 0 ? Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)) : 0;
          pick(i, ev.ctrlKey || ev.shiftKey || ev.metaKey, ED.r6(stt[i] + u * s.dur));
        };
        e.dataset.i = i;
        bar.insertBefore(e, spanEl);
      });
      lenIn.disabled = sel.length !== 1;
      lenIn.value = sel.length === 1 ? +st.shots[sel[0]].dur.toFixed(3) : '';
      fadeIn.disabled = sel.length !== 1;
      fadeIn.value = sel.length === 1 && st.shots[sel[0]].fade !== undefined ? st.shots[sel[0]].fade : '';
      const [a, b] = ED.loopSpan(st.shots, sel);
      spanEl.style.display = loop ? 'block' : 'none';
      spanEl.style.left = (a / T * 100) + '%'; spanEl.style.width = ((b - a) / T * 100) + '%';
      bRec.classList.toggle('on', rec); bLoop.classList.toggle('on', loop);
      bU.disabled = !hist.canUndo; bR.disabled = !hist.canRedo;
      drawKeys(); drawCurves();
      playhead();
    }
    const playhead = () => { ph.style.left = (Math.min(showT, total()) / total() * 100) + '%'; };
    function marks() {
      for (const k of KEYS) {
        const row = uiEl[k].row;
        const s = cur >= 0 ? ED.status(st, saved, defaults, cur, k) : '';
        row.dataset.chg = s;
        row.dataset.rec = rec && (k in ED.COL || ED.PER_SHOT.includes(k)) ? '1' : '';
        uiEl[k].rst.title = s === 'key' ? 'Back to the saved keys for this shot.' :
          s === 'shot' ? 'Drop this shot\'s own value: it takes the global one again.' :
          s === 'global' ? 'Back to the default (' + defaults[k] + ').' : '';
      }
      bU.disabled = !hist.canUndo; bR.disabled = !hist.canRedo;
    }

    // ── state ──
    function rebuild() {
      SHOW.length = 0; SHOW.push(...ED.flatten(st.shots));
      SHOW_TEXT.splice(0, SHOW_TEXT.length, ...textCues(st.shots));
      SHOW_END = SHOW[SHOW.length - 1][0];
      uiEl.showT.inp.max = SHOW_END;
    }
    function setVal(k, v) {
      if (KIND[k] === 'check') { ui[k] = v; uiEl[k].inp.checked = v; } else setUI(k, v);
    }
    function applyEffective() {
      if (cur < 0) return;
      for (const k in st.globals) {
        const v = ED.effective(st.shots, cur, st.globals, k);
        if (ui[k] !== v) setVal(k, v);
      }
    }
    // after the state changed: keep the playhead on the same moment of a stretched shot,
    // lay the shots out again, put each slider on its value for the current shot
    function after(pre) {
      if (pre && pre.shots.some((s, i) => s.dur !== st.shots[i].dur)) {
        const t = ED.mapTime(pre.shots, st.shots, showT);
        showStep = stepOf(t); showT = showStep * SIM_DT;
      }
      rebuild();
      cur = ED.shotAt(st.shots, showT);
      applyEffective(); draw(); marks();
      if (loop) loopCheck(false);
      if (cfg.paused) requestAnimationFrame(frameOnce);
    }
    function change(fn) {        // one undoable edit
      const pre = ED.clone(st);
      fn();
      if (JSON.stringify(pre) === JSON.stringify(st)) return;
      hist.push(pre);
      after(pre);
    }
    function undo() { const s = hist.undo(st); if (s) { const pre = st; st = s; after(pre); note('undone'); } }
    function redo() { const s = hist.redo(st); if (s) { const pre = st; st = s; after(pre); note('redone'); } }
    const touch = k => { if (!st.touched.includes(k)) st.touched.push(k); };

    // ── sliders ──
    const drag = {};
    for (const k of KEYS) {
      const inp = uiEl[k].inp;
      uiEl[k].row = inp.parentNode;
      const r = document.createElement('button'); r.className = 'rst'; r.textContent = '↺';
      r.onclick = () => change(() => {
        if (k in ED.COL) st.shots = ED.resetColumn(st.shots, saved, cur, ED.COL[k]);
        else if (st.shots[cur].ov && k in st.shots[cur].ov) st.shots = ED.clearOverride(st.shots, cur, k);
        else { st.globals[k] = defaults[k]; touch(k); }
      });
      uiEl[k].rst = r; uiEl[k].row.append(r);
      // the slider's own oninput has already set ui[k]; this decides where the value goes
      inp.addEventListener('input', () => {
        if (cur < 0) return;
        const v = KIND[k] === 'check' ? inp.checked : parseFloat(inp.value);
        if (!drag[k]) drag[k] = { pre: ED.clone(st), from: k in ED.COL ? evalShow(showT)[FIELD[k]] : null };
        const d = drag[k];
        if (k in ED.COL) {
          if (!ui.show) return;                         // manual camera: the slider is the value
          if (!rec) { note('rec is off - the timeline drives ' + k + '; turn rec on to move this shot'); return; }
          st.shots = k === 'speed' && d.from > 1e-6
            ? ED.scaleColumn(d.pre.shots, cur, ED.COL[k], v / d.from)
            : ED.shiftColumn(d.pre.shots, cur, ED.COL[k], v - d.from);
          rebuild();
        } else if ((st.shots[cur].ov && k in st.shots[cur].ov) || (rec && ED.PER_SHOT.includes(k))) {
          st.shots = ED.setOverride(st.shots, cur, k, v);
        } else {
          if (rec) note(k + ' is global: it changes every shot');
          st.globals[k] = v; touch(k);
        }
        marks();
      });
      inp.addEventListener('change', () => {
        const d = drag[k]; drag[k] = null;
        if (d && JSON.stringify(d.pre) !== JSON.stringify(st)) { hist.push(d.pre); draw(); marks(); }
      });
    }
    function setRec(v) { rec = v; draw(); marks(); note(v ? 'rec: slider moves go into ' + st.shots[cur].name : 'rec off'); }

    // ── selection, scaling ──
    // select shot i; without add, also go to t (default: its start) and play from there
    function pick(i, add, t) {
      if (add) {
        sel = sel.includes(i) ? sel.filter(x => x !== i) : [...sel, i].sort((a, b) => a - b);
        if (!sel.length) sel = [i];
      } else {
        sel = [i];
        jump(t === undefined ? ED.starts(st.shots)[i] : t);
      }
      draw();
      if (loop) loopCheck(false);       // only if the playhead is now outside the loop
    }
    function scaleSel(f) {
      if (!(f > 0)) { note('the factor must be a positive number'); return; }
      change(() => { st.shots = ED.scale(st.shots, sel, f); });
    }

    // ── the simulation's state at a shot's first frame ──
    function validSnap(i) {
      const s = snaps.get(i);
      return !!s && s.sig === ED.signature(st.shots, i, st.globals) &&
        s.step === stepOf(ED.starts(st.shots)[i]);
    }
    function capture(i) {
      let s = snaps.get(i);
      if (s) snaps.delete(i);                       // re-inserted below: the newest is last
      else {
        if (snaps.size >= SNAP_MAX) {
          const [oj, os] = snaps.entries().next().value;
          os.bufs.forEach(b => b.destroy()); snaps.delete(oj);
        }
        s = { bufs: SNAP_BUFS.map(j => device.createBuffer({ size: bufs[j].size,
          usage: GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST })) };
      }
      const enc = device.createCommandEncoder();
      SNAP_BUFS.forEach((j, n) => enc.copyBufferToBuffer(bufs[j], 0, s.bufs[n], 0, bufs[j].size));
      device.queue.submit([enc.finish()]);
      Object.assign(s, { sig: ED.signature(st.shots, i, st.globals), step: showStep,
                         js: { clockT, showStep, showT, simU, frameSim } });
      snaps.set(i, s); stats.captures++;
    }
    function restore(i) {
      const s = snaps.get(i);
      const enc = device.createCommandEncoder();
      SNAP_BUFS.forEach((j, n) => enc.copyBufferToBuffer(s.bufs[n], 0, bufs[j], 0, bufs[j].size));
      device.queue.submit([enc.finish()]);
      ({ clockT, showStep, showT, simU, frameSim } = s.js);
      showPend = 0; burstSteps = 0; ffSteps = 0; seekTo = -1; previewT = -1;
      last = performance.now();
      cur = -1;                                      // re-apply the shot's sliders
      stats.restores++;
    }
    // before a seek to t: start from the latest kept shot start at or before t, if that is
    // closer than where the playhead is (or the playhead is past t)
    function restoreBefore(t) {
      const stt = ED.starts(st.shots);
      let best = -1;
      for (const i of snaps.keys())
        if (stt[i] <= t + 1e-9 && validSnap(i) && (best < 0 || stt[i] > stt[best])) best = i;
      if (best < 0) return false;
      if (showT <= t + 1e-9 && showT >= stt[best] - 1e-9) return false;   // playing on is closer
      restore(best);
      return true;
    }
    function jump(t) {
      const i = ED.shotAt(st.shots, t);
      if (Math.abs(ED.starts(st.shots)[i] - t) < 1e-9 && validSnap(i)) { restore(i); }
      else {
        const r0 = stats.rewinds;
        seekShow(t);
        if (stats.rewinds > r0) note('replaying the show from 0 to ' + t.toFixed(2) + ' s - an earlier ' +
          'shot or a simulation setting changed since this shot\'s start was kept (or it never was)');
      }
      cur = -1;
      if (cfg.paused) requestAnimationFrame(frameOnce);
    }
    function loopCheck(force) {
      const [a, b] = ED.loopSpan(st.shots, sel);
      if (force || showT < a - 1e-9 || showT >= b - 1e-9) jump(a);
    }
    function setLoop(v) {
      loop = v; draw();
      if (loop) loopCheck(false);
      note(v ? 'looping ' + sel.map(i => st.shots[i].name).join(' + ') : 'loop off');
    }

    // ── save ──
    async function save(dry) {
      const payload = ED.savePayload(st, defaults);
      let r = null;
      try {
        r = await fetch('/__save' + (dry ? '?dry=1' : ''), { method: 'POST',
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      } catch (e) { r = null; }
      if (r && r.ok) {
        const j = await r.json();
        if (dry) return j;
        saved = ED.clone(st.shots);
        for (const k in payload.globals) {
          defaults[k] = payload.globals[k];
          SPEC.find(x => x[0] === k)[2] = payload.globals[k];
        }
        st.touched = [];
        draw(); marks();
        note('saved into dev/champagne.html: ' + (j.changed.length ? j.changed.join(', ') : 'nothing had changed'));
        return j;
      }
      if (r && r.status === 400) {
        const j = await r.json().catch(() => ({ error: 'refused' }));
        note('save refused: ' + j.error);
        return j;
      }
      // no save server behind this page (python -m http.server): hand the file over instead
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' }));
      a.download = 'timeline.json';
      if (!dry) a.click();
      note('no save server (start the harness with: python dev/serve.py) - downloaded timeline.json; ' +
           'python dev/serve.py --apply timeline.json writes it in');
      return { ok: false, downloaded: !dry };
    }

    addEventListener('keydown', e => {
      if (typing(e)) return;
      if (!(e.ctrlKey || e.metaKey)) return;
      if (e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
      else if (e.code === 'KeyY') { e.preventDefault(); redo(); }
    });

    rebuild(); draw();
    note('editor: click a shot, loop it, rec to tune it, save when done');
    return {
      stats, KEYS, defaults,
      get st() { return st; }, get saved() { return saved; }, get sel() { return sel; },
      get cur() { return cur; }, get rec() { return rec; }, get loop() { return loop; },
      snaps, pick, undo, redo, setRec, setLoop, scaleSel, save, validSnap,
      span: () => ED.loopSpan(st.shots, sel),
      restoreBefore,
      onShow() {
        if (seekTo < 0 && loop) {
          const [, b] = ED.loopSpan(st.shots, sel);
          if (showT >= b - 1e-9) { stats.wraps++; loopCheck(true); }
        }
        const i = ED.shotAt(st.shots, showT);
        if (i !== cur) { cur = i; applyEffective(); draw(); marks(); }
        playhead();
        if (noteT && performance.now() - noteT > 8000) { msg.textContent = ''; noteT = 0; }
      },
      clampShow: n => ED.clampSteps(ED.starts(st.shots).map(stepOf), showStep, n),
      afterFrame() {
        // also during a replay: its frames run the sim fully up to the clock, so a replay
        // from 0 leaves every shot start on its way kept
        const i = ED.shotAt(st.shots, showT);
        if (showStep === stepOf(ED.starts(st.shots)[i]) && !validSnap(i)) capture(i);
      },
    };
  }
  if (cfg.edit) { ed = makeEditor(); window.__ed = ed; }
  // Without the editor the show still applies each shot's own slider values (ov) - shot 2's
  // standing bottle, a shot's wander - over the globals as they were at load.
  const ovBase = Object.fromEntries(ED.PER_SHOT.map(k => [k, ui[k]]));
  let ovShot = -1;
  function showOv() {
    const i = ED.shotAt(SHOTS, showT);
    if (i === ovShot) return;
    ovShot = i;
    for (const k of ED.PER_SHOT) {
      const v = ED.effective(SHOTS, i, ovBase, k);
      if (ui[k] === v) continue;
      if (typeof v === 'boolean') { ui[k] = v; uiEl[k].inp.checked = v; } else setUI(k, v);
    }
  }

  // ── the editor's in-browser tests (?edit=1&edtest=1, best with &det=1) ──
  // They drive the real controls - clicks, slider input/change events, ctrl+z - against a
  // running page, and leave the result in __probe().edtest and the console (EDTEST PASS).
  // The pane must be on screen: a hidden page gets no frames. Save runs as a dry run, so
  // the file on disk is never touched.
  async function runEdTests() {
    const E = ed, R = {};
    const sl = ms => new Promise(r => setTimeout(r, ms));
    const frames = n => new Promise(r => { const f = () => (--n <= 0 ? r() : requestAnimationFrame(f)); requestAnimationFrame(f); });
    const until = async (fn, ms = 20000) => { const t = performance.now(); while (!fn()) { if (performance.now() - t > ms) return false; await frames(1); } return true; };
    const row = k => uiEl[k].row;
    const slide = (k, v) => {
      const i = uiEl[k].inp;
      if (i.type === 'checkbox') i.checked = v; else i.value = v;
      i.dispatchEvent(new Event('input')); i.dispatchEvent(new Event('change'));
    };
    const key = (code, o = {}) => dispatchEvent(new KeyboardEvent('keydown', { code, ctrlKey: true, ...o }));
    const shotEl = i => document.querySelector('#tl .shot[data-i="' + i + '"]');
    const button = t => [...document.querySelectorAll('#tl button')].find(b => b.textContent === t);
    const near = (a, b, e = 1e-6) => Math.abs(a - b) <= e;
    const t = async (name, fn) => {
      try { const ok = await fn(); R[name] = ok === false ? 'FAIL' : 'PASS'; }
      catch (e) { R[name] = 'FAIL: ' + (e && e.message || e); }
      if (R[name] !== 'PASS') console.warn('EDTEST', name, R[name]);
    };
    const assert = (c, m) => { if (!c) throw new Error(m); };
    window.__marker = 1;                 // gone if anything reloads the page
    await until(() => probe.frames > 20);

    await t('no audio: no start screen, no AudioContext, the audio column hidden', () => {
      assert(!cfg.gate, 'gate on');
      assert(ac === undefined, 'an AudioContext exists');
      return getComputedStyle(document.getElementById('uia')).display === 'none';
    });
    await t('keys: a diamond per key at its time, its values and moves on hover', () => {
      const els = [...document.querySelectorAll('#tl .kf')], list = ED.keyList(E.st.shots);
      assert(els.length === list.length, els.length + ' diamonds for ' + list.length + ' keys');
      assert(els.every((e, n) => near(parseFloat(e.style.left), list[n].t / SHOW_END * 100, 1e-3)), 'misplaced');
      const n = list.findIndex(e => E.st.shots[e.i].name === '4 pour' && e.j === 3);
      assert(n >= 0, 'no 4th key in 4 pour');
      const [c, a, b] = ED.keyChanges(list[n].k, list[n + 1].k)[0];
      assert(els[n].title.includes(c + ' ' + +(+a).toFixed(3) + ' -> ' + +(+b).toFixed(3)) &&
             /eased/.test(els[n].title), 'tooltip: ' + els[n].title);
      assert(els[n].classList.contains('ease'), 'an eased key is not filled');
      return els.some(e => e.classList.contains('cut'));
    });
    await t('curves: speed and fade drawn across the show', () => {
      const c = document.querySelector('#tl canvas.curves');
      const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
      let orange = 0;
      for (let p = 0; p < d.length; p += 4) if (d[p] > 200 && d[p + 1] > 120 && d[p + 1] < 190 && d[p + 2] < 110) orange++;
      return c.width > 100 && orange > c.width / 2;
    });
    await t('strip: one block per shot, each as wide as it is long', () => {
      const els = [...document.querySelectorAll('#tl .shot')];
      assert(els.length === E.st.shots.length, els.length + ' blocks');
      const T = SHOW_END;
      return els.every((e, i) => near(parseFloat(e.style.width), E.st.shots[i].dur / T * 100, 1e-3));
    });
    await t('click a shot: selects it and jumps to its start', async () => {
      shotEl(1).click();                        // clientX 0: left of it, so its start
      assert(E.sel.length === 1 && E.sel[0] === 1, 'selection ' + E.sel);
      assert(shotEl(1).classList.contains('sel'), 'not highlighted');
      return await until(() => seekTo < 0 && E.cur === 1);
    });
    await t('click inside a shot: plays from the point clicked', async () => {
      const r = shotEl(1).getBoundingClientRect(), a = ED.starts(E.st.shots)[1];
      const want = a + 0.6 * E.st.shots[1].dur;
      setPaused(true);
      shotEl(1).dispatchEvent(new MouseEvent('click', { clientX: r.left + 0.6 * r.width, bubbles: true }));
      assert(E.sel.join() === '1', 'selection ' + E.sel);
      assert(await until(() => seekTo < 0), 'the seek never landed');
      const ok = Math.abs(showT - want) <= E.st.shots[1].dur / r.width + SIM_DT;   // a pixel's worth
      setPaused(false);
      return ok || ('landed at ' + showT + ', wanted ' + want) && false;
    });
    await t("'h' hides every overlay and brings them back; typing an h does not", () => {
      const ids = ['hud', 'ui', 'tl', 'pause', 'ff', 'restart', 'rewind'];
      const shown = () => ids.map(i => getComputedStyle(document.getElementById(i)).display !== 'none');
      assert(shown().every(Boolean), 'not all shown to start with: ' + shown());
      dispatchEvent(new KeyboardEvent('keydown', { key: 'h', bubbles: true }));
      assert(shown().every(v => !v), 'not all hidden: ' + shown());
      dispatchEvent(new KeyboardEvent('keydown', { key: 'h', bubbles: true }));
      assert(shown().every(Boolean), 'not all back: ' + shown());
      const f = uiEl.expo.out;
      f.focus();
      f.dispatchEvent(new KeyboardEvent('keydown', { key: 'h', bubbles: true }));
      f.blur();
      return !document.body.classList.contains('nohud');
    });
    await t('playing into a shot keeps its start, even when a frame would step past it', async () => {
      setPaused(true); await frames(3);                        // let a frame already queued run
      const n = 3, a = ED.starts(E.st.shots)[n], sa = Math.round(a / SIM_DT);
      if (E.snaps.has(n)) { E.snaps.get(n).step = -1; }        // make sure it is not kept yet
      seekShow(a - SIM_DT); await until(() => seekTo < 0); await frames(3);
      assert(showStep === sa - 1, 'not one step before the start: ' + (showStep - sa));
      showPend = 2 * SIM_DT;                                   // this frame wants 3 steps
      frame();
      assert(showStep === sa, 'stepped past the start: ' + (showStep - sa));
      assert(E.validSnap(n), 'the start was not kept');
      frame();
      assert(showStep >= sa + 2, 'the steps held back were lost: ' + (showStep - sa));
      setPaused(false);
      return true;
    });
    await t('a replay from 0 keeps every shot start it passes', async () => {
      setPaused(true);
      for (const s of E.snaps.values()) s.step = -1;          // forget them all
      const last = E.st.shots.length - 1, a = ED.starts(E.st.shots)[last];
      rewindSim();
      seekShow(a); await until(() => seekTo < 0, 60000);
      await frames(2);
      const kept = E.st.shots.map((s, i) => E.validSnap(i));
      setPaused(false);
      return kept.slice(-6).every(Boolean) || ('kept ' + kept) && false;
    });
    await t("'.' advances exactly one frame and stays paused", async () => {
      setPaused(true); await frames(2);
      const s0 = showStep;
      dispatchEvent(new KeyboardEvent('keydown', { key: '.', bubbles: true }));
      await frames(2);
      assert(showStep === s0 + 1, 'one press: ' + (showStep - s0) + ' steps');
      dispatchEvent(new KeyboardEvent('keydown', { key: '.', bubbles: true }));
      await frames(2);
      assert(showStep === s0 + 2, 'two presses: ' + (showStep - s0) + ' steps');
      assert(cfg.paused, 'no longer paused');
      setPaused(false);
      return true;
    });
    await t("'.' simulates one step's worth even when playback left a backlog", async () => {
      setPaused(true); await frames(2);
      // what playback can leave behind: part of a frame of clock time, and steps owed
      showPend = SIM_DT * 0.9; simU -= 3;
      const s0 = showStep;
      dispatchEvent(new KeyboardEvent('keydown', { key: '.', bubbles: true }));
      await frames(2);
      const sp = evalShow((s0) * SIM_DT).speed * ui.simSpeed;
      const want = sp < 1 ? sp : Math.min(Math.floor(sp), 4);   // the HUD's x for one show step
      assert(showStep === s0 + 1, (showStep - s0) + ' show steps');
      assert(Math.abs(probe.frameSteps - want) < 1e-3, 'x' + probe.frameSteps + ', want x' + want);
      setPaused(false);
      return true;
    });
    await t('ctrl-click adds to the selection and removes again', () => {
      shotEl(3).dispatchEvent(new MouseEvent('click', { ctrlKey: true, bubbles: true }));
      assert(E.sel.join() === '1,3', 'sel ' + E.sel);
      shotEl(3).dispatchEvent(new MouseEvent('click', { ctrlKey: true, bubbles: true }));
      return E.sel.join() === '1';
    });
    await t('scale: the selected shot stretches, the ones after move, undo/redo by keys', () => {
      const d0 = E.st.shots[1].dur, end0 = SHOW_END, s2 = ED.starts(E.st.shots)[2];
      document.querySelector('#tl input[title^="Factor"]').value = '1.5';
      button('scale').click();
      assert(near(E.st.shots[1].dur, d0 * 1.5), 'dur ' + E.st.shots[1].dur);
      assert(near(SHOW_END, end0 + d0 * 0.5), 'end ' + SHOW_END);
      assert(near(ED.starts(E.st.shots)[2], s2 + d0 * 0.5), 'next shot did not move');
      assert(shotEl(1).classList.contains('mod'), 'not marked as changed');
      key('KeyZ');
      assert(near(E.st.shots[1].dur, d0) && near(SHOW_END, end0), 'undo');
      assert(!shotEl(1).classList.contains('mod'), 'still marked after undo');
      key('KeyY');
      assert(near(E.st.shots[1].dur, d0 * 1.5), 'redo (ctrl+y)');
      key('KeyZ'); key('KeyZ', { shiftKey: true });
      assert(near(E.st.shots[1].dur, d0 * 1.5), 'redo (ctrl+shift+z)');
      key('KeyZ');
      return near(E.st.shots[1].dur, d0);
    });
    await t('+10% / -10% buttons', () => {
      const d0 = E.st.shots[1].dur;
      button('+10%').click();
      assert(near(E.st.shots[1].dur, ED.r6(d0 * 1.1)), '+10%');
      key('KeyZ');
      button('-10%').click();
      assert(near(E.st.shots[1].dur, ED.r6(d0 / 1.1)), '-10%');
      key('KeyZ');
      return near(E.st.shots[1].dur, d0);
    });
    await t('len field: sets the selected shot\'s length in seconds', () => {
      const f = document.querySelector('#tl input[title^="Length"]');
      assert(near(parseFloat(f.value), E.st.shots[1].dur, 1e-3), 'shows ' + f.value);
      const d0 = E.st.shots[1].dur;
      f.value = '10'; f.dispatchEvent(new Event('change'));
      assert(near(E.st.shots[1].dur, 10), 'dur ' + E.st.shots[1].dur);
      key('KeyZ');
      return near(E.st.shots[1].dur, d0);
    });

    await t('fade field: the selected shot fades in and out over that many seconds', async () => {
      const f = document.querySelector('#tl input[title^="Fade"]');
      assert(f.value === '' && !f.disabled, 'field ' + JSON.stringify(f.value));
      f.value = '2'; f.dispatchEvent(new Event('change'));
      const s = E.st.shots[1], a = ED.starts(E.st.shots)[1];
      assert(s.fade === 2, 'fade ' + s.fade);
      assert(shotEl(1).classList.contains('mod'), 'not marked as changed');
      setPaused(true);
      E.restoreBefore(a + 1);
      seekShow(a + 1); await until(() => seekTo < 0); await frames(3);
      assert(near(probe.fade, 0.5, 0.02), 'one second in: ' + probe.fade);
      f.value = ''; f.dispatchEvent(new Event('change'));
      assert(!('fade' in E.st.shots[1]), 'empty did not clear it');
      key('KeyZ');
      assert(E.st.shots[1].fade === 2, 'undo');
      key('KeyZ');
      setPaused(false);
      return !('fade' in E.st.shots[1]) && f.value === '';
    });

    // the sliders: paused, so the playhead stays in one shot while we look
    setPaused(true);
    await frames(2);
    const i = E.cur;
    await t('typing a number beside a slider: applies on Enter, undoable, Esc and junk put it back', () => {
      const f = uiEl.expo.out, d = E.defaults.expo;
      assert(f.tagName === 'INPUT', 'not a field');
      f.focus(); f.value = '1.9';
      f.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
      assert(ui.expo === 1.9 && E.st.globals.expo === 1.9 && uiEl.expo.inp.value === '1.9', 'not applied: ' + ui.expo);
      assert(document.activeElement !== f && f.value === '1.90', 'field ' + f.value);
      assert(row('expo').dataset.chg === 'global', 'not marked');
      key('KeyZ');
      assert(ui.expo === d && f.value === (+d).toFixed(2), 'undo');
      f.focus(); f.value = '3';
      f.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
      assert(ui.expo === d && f.value === (+d).toFixed(2), 'Esc applied it');
      f.focus(); f.value = 'loud'; f.dispatchEvent(new Event('change'));
      assert(ui.expo === d && f.value === (+d).toFixed(2), 'junk applied');
      f.focus(); f.value = '99'; f.dispatchEvent(new Event('change')); f.blur();
      assert(ui.expo === parseFloat(uiEl.expo.inp.max), 'not clamped to the range: ' + ui.expo);
      key('KeyZ');
      f.focus(); setUI('expo', 1.3);
      assert(f.value === (+d).toFixed(2), 'a readout overwrote the field while focused');
      f.blur(); setUI('expo', d);
      return ui.expo === d;
    });
    await t('Space types in a field instead of pausing', () => {
      const f = uiEl.expo.out, was = cfg.paused;
      f.focus();
      f.dispatchEvent(new KeyboardEvent('keydown', { code: 'Space', key: ' ', bubbles: true }));
      f.blur();
      return cfg.paused === was;
    });
    await t('rec off: a look slider is global - marked yellow, reset to the default, undoable', () => {
      const d = E.defaults.expo;
      slide('expo', 2.05);
      assert(E.st.globals.expo === 2.05 && ui.expo === 2.05, 'not set');
      assert(!E.st.shots.some(s => s.ov && 'expo' in s.ov), 'became a shot value');
      assert(row('expo').dataset.chg === 'global', 'mark ' + row('expo').dataset.chg);
      uiEl.expo.rst.click();
      assert(E.st.globals.expo === d && ui.expo === d && row('expo').dataset.chg === '', 'reset');
      key('KeyZ');
      assert(E.st.globals.expo === 2.05, 'undo reset');
      key('KeyZ');
      return E.st.globals.expo === d && row('expo').dataset.chg === '';
    });
    await t('rec on: a look slider becomes this shot\'s own value - red, others keep the global', async () => {
      button('rec').click();
      assert(E.rec && button('rec').classList.contains('on'), 'rec not on');
      assert(row('cgain').dataset.rec === '1' && row('dropVol').dataset.rec === '', 'rec marks');
      const g = E.st.globals.cgain;
      slide('cgain', 0.12);
      assert(E.st.shots[i].ov.cgain === 0.12 && E.st.globals.cgain === g, 'not a shot value');
      assert(row('cgain').dataset.chg === 'shot', 'mark ' + row('cgain').dataset.chg);
      const other = i === 0 ? 1 : 0;
      shotEl(other).click(); await until(() => seekTo < 0 && E.cur === other);
      await frames(2);
      assert(ui.cgain === g, 'another shot sees ' + ui.cgain);
      assert(row('cgain').dataset.chg === '', 'marked in another shot');
      shotEl(i).click(); await until(() => seekTo < 0 && E.cur === i);
      await frames(2);
      assert(ui.cgain === 0.12, 'back in the shot: ' + ui.cgain);
      uiEl.cgain.rst.click();
      assert(!('cgain' in E.st.shots[i].ov) && ui.cgain === g, 'reset did not drop it');
      key('KeyZ');
      assert(E.st.shots[i].ov.cgain === 0.12, 'undo');
      key('KeyZ');
      return !('cgain' in (E.st.shots[i].ov || {}));
    });
    await t('rec on: speed multiplies all of this shot\'s speeds', () => {
      const before = ED.clone(E.st.shots), from = evalShow(showT).speed;
      slide('speed', from * 2);
      const f = parseFloat(uiEl.speed.inp.value) / from;   // the slider snaps to its step
      assert(E.st.shots[i].keys.every((k, j) => near(k[5], ED.r6(before[i].keys[j][5] * f), 1e-6)), 'not scaled');
      assert(E.st.shots.every((s, j) => j === i || JSON.stringify(s) === JSON.stringify(before[j])), 'other shots changed');
      assert(row('speed').dataset.chg === 'key', 'mark ' + row('speed').dataset.chg);
      key('KeyZ');
      return JSON.stringify(E.st.shots) === JSON.stringify(before);
    });
    await t('simSpeed is out of the panel unless the URL sets it', () =>
      row('simSpeed').style.display === 'none' && row('speed').style.display === '');
    await t('rec on: a simulation slider stays global', () => {
      const v = E.st.globals.dropVol;
      slide('dropVol', 12);
      assert(E.st.globals.dropVol === 12 && !('dropVol' in E.st.shots[i].ov), 'became a shot value');
      key('KeyZ');
      return E.st.globals.dropVol === v;
    });
    await t('rec on: a timeline slider shifts all of this shot\'s keys - blue, reset, undo', async () => {
      const before = ED.clone(E.st.shots);
      const from = evalShow(showT).el;
      slide('lightEl', from + 10);
      const dv = parseFloat(uiEl.lightEl.inp.value) - from;   // the slider snaps to its step
      assert(Math.abs(dv) > 5, 'the slider did not move');
      assert(E.st.shots[i].keys.every((k, j) => near(k[8], before[i].keys[j][8] + dv, 1e-4)), 'keys not shifted');
      assert(E.st.shots.every((s, j) => j === i || JSON.stringify(s) === JSON.stringify(before[j])), 'other shots moved');
      assert(near(evalShow(showT).el, from + dv, 1e-3), 'the frame does not show it');
      assert(row('lightEl').dataset.chg === 'key', 'mark ' + row('lightEl').dataset.chg);
      uiEl.lightEl.rst.click();
      assert(JSON.stringify(E.st.shots) === JSON.stringify(before), 'reset');
      key('KeyZ');
      assert(near(E.st.shots[i].keys[0][8], before[i].keys[0][8] + dv, 1e-4), 'undo');
      key('KeyZ');
      return JSON.stringify(E.st.shots) === JSON.stringify(before);
    });
    await t('rec off: a timeline slider leaves the keys alone', () => {
      button('rec').click();

      return JSON.stringify(E.st.shots) === before;
    });
    await t('undo / redo buttons', () => {
      slide('expo', 1.9);

      button('redo').click();

      button('undo').click();

      const [a, b] = E.span(), r0 = E.stats.restores, w0 = E.stats.rewinds;
      let out = 0;
      const ok = await until(() => {
        if (seekTo < 0 && (showT < a - 1e-9 || showT > b + 0.25)) out++;
        return E.stats.wraps >= 2 && E.stats.restores >= r0 + 2;

    await t('loop: a change before the looped shot makes its kept start stale', async () => {
      const w = E.stats.wraps;

    await t('jumping back never reloads the page', () => {
      button('loop').click();
      shotEl(0).click();
      return window.__marker === 1 && !E.loop;
    });

      const d0 = E.st.shots[0].dur;

      assert(j.src.includes("name: '1 glass', dur: " + ED.r6(d0 * 2) + ','), 'shot not written');

    });
    await t('save without a server: offers the file instead', async () => {
      const f = window.fetch;

    await t('a refused save says why', async () => {
      const f = window.fetch;

      try {
        const j = await E.save(true);

      } finally { window.fetch = f; }
    });

    const pass = Object.values(R).every(v => v === 'PASS');
    probe.edtest = { PASS: pass, ...R };
    console.log('EDTEST ' + (pass ? 'PASS' : 'FAIL') + ' ' + JSON.stringify(R));
    return probe.edtest;
  }
  if (cfg.edit && cfg.edtest) runEdTests();
  window.__edTest = () => runEdTests();
