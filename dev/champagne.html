<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Champagne Tower — dev harness</title>
<style>
  html,body { margin:0; height:100%; background:#0a0a0c; color:#ddd;
              font:12px/1.45 ui-monospace,Consolas,monospace; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; top:8px; left:8px; padding:8px 10px; background:#000a;
         border:1px solid #333; border-radius:4px; white-space:pre; pointer-events:none; }
  #ui { position:fixed; top:40px; right:8px; width:200px; padding:8px 10px; background:#000b;
        border:1px solid #333; border-radius:4px; }
  #ui .row { display:flex; align-items:center; gap:6px; margin:3px 0; }
  #ui .row label { width:52px; color:#9ab; }
  #ui .row input[type=range] { flex:1; min-width:0; }
  #ui .row span { width:40px; text-align:right; color:#ffcf6b; }
  #ui .cams { display:flex; gap:4px; margin:5px 0 7px; }
  #ui .cams button { flex:1; padding:3px 0; background:#1b1b20; color:#ddd; border:1px solid #444;
        border-radius:3px; font:11px ui-monospace,Consolas,monospace; cursor:pointer; }
  #ui .cams button:hover { background:#2f2f3a; }
  #ff { position:fixed; top:8px; right:146px; padding:6px 10px; background:#1b1b20; color:#ddd;
        border:1px solid #444; border-radius:4px; font:12px ui-monospace,Consolas,monospace; cursor:pointer; }
  #restart { position:fixed; top:8px; right:74px; padding:6px 10px; background:#1b1b20; color:#ddd;
           border:1px solid #444; border-radius:4px; font:12px ui-monospace,Consolas,monospace; cursor:pointer; }
  #pause { position:fixed; top:8px; right:8px; padding:6px 14px; background:#1b1b20; color:#ddd;
           border:1px solid #444; border-radius:4px; font:12px ui-monospace,Consolas,monospace;
           cursor:pointer; }
  #pause:hover { background:#2a2a32; }
  #err { position:fixed; left:8px; bottom:8px; right:8px; max-height:45vh; overflow:auto;
         padding:8px 10px; background:#2a0b0bdd; border:1px solid #833; border-radius:4px;
         white-space:pre-wrap; display:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">booting…</div>
<button id="pause" title="Pause rendering (spacebar). While paused, moving a slider still redraws one frame.">pause</button>
<button id="ff" title="Jump the simulation forward 20 seconds without waiting.">ff +20s</button>
<button id="restart" title="Reload the page: empties every glass and restarts the pour from zero.">restart</button>
<div id="ui"></div>
<div id="err"></div>

<!-- ───────────────────────── WGSL ───────────────────────── -->
<script type="text/wgsl" id="wgsl-main">
// The first 64 bytes are what the release keeps: everything it varies per frame. The
// rest are harness controls; the build folds them to literals and cuts their fields, so
// the release neither declares nor writes them (it used to write all 48 every frame).
struct U {
  res      : vec2f,
  time     : f32,
  frame    : f32,
  camPos   : vec3f,
  shut     : f32,
  camTgt   : vec3f,
  evx      : f32,
  emitPos  : vec3f,
  evz      : f32,
//#D{
  view     : f32,
  fov      : f32,
  maxSteps : f32,
  dt       : f32,
  spawnMod : f32,
  nPart    : f32,
  pvol     : f32,
  nPhoton  : f32,
  cgain    : f32,
  single   : f32,
  noliq    : f32,
  bub      : f32,
  expo     : f32,
  wav      : f32,
  pfield   : f32,
  bounces  : f32,
  refl     : f32,
  fillOv   : f32,
  envg     : f32,
  rtrace   : f32,
  ltAz     : f32,
  ltEl     : f32,
  prad     : f32,
  foamG    : f32,
  botTilt  : f32,
  botAz    : f32,
  botOn    : f32,
  pudCX    : f32,
  pudCZ    : f32,
  pudR     : f32,
  pudOn    : f32,
  _w2      : f32,
//#D}
};

struct Particle { pos : vec3f, life : f32, vel : vec3f, _p : f32 };

@group(0) @binding(0) var<uniform> u : U;
@group(0) @binding(1) var<storage, read_write> parts  : array<Particle>;
@group(0) @binding(2) var<storage, read_write> fine   : array<atomic<u32>>;
@group(0) @binding(3) var<storage, read_write> fineF  : array<f32>;
// The small buffers share three bindings by element type. Fourteen storage buffers needed
// requiredLimits (the default is 8 per stage, and every binding here is visible to both
// compute and fragment); its four long limit names cost 81 compressed bytes. The two
// 125 MB narrow-band buffers stay apart: one binding may not exceed 128 MiB by default.
// Offsets are abstract integers, so they add to i32 and u32 indices alike.
@group(0) @binding(4) var<storage, read_write> atom : array<atomic<u32>>;
const A_GVOL  = 4 * 32 * 32 * 32;          // occupancy, seed keys, two flood regions | then:
const A_WIMP  = A_GVOL + 2 * 14;           // glass inflow [0..13], overflow [14..27]
const A_PUDA  = A_WIMP + 2 * 14 * 32 * 32; // wave impulses [0..N), foam [N..2N) - i32 bits
const A_CAUST = A_PUDA + 384 * 384;        // puddle inflow; then the RGB photon map
@group(0) @binding(5) var<storage, read_write> vecs : array<vec4f>;
const V_GLASS  = 32 * 32 * 32;             // coarse far field, packed for the render | then:
const V_WAVE   = V_GLASS + 14;             // glass level (x)
const V_CAUSTF = V_WAVE + 14 * 32 * 32;    // waves: eta, etaOld, foam; then blurred caustics
@group(0) @binding(6) var<storage, read_write> flts : array<f32>;
const F_PUDC = 384 * 384;                  // puddle depth; then the tallest film per block
@group(0) @binding(7) var<storage, read_write> prof : array<atomic<u32>>;  // profiler banks
// Profiler. Counters compile into the profiling pipeline only (constants: { PROF: 1 }); the
// normal pipeline compiles every `if (PROF)` away, so its timing is untouched, and the
// release build substitutes false and folds the branches out. Index map in __profile().
override PROF : bool = false;
//#D{
// Cost attribution. Each bit makes map() evaluate one component a SECOND time, at a point
// offset by u._w2 (padding, always 0) so the compiler cannot prove it equal and drop it.
// The picture is unchanged; the extra render time is what that component costs.
// 1 tower, 2 liquidDist, 4 bulk liquid, 8 bottle, 16 spray trilerp, 32 spray far field.
override XC : u32 = 0u;
//#D}
var<private> pc : array<u32, 112>;
// step-limiter accounting (profiler only): which component set each march step
var<private> profMarchS : f32 = 0.0;      // the march's sign while map() is called from it, else 0
var<private> profSprayD : f32 = 1e9;
var<private> profBulkD : f32 = 1e9;
var<private> profSpraySrc : u32 = 0u;     // 0 narrow band, 1 far-field estimate, 2 band floor
var<private> profCoupeB : bool = false;   // the last sdCoupe answered from its bounding cylinder
var<private> profTowerB : bool = false;   // ...and so did the coupe sdTower's min came from
// primary-ray step accounting (profiler only): set by fs around the bounce-0 march
var<private> profPrim : bool = false;
var<private> profTpl : f32 = 0.0;

// ── glass geometry (metres) ───────────────────────────────
// Proportions taken from the reference coupe, as ratios of the rim diameter D:
//   total height 1.65 D · bowl depth 0.44 D · foot 0.67 D · stem 0.04 D
// Manufacturer spec: 280 ml, 170 mm tall, 112 mm wide. For a spherical cap
//   V = pi*h*(3R^2 + h^2)/6,  so R = 56 mm and V = 280 ml give a bowl depth of 46.3 mm.
const RIM_R    = 0.0560;                // 112 mm diameter
const BOWL_D   = 0.0463;                // bowl depth, solved for 280 ml
const RIM_Y    = 0.1700;                // 170 mm tall
const BOWL_BOT = RIM_Y - BOWL_D;
const SPH_R    = (RIM_R * RIM_R + BOWL_D * BOWL_D) / (2.0 * BOWL_D);  // cap radius
const SPH_CY   = BOWL_BOT + SPH_R;
const GLASS_T  = 0.0007;                // wall half-thickness
const STEM_R   = 0.0026;                // slender stem (0.04 D)
const FOOT_R   = 0.0374;                // 0.67 D
const FOOT_H   = 0.0077;
const FLARE_H  = 0.015;                 // stem-to-foot trumpet: height
const FLARE_R  = 0.011;                 // ...and radius where it meets the foot
const GH       = RIM_Y;                 // tier spacing = glass height
const SP       = 2.0 * RIM_R;           // rims touching

fn smin(a: f32, b: f32, k: f32) -> f32 {
  let h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

// ── volume ────────────────────────────────────────────────
const FINE   : u32 = 320u;
const COARSE : u32 = 32u;
const DOM_LO = vec3f(-0.31, -0.015, -0.31);
const DOM_SZ = 0.62;                     // the tower is 0.537 m tall
const FCELL  = DOM_SZ / 320.0;    // 1.94 mm
const CCELL  = DOM_SZ / 32.0;     // 19.4 mm
const KR     : i32 = 3;
const BAND   = 0.00625;           // KR * FCELL
// A droplet smaller than the grid's cell half-diagonal (FCELL*sqrt(3)/2 = 1.68mm at
// FINE=320) only registers when it lands near a cell centre, so a dense stream renders
// as a few scattered drops. Keep u.prad above that.
const QMAX   = 1000000.0;
const INFQ   : u32 = 4294967295u;

// ── bulk liquid ───────────────────────────────────────────
const PI    = 3.14159265;
// puddle on the table: the same bulk treatment the glasses get, as a height field
const PN    : u32 = 384u;
const PEXT  = 0.55;
const PCELL = 2.0 * PEXT / 384.0;
const PAREA = PCELL * PCELL;
const PMIN  = 0.0004;                  // below this there is no film
const PSLOPE = 0.00055;                // surface slope needed before liquid flows at all
const PCN   : u32 = 48u;               // PN / 8, for empty-table skipping
const PBCELL = 2.0 * PEXT / 48.0;   // coarse block size
const PMAXH  = 0.020;               // the pool never gets deeper than this
fn pIdx(c: vec2i) -> u32 {
  let q = clamp(c, vec2i(0), vec2i(i32(PN) - 1));
  return u32(q.y) * PN + u32(q.x);
}
fn samplePuddle(xz: vec2f) -> f32 {
  let n = xz / (2.0 * PEXT) + 0.5;
  if (any(n < vec2f(0.0)) || any(n > vec2f(1.0))) { return 0.0; }
  let t = n * f32(PN) - 0.5;
  let b = floor(t);
  let f = t - b;
  let c = vec2i(b);
  // 3x3 average per tap: the puddle is nearly a mirror at grazing angles, so cell-scale
  // steps in the height field read as rings long before they are visible as depth
  var acc = 0.0;
  for (var dy = 0; dy <= 1; dy++) {
    for (var dx = 0; dx <= 1; dx++) {
      let w = mix(1.0 - f.x, f.x, f32(dx)) * mix(1.0 - f.y, f.y, f32(dy));
      let q = c + vec2i(dx, dy);
      var m = 0.0;
      for (var ky = -1; ky <= 1; ky++) {
        for (var kx = -1; kx <= 1; kx++) { m += flts[pIdx(q + vec2i(kx, ky))]; }
      }
      acc += w * m / 9.0;
    }
  }
  return acc;
}
fn pflow(hi: f32, hj: f32) -> f32 {
  let d = hj - hi;
  // SOFT yield. A hard cut-off makes thresholded diffusion settle into a staircase, each
  // terrace exactly PSLOPE high - which from a central source is a set of concentric rings.
  return d * smoothstep(PSLOPE * 0.85, PSLOPE * 2.0, abs(d));
}
fn puddleSDF(p: vec3f) -> f32 {
  // Bound the pool in BOTH axes. `if (p.y > 0.03) return p.y - 0.03` looks like a cheap
  // early-out but it is the distance to a horizontal plane spanning the whole scene: it
  // falls to zero wherever a ray descends through 3 cm, with or without liquid below. That
  // phantom interface ate a bounce from every grazing ray, and rays ran out of bounces at
  // different distances - which banded into concentric rings on the table.
  let n = p.xz / (2.0 * PEXT) + 0.5;
  let cc = vec2i(clamp(n, vec2f(0.0), vec2f(0.999)) * f32(PCN));
  // b: the tallest the rendered film gets within a block of p's block (puddleCoarse).
  let b  = flts[F_PUDC + u32(cc.y) * PCN + u32(cc.x)];
  // Horizontal distance to wet table: if there is no film within a block, it is at least a
  // block away, which is all a bound needs. (A jump flood used to compute it exactly; it
  // cost a kernel, five dispatches and three channels per block for longer steps over dry
  // table that the plane-bounded march hardly takes.)
  var dh = 0.0;
  if (b <= PMIN) { dh = PBCELL; }
  // PMAXH (20 mm) is the deepest the pool can be anywhere, and bounding by it alone was a
  // slab over every wet block that rays crossed in 0.8 mm steps, though the film under
  // them is usually a millimetre: 7% of the steps in the domain box. Within a block of p
  // the rendered film is at most b; anything taller is at least a block away. Either way
  // it is wet table, so dh still holds. 5% fewer steps, -1.1 ms on tier2.
  let dv = p.y - PMAXH;
  let bl = max(dh, min(p.y - (b + 0.0005), max(PBCELL, dv)));
  if (bl > 0.004) { return bl; }
  if (b > PMIN) {
    let h = samplePuddle(p.xz);
    if (h >= PMIN) { return max(p.y - h, -p.y); }
  }
  return max(bl, 0.0008);
}
const R_IN  = SPH_R - GLASS_T;         // bowl interior (particle collision)
// the liquid body deliberately OVERLAPS into the glass shell: coincident surfaces let
// float noise decide glass-vs-liquid, which bands into rings. Priority in mediumAt wins.
const R_LIQ = SPH_R - GLASS_T + 0.0004;
const Y0    = SPH_CY - R_IN;           // lowest point of the bowl interior
// Spill 4mm BELOW the rim. At exactly RIM_Y the liquid's top plane is coplanar with the
// glass's rim cut plane, and that coincidence renders as an opaque disc once a glass fills.
const LMAX  = RIM_Y - Y0 - 0.004;
const WN    : u32 = 32u;               // wave grid per glass
const NG    : i32 = 14;
const VUNIT = 1e-12;                   // volume fixed-point unit (m^3)
const WUNIT = 1e-9;                    // wave impulse fixed-point unit (m)
const FUNIT = 1e-6;                    // foam fixed-point unit
const NWCELL : u32 = 14u * 32u * 32u;  // NG * WN * WN
const WMAX  = 0.01;                    // wave amplitude clamp (must match waveUpdate)

// tier split heights (midway between adjacent bowls)
const TS0 = (RIM_Y + GH + Y0) * 0.5;
const TS1 = TS0 + GH;

fn glassIdx(p: vec3f) -> i32 {
  if (p.y >= TS1) { return 13; }
  if (p.y >= TS0) {
    let c = clamp(round(p.xz / SP - 0.5), vec2f(-1.0), vec2f(0.0));
    return 9 + i32(c.x + 1.0) + 2 * i32(c.y + 1.0);
  }
  let c = clamp(round(p.xz / SP), vec2f(-1.0), vec2f(1.0));
  return i32(c.x + 1.0) + 3 * i32(c.y + 1.0);
}
fn glassOff(g: i32) -> vec3f {
  if (g == 13) { return vec3f(0.0, 2.0 * GH, 0.0); }
  if (g >= 9) {
    let k = g - 9;
    return vec3f((f32(k % 2) - 0.5) * SP, GH, (f32(k / 2) - 0.5) * SP);
  }
  return vec3f((f32(g % 3) - 1.0) * SP, 0.0, (f32(g / 3) - 1.0) * SP);
}
fn wIdx(g: i32, c: vec2i) -> u32 {
  let q = clamp(c, vec2i(0), vec2i(i32(WN) - 1));
  return u32(g) * WN * WN + u32(q.y) * WN + u32(q.x);
}
// The wave field of glass g, bilinear at xz: x = surface height, z = foam. One fetch for
// both - they were two copies differing only in the channel.
fn sampleWave(g: i32, xz: vec2f) -> vec4f {
  let t = (xz / (2.0 * RIM_R) + 0.5) * f32(WN) - 0.5;
  let b = floor(t);
  let f = t - b;
  let c = vec2i(b);
  let a0 = mix(vecs[V_WAVE + wIdx(g, c)],                  vecs[V_WAVE + wIdx(g, c + vec2i(1,0))], f.x);
  let a1 = mix(vecs[V_WAVE + wIdx(g, c + vec2i(0,1))],     vecs[V_WAVE + wIdx(g, c + vec2i(1,1))], f.x);
  var r = mix(a0, a1, f.y);
  if (u.wav < 0.5) { r.x = 0.0; }               // waves off: a flat surface, foam kept
  return r;
}
// rising CO2 bubbles, as a lattice of spheres translated upward through glass-local space
fn bubbleSDF(ql: vec3f) -> f32 {
  let CB = 0.0055;
  var p = ql;
  p.y -= u.time * 0.085;
  let id = floor(p / CB);
  let r3 = rnd3(u32(i32(id.x) + 4096), u32(i32(id.y) + 4096), u32(i32(id.z) + 4096));
  if (r3.z > 0.22) { return 1.0; }                       // most cells are empty
  let rad = 0.00010 + r3.x * 0.00034;
  let jit = (r3 - 0.5) * CB * 0.45;
  return length(p - (id + 0.5) * CB - jit) - rad;
}

// liquid body of one glass: sphere-cap interior cut by the (wavy) surface plane
fn bulkSDF(p: vec3f) -> f32 {
  let g = glassIdx(p);
  let L = vecs[V_GLASS + g].x;
  if (L <= 0.0002) { return 1.0; }
  let q  = p - glassOff(g);
  let dS = length(q - vec3f(0.0, SPH_CY, 0.0)) - R_LIQ;
  // flat-surface estimate first; waves are clamped to +/-WMAX so this bounds the error
  let d0 = max(dS, q.y - (Y0 + L));
  if (d0 > WMAX * 1.1) { return d0 - WMAX; }   // too far for a wave to matter: skip the fetch
  if (PROF) { pc[5] += 1u; }
  let dl = max(dS, q.y - (Y0 + L + sampleWave(g, q.xz).x));
  if (u.bub > 0.5 && dl < 0.0) { if (PROF) { pc[43] += 1u; } return max(dl, -bubbleSDF(q)); }
  return dl;
}

fn fIdx(c: vec3i) -> u32 { return u32(c.x) + u32(c.y) * FINE + u32(c.z) * FINE * FINE; }
fn cIdx(c: vec3i) -> u32 { return u32(c.x) + u32(c.y) * COARSE + u32(c.z) * COARSE * COARSE; }
fn c3(i: u32) -> vec3i {
  return vec3i(i32(i % COARSE), i32((i / COARSE) % COARSE), i32(i / (COARSE * COARSE)));
}
// PCG3D. The sin()-based hash below loses all precision once the index is large
// (dot() reaches ~3e7 for 262k photons), which shows up as correlated samples.
fn pcg3d(vin: vec3u) -> vec3u {
  var v = vin * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> vec3u(16u);
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return v;
}
fn rnd3(a: u32, b: u32, c: u32) -> vec3f {
  return vec3f(pcg3d(vec3u(a, b, c))) * (1.0 / 4294967296.0);
}
fn hash3(p: vec3f) -> vec3f {
  var q = vec3f(dot(p, vec3f(127.1, 311.7, 74.7)),
                dot(p, vec3f(269.5, 183.3, 246.1)),
                dot(p, vec3f(113.5, 271.9, 124.6)));
  return fract(sin(q) * 43758.5453);
}

fn sdCyl(p: vec3f, r: f32, y0: f32, y1: f32) -> f32 {
  let d = vec2f(length(p.xz) - r, max(y0 - p.y, p.y - y1));
  return min(max(d.x, d.y), 0.0) + length(max(d, vec2f(0.0)));
}
fn sdCoupe(p: vec3f) -> f32 {
  if (PROF) { pc[6] += 1u; }
  // Bounding cylinder first. It is a lower bound on the distance to anything this coupe can
  // be - safe for sphere tracing, a step can only get shorter - and the exact SDF is only
  // needed within a few mm of it. sdTower evaluates three coupes per sample and a point is
  // usually far from at least two of them: the tiers are 17 cm apart.
  let bnd = max(length(p.xz) - (RIM_R + 0.002), max(-p.y - 0.002, p.y - (RIM_Y + 0.002)));
  if (bnd > 0.004) { if (PROF) { profCoupeB = true; } return bnd; }
  if (PROF) { pc[7] += 1u; profCoupeB = false; }
  // bowl: a spherical cap shell, cut at the rim and thinned towards it
  var bowl = abs(length(p - vec3f(0.0, SPH_CY, 0.0)) - SPH_R) - GLASS_T;
  bowl = max(bowl, p.y - RIM_Y);
  // slender stem, and the solid glass knuckle the bowl sits on
  // Stem, flaring into the foot like a trumpet as in the reference: ONE profiled surface,
  // radius STEM_R + (FLARE_R - STEM_R)(1-t)^2.5 over FLARE_H. It used to be a separate flare
  // primitive. smin-ing it to the stem inflated the near-coincident surfaces into a collar
  // (up to k/4), and even with min its flat top cap, though never on the surface, bent the
  // finite-difference normals just above it into a seam line. One surface has neither.
  // (1-t)^2.5 brings slope AND curvature to zero at the top: no crease even in a highlight.
  // The radial distance is scaled by the LOCAL steepness, 1/sqrt(1 + r'(y)^2), which is 1
  // up the plain stem, so the long straight part marches at full speed.
  let fr = length(p.xz);
  let ft = clamp((p.y - 0.0030) / FLARE_H, 0.0, 1.0);
  // x^2.5 and x^1.5 as products with one sqrt: pow() is exp(log()) and sdCoupe runs 3-4
  // times per distance evaluation, millions of times a frame
  let fx = 1.0 - ft;
  let fq = fx * sqrt(fx);
  let sr = STEM_R + (FLARE_R - STEM_R) * fx * fq;
  let fk = 2.5 * (FLARE_R - STEM_R) / FLARE_H * fq;
  let stem = max(max((fr - sr) / sqrt(1.0 + fk * fk), p.y - (BOWL_BOT + 0.005)), -p.y);
  let knuc = length((p - vec3f(0.0, BOWL_BOT + 0.0045, 0.0)) * vec3f(1.0, 0.62, 1.0)) - 0.0080;
  // Foot: a thin plate, 2.2 mm at the rim rising to 4.4 mm at the centre, flat underneath
  // at y = 0, rim rounded. It used to be a rounded cylinder spanning y = -1.3..7.7 mm - a
  // 9 mm puck, sunk 1.3 mm into the table - where the reference (a thin plate, photo 5) is
  // a quarter of that. Cross-section: a capsule along r whose centre height and radius
  // both taper linearly, so it is flat-bottomed and its top is a shallow cone.
  let fs = clamp(fr / (FOOT_R - 0.0011), 0.0, 1.0);
  let fh = mix(0.0022, 0.0011, fs);
  let foot = (length(vec2f(max(fr - (FOOT_R - 0.0011), 0.0), p.y - fh)) - fh) * 0.95;
  var d = smin(stem, knuc, 0.0070);
  d = smin(d, bowl, 0.0045);
  d = smin(d, foot, 0.0020);
  // The knuckle and the top of the stem are blended into the shell for the fillet UNDER
  // the bowl, but they reached up INTO it. Scaling y by 0.62 inside length() stretches the
  // knuckle to 12.9 mm tall rather than squashing it, so it rose ~17 mm above the bowl
  // bottom, and the stem itself ended 5 mm above it: a dome standing in the champagne.
  // Carve the cavity back out, so the inside of the bowl is the spherical cap and nothing
  // else, whatever the fillets and the knuckle do underneath. It coincides exactly with the
  // shell's own inner face, which is fine within one SDF - the liquid's deliberate 0.5 mm
  // overlap into the shell is unchanged.
  let cav = length(p - vec3f(0.0, SPH_CY, 0.0)) - (SPH_R - GLASS_T);
  return max(d, -cav);
}
fn sdTower(p: vec3f) -> f32 {
  if (u.single > 0.5) { return sdCoupe(p); }   // debug: one coupe, no folding
  let f0 = SP * clamp(round(p.xz / SP), vec2f(-1.0), vec2f(1.0));
  var d = sdCoupe(vec3f(p.x - f0.x, p.y, p.z - f0.y));
  let p1 = p - vec3f(0.0, GH, 0.0);
  let f1 = SP * (clamp(round(p1.xz / SP - 0.5), vec2f(-1.0), vec2f(0.0)) + 0.5);
//#D{
  if (PROF) {   // the same, noting whether the winning coupe answered from its bound
    var tb = profCoupeB;
    let d1 = sdCoupe(vec3f(p1.x - f1.x, p1.y, p1.z - f1.y));
    if (d1 < d) { tb = profCoupeB; }
    d = min(d, d1);
    let d2 = sdCoupe(p - vec3f(0.0, 2.0 * GH, 0.0));
    if (d2 < d) { tb = profCoupeB; }
    profTowerB = tb;
    return min(d, d2);
  }
//#D}
  d = min(d, sdCoupe(vec3f(p1.x - f1.x, p1.y, p1.z - f1.y)));
  d = min(d, sdCoupe(p - vec3f(0.0, 2.0 * GH, 0.0)));
  return d;
}
fn towerN(p: vec3f) -> vec3f {
  let e = vec2f(1.0, -1.0) * 0.00015;
  return normalize( e.xyy * sdTower(p + e.xyy) + e.yyx * sdTower(p + e.yyx)
                  + e.yxy * sdTower(p + e.yxy) + e.xxx * sdTower(p + e.xxx) );
}
fn sdBoxDom(p: vec3f) -> f32 {
  let q = abs(p - (DOM_LO + vec3f(DOM_SZ * 0.5))) - vec3f(DOM_SZ * 0.5);
  return length(max(q, vec3f(0.0))) + min(max(q.x, max(q.y, q.z)), 0.0);
}

// ═══════════════ compute ═══════════════
@compute @workgroup_size(64)
// A dispatch passes a small index as the HEIGHT of its grid: rows above 0 exit at once,
// and num_workgroups.y - 1 is the index. That replaced a uniform buffer of 256-byte slots,
// a second bind group and dynamic offsets - all of it JS the release had to carry.
fn simParticles(@builtin(global_invocation_id) g: vec3u, @builtin(num_workgroups) nw: vec3u) {
  let i = g.x;
  if (i >= u32(u.nPart) || g.y > 0u) { return; }
  var p = parts[i];

  let PV = u32(u.pvol / VUNIT);

  // The bottle owns a RESERVED slice of the pool. Sharing one pool starves it: spill
  // particles live ~6 s and occupy nearly every index once the tower cascades, so a
  // bottle slot almost always lands on an index that is still alive.
  let POOL = max(u32(u.nPart) / 6u, 1u);

  // nw.y - 1 is the sub-step index: without it every substep in a frame shares one
  // spawn cadence, so fast-forward advances the drops without emitting new ones.
  let fc = u32(u.frame) + nw.y - 1u;

  if (p.life <= 0.0) {
    let h = rnd3(i, fc, 3u);
    var born = false;

    if (i < POOL) {
      // bottle: rate-limited inside its own slice
      let m = max(u32(u.spawnMod), 1u);
      if ((i % m) == (fc % m)) {
        p.pos  = u.emitPos + vec3f((h.x - 0.5) * 0.004, 0.0, (h.y - 0.5) * 0.004);
        // the stream inherits the bottle's drift, so it trails the wander instead of
        // falling dead straight from a moving point
        p.vel  = vec3f(u.evx, -0.35, u.evz) + (h - 0.5) * 0.015;
        p.life = 9.0;
        born = true;
      }
    } else {
      // spill from a glass that has overflowed (drives the cascade)
      for (var k = 0; k < NG; k++) {
        let g = (i32(i) + k) % NG;
        // CAS, not sub-then-add-back: a plain atomicSub underflows u32 and invents volume
        var took = false;
        for (var tries = 0; tries < 3; tries++) {
          let cur = atomicLoad(&atom[A_GVOL + u32(NG + g)]);
          if (cur < PV) { break; }
          let r = atomicCompareExchangeWeak(&atom[A_GVOL + u32(NG + g)], cur, cur - PV);
          if (r.exchanged) { took = true; break; }
        }
        if (took) {
          let a  = h.x * 6.2831853;
          let off = glassOff(g);
          let h2 = rnd3(i, fc, 11u);
          // Spill where the surface is actually highest. Picking a uniform azimuth makes
          // the glass overflow evenly all the way round, which reads as a waterfall curtain
          // instead of the few wandering rivulets a real tower produces.
          var aa = a;
          var best = -1e9;
          for (var t = 0; t < 4; t++) {
            let ta = a + f32(t) * 1.5707963;
            let e  = sampleWave(g, vec2f(cos(ta), sin(ta)) * RIM_R * 0.93).x;
            if (e > best) { best = e; aa = ta; }
          }
          let a2 = aa + (h2.z - 0.5) * 0.5;
          p.pos = off + vec3f(cos(a2) * RIM_R * 0.99, RIM_Y + 0.001, sin(a2) * RIM_R * 0.99);
          p.vel = vec3f(cos(a2) * 0.05, -0.02, sin(a2) * 0.05) + (h2 - 0.5) * 0.07;
          p.life = 6.0;
          born = true;
          break;
        }
      }
    }
    if (!born) { return; }

    // Sub-frame emission, for BOTH emitters. A frame's worth of drops must not all start
    // at the same point: by the time spill is falling at ~1 m/s a cohort lands ~17 mm from
    // the next one, which reads as a chain of discrete beads. Advancing each drop by a
    // random fraction of the step - position and velocity, gravity included - makes the
    // emission continuous rather than stroboscopic.
    let ts = h.z * u.dt;
    p.vel += vec3f(0.0, -9.81 * ts, 0.0);
    p.pos += p.vel * ts;
  }

  // substepped integration; the bowl is a POSITION constraint so it cannot be tunnelled
  let NSUB = 4;
  let dt = u.dt / f32(NSUB);
  let c = vec3f(0.0, SPH_CY, 0.0);
  for (var s = 0; s < NSUB; s++) {
    p.vel.y -= 9.81 * dt;
    var np = p.pos + p.vel * dt;

    let g    = glassIdx(np);
    let off  = glassOff(g);
    let qOld = p.pos - off;
    let q    = np - off;
    // only constrain particles that were already INSIDE this bowl — never suck in outsiders
    let wasIn = length(qOld - c) <= R_IN && qOld.y <= RIM_Y;

    if (wasIn) {
      // absorbed into the bulk once below the surface
      let top = Y0 + vecs[V_GLASS + g].x + sampleWave(g, q.xz).x;
      if (q.y <= top) {
        atomicAdd(&atom[A_GVOL + u32(g)], PV);
        let t  = (q.xz / (2.0 * RIM_R) + 0.5) * f32(WN);
        let hit = vec2i(t);
        atomicAdd(&atom[A_WIMP + wIdx(g, hit)], u32(i32(clamp(-p.vel.y, 0.0, 3.0) * 0.00035 / WUNIT)));
        // mousse: CO2 foam is generated by the impact itself
        atomicAdd(&atom[A_WIMP + wIdx(g, hit) + NWCELL], u32(i32(clamp(-p.vel.y, 0.15, 4.0) * 0.02 / FUNIT)));
        p.life = 0.0;
        parts[i] = p;
        return;
      }
      let rel = q - c;
      let d   = length(rel);
      if (d > R_IN) {
        let n = rel / d;
        np = off + c + n * R_IN;
        let vn = dot(p.vel, n);
        if (vn > 0.0) { p.vel -= n * vn * 1.25; }
        p.vel *= 0.80;
      }
    }
    if (np.y < 0.0) {
      // join the puddle rather than bouncing and quietly expiring
      let pc = vec2i(floor((np.xz / (2.0 * PEXT) + 0.5) * f32(PN)));
      if (all(pc >= vec2i(0)) && all(pc < vec2i(i32(PN)))) {
        atomicAdd(&atom[A_PUDA + pIdx(pc)], PV);
      }
      p.life = 0.0;
      parts[i] = p;
      return;
    }
    p.pos = np;
  }

  p.life -= u.dt;
  parts[i] = p;
}

// ── bulk level per glass: dL/dt = Q / A(L), overflow spills at the rim ──
// One glass's level for this step, from the volume poured in; the excess goes to overflow.
// Run by the first NG threads of puddleUpdate - the two are independent, and a kernel of
// its own was 14 threads and an entry point.
fn glassUpdate(g: i32) {
  let inflow = f32(atomicExchange(&atom[A_GVOL + u32(g)], 0u)) * VUNIT;
  if (u.fillOv >= 0.0) { vecs[V_GLASS + g] = vec4f(u.fillOv * LMAX, 0.0, 0.0, 0.0); return; }
  var L = vecs[V_GLASS + g].x;
  let y  = Y0 + L;
  let r2 = max(R_IN * R_IN - (y - SPH_CY) * (y - SPH_CY), 1e-6);
  let A  = PI * r2;
  L += inflow / A;
  if (L > LMAX) {
    atomicAdd(&atom[A_GVOL + u32(NG + g)], u32(max((L - LMAX) * A, 0.0) / VUNIT));
    L = LMAX;
  }
  vecs[V_GLASS + g] = vec4f(L, 0.0, 0.0, 0.0);
}

// ── surface waves: 2D wave equation on each glass's disc ──
@compute @workgroup_size(64)
fn waveUpdate(@builtin(global_invocation_id) gi: vec3u) {
  let n = gi.x;
  if (n >= u32(NG) * WN * WN) { return; }
  let g = i32(n / (WN * WN));
  let c = vec2i(i32(n % WN), i32((n / WN) % WN));

  let imp = f32(i32(atomicExchange(&atom[A_WIMP + n], 0u))) * WUNIT;
  let fin = f32(i32(atomicExchange(&atom[A_WIMP + n + NWCELL], 0u))) * FUNIT;
  let e   = vecs[V_WAVE + n];
  var eta = e.x;
  let old = e.y;

  let lap = vecs[V_WAVE + wIdx(g, c + vec2i(1,0))].x + vecs[V_WAVE + wIdx(g, c - vec2i(1,0))].x
          + vecs[V_WAVE + wIdx(g, c + vec2i(0,1))].x + vecs[V_WAVE + wIdx(g, c - vec2i(0,1))].x - 4.0 * eta;

  var nw = 2.0 * eta - old + 0.25 * lap - 0.06 * (eta - old) - imp;

  // damp to zero at the disc boundary
  let rr = length((vec2f(c) + 0.5) / f32(WN) - 0.5) * 2.0;
  if (rr > 0.94) { nw *= 0.2; }
  nw = clamp(nw, -WMAX, WMAX);

  let foam = clamp(e.z * 0.978 + fin, 0.0, 1.6);   // mousse collapses over a few seconds
  vecs[V_WAVE + n] = vec4f(nw, eta, foam, 0.0);
}

// ── caustics: trace photons from the key light through glass+champagne onto the table ──
// puddle: take the frame's inflow, then let it flow downhill. On a flat table that is
// just height-driven spreading, which gives a pool that widens as more arrives.
@compute @workgroup_size(256)
fn puddleUpdate(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x;
  if (i >= PN * PN) { return; }
  if (i < u32(NG)) { glassUpdate(i32(i)); }
  let c = vec2i(i32(i % PN), i32(i / PN));
  var h = flts[i] + f32(atomicExchange(&atom[A_PUDA + i], 0u)) * VUNIT / PAREA;

  let hl = flts[pIdx(c - vec2i(1,0))];
  let hr = flts[pIdx(c + vec2i(1,0))];
  let hd = flts[pIdx(c - vec2i(0,1))];
  let hu = flts[pIdx(c + vec2i(0,1))];
  // Yield threshold, not plain diffusion. Liquid only flows where the surface slope beats
  // PSLOPE, which is what surface tension and contact angle do: a real spill stops at a
  // definite edge. Without it the film creeps outward forever and ends up covering the
  // whole table in a sub-millimetre sheet whose radial structure reads as ripple rings.
  h += 0.24 * (pflow(h, hl) + pflow(h, hr) + pflow(h, hd) + pflow(h, hu));
  flts[i] = clamp(h, 0.0, 0.05);
}

@compute @workgroup_size(64)
fn puddleCoarse(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x;
  if (i >= PCN * PCN) { return; }
  let b = vec2i(i32(i % PCN), i32(i / PCN)) * 8;
  // The tallest the RENDERED film gets anywhere within one block of this one - the 3x3
  // blocks around it, plus 3 cells, since samplePuddle's smoothed bilinear tap reads up to
  // two cells from a point's own. puddleSDF bounds by it out to a block's distance.
  var mh = 0.0;
  for (var y = -11; y < 19; y++) {
    for (var x = -11; x < 19; x++) { mh = max(mh, flts[pIdx(b + vec2i(x, y))]); }
  }
  flts[F_PUDC + i] = mh;
}


@compute @workgroup_size(256)
fn causticDecay(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x;
  if (i >= CN * CN * 3u) { return; }
  atomicStore(&atom[A_CAUST + i], (atomicLoad(&atom[A_CAUST + i]) * 236u) / 256u);   // temporal fade
}

@compute @workgroup_size(256)
fn causticBlur(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x;
  if (i >= CN * CN) { return; }
  let c = vec2i(i32(i % CN), i32(i / CN));
  var sum = vec3f(0.0);
  for (var dy = -2; dy <= 2; dy++) {
    for (var dx = -2; dx <= 2; dx++) { sum += causFetch(c + vec2i(dx, dy)); }
  }
  vecs[V_CAUSTF + i] = vec4f(sum / 25.0, 0.0);
}

@compute @workgroup_size(64)
fn photons(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x;
  if (i >= u32(u.nPhoton)) { return; }
  let h = rnd3(i, u32(u.frame), 5u);

  let L  = lightDir();
  let t1 = normalize(cross(L, vec3f(0.0, 1.0, 0.0)));
  let t2 = cross(L, t1);
  let a  = h.x * 6.2831853;
  let rr = sqrt(h.y);
  let r  = rr * 0.38;                        // projects to a ~0.53 m semi-axis at this elevation
  var p  = vec3f(0.0, 0.17, 0.0) + L * 0.75 + t1 * (cos(a) * r) + t2 * (sin(a) * r);
  var d  = -L;
  var med = 0;
  // window the emitter so the pool of light fades out instead of ending on a hard circle
  var w   = vec3f(smoothstep(1.0, 0.50, rr));

  for (var b = 0; b < 4; b++) {
    let lg = leg(p, d, med);
    if (lg.y == 0.0) { return; }
    w *= exp(-sigmaOf(med) * lg.x);
    let hp = p + d * lg.x;
    // deposit on the table - reached directly, or from inside the puddle
    var tab = lg.y == 1.0;
    var sf: Turn;
    if (!tab) { sf = turn(hp, d, med); tab = sf.medA == 3; }
    if (tab) {
      let t = (hp.xz / (2.0 * CEXT) + 0.5) * f32(CN);
      if (all(t >= vec2f(0.0)) && all(t < vec2f(f32(CN)))) {
        let k = causIdx(vec2i(t));
        let e = w * CSCALE * clamp(-d.y, 0.0, 1.0);
        atomicAdd(&atom[A_CAUST + k],      u32(max(e.x, 0.0)));
        atomicAdd(&atom[A_CAUST + k + 1u], u32(max(e.y, 0.0)));
        atomicAdd(&atom[A_CAUST + k + 2u], u32(max(e.z, 0.0)));
      }
      return;
    }
    if (!sf.tir) { w *= (1.0 - sf.F); }
    d = sf.d; p = sf.p; med = sf.med;
    if (max(w.x, max(w.y, w.z)) < 0.02) { return; }
  }
}

// Two cells per thread, at the default 256-wide groups: one cell each would take 128 000
// groups, past the 65 535 cap per dimension, and 512-wide groups need a raised limit.
const FHALF = FINE * FINE * FINE / 2u;
@compute @workgroup_size(256)
fn clearFine(@builtin(global_invocation_id) g: vec3u) {
  if (g.x >= FHALF) { return; }
  atomicStore(&fine[g.x], INFQ);
  atomicStore(&fine[g.x + FHALF], INFQ);
  // the coarse occupancy blocks and far-field seed keys, in the same dispatch
  if (g.x < COARSE * COARSE * COARSE) {
    atomicStore(&atom[g.x], 0u);
    atomicStore(&atom[COARSE * COARSE * COARSE + g.x], 0xFFFFFFFFu);
  }
}


// narrow-band exact scatter. Each particle deposits a swept CAPSULE, not a sphere: over
// one shutter interval a falling drop traces a streak, and recording it as a point is what
// makes a pour read as a string of frozen beads instead of liquid.
fn sdSeg(p: vec3f, a: vec3f, b: vec3f) -> f32 {
  let pa = p - a;
  let ba = b - a;
  let h  = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-12), 0.0, 1.0);
  return length(pa - ba * h);
}

@compute @workgroup_size(64)
fn scatterFine(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x;
  if (i >= u32(u.nPart)) { return; }
  let p = parts[i];
  if (p.life <= 0.0) { return; }

  // Far-field seed key for this particle's coarse cell (see the note on the coarse far
  // field below): nearest to the cell centre wins, so the choice is the same every frame.
  let sc = vec3i(floor((p.pos - DOM_LO) / CCELL));
  if (all(sc >= vec3i(0)) && all(sc < vec3i(i32(COARSE)))) {
    let cp = DOM_LO + (vec3f(sc) + 0.5) * CCELL;
    let qd = u32(clamp(length(p.pos - cp) / CCELL, 0.0, 0.999) * 65535.0);
    atomicMin(&atom[COARSE * COARSE * COARSE + cIdx(sc)], (qd << 16u) | (i & 0xFFFFu));
  }

  var v = p.vel * u.shut;
  let L = length(v);
  // The cap bounds the scatter loop, so it has to grow with the shutter window rather than
  // sit at a constant: a fixed 24 mm stops the streak growing while the gap between frames
  // keeps growing, which reads as the pour clamping. 2.88 * u.shut is exactly 24 mm at the
  // default half-shutter and one step, so this changes nothing at 60 fps.
  let cap = 2.88 * u.shut;
  if (L > cap) { v = v * (cap / L); }
  let a = p.pos - v * 0.5;
  let b = p.pos + v * 0.5;

  let lo = clamp(vec3i(floor((min(a, b) - vec3f(BAND) - DOM_LO) / FCELL)),
                 vec3i(0), vec3i(i32(FINE) - 1));
  let hi = clamp(vec3i(ceil ((max(a, b) + vec3f(BAND) - DOM_LO) / FCELL)),
                 vec3i(0), vec3i(i32(FINE) - 1));

  for (var z = lo.z; z <= hi.z; z++) {
    for (var y = lo.y; y <= hi.y; y++) {
      for (var x = lo.x; x <= hi.x; x++) {
        let cc = vec3i(x, y, z);
        let cp = DOM_LO + (vec3f(cc) + 0.5) * FCELL;
        let d  = sdSeg(cp, a, b);
        if (d < BAND) {
          atomicMin(&fine[fIdx(cc)], u32(clamp(d / BAND, 0.0, 1.0) * QMAX));
        }
      }
    }
  }

  // Mark the coarse blocks whose trilerps can read a cell this capsule touched. For p in
  // block B, liquidDist's eight corners lie in fine cells [bs*B - 1, bs*B + bs] - one cell
  // past each face, never more - so B must be marked exactly when [lo, hi] overlaps that
  // range, and an unmarked block then guarantees all eight corners hold BAND: skipping the
  // trilerp is exact. (Clamping at the domain edges only shrinks the reach.)
  // This used to dilate by a whole block on every side, marking up to 3x3x3 blocks (58 mm)
  // around a band ~3 cells deep; 68% of the trilerps it let through landed outside the band.
  // Exact reach cuts trilerps 36% on heavy tier2 (identical picture) but buys only ~0.4 ms:
  // they are cheap, so a finer grid for the remaining half would not pay for its buffer.
  let bs  = i32(FINE / COARSE);                 // 10 fine cells per block
  let blo = clamp((lo - vec3i(1)) / bs, vec3i(0), vec3i(i32(COARSE) - 1));
  let bhi = clamp((hi + vec3i(1)) / bs, vec3i(0), vec3i(i32(COARSE) - 1));
  for (var z = blo.z; z <= bhi.z; z++) {
    for (var y = blo.y; y <= bhi.y; y++) {
      for (var x = blo.x; x <= bhi.x; x++) {
        atomicStore(&atom[cIdx(vec3i(x, y, z))], 1u);
      }
    }
  }
}

// Coarse far field, now deterministic. The occupancy buffer holds, after the 32^3 blocks,
// three more 32^3 regions of particle indices: seed keys, then two jump-flood buffers.
//
// Seeding used to be a plain store of one particle per cell - whichever thread wrote last,
// which changed every frame - and the flood ran in place, threads reading cells other
// threads were writing. Both made the far field differ from frame to frame, so the steps a
// ray took near the spray differed, and drops flickered with the simulation frozen. Now the
// seed is the particle nearest the cell centre (atomicMin on distance << 16 | index) and
// every flood pass reads one region and writes the other.

// Packed by resolveFine: what the render needs per coarse cell, in one plain vec4: the seed particle's
// position, and in w: +1 a seed exists, +2 the block is occupied. Both of those live in
// occ, which is atomic because the compute passes build it - and in the fragment shader an
// atomicLoad is not a cached load. Two of them per liquidDist call, plus the dependent read
// of the seed particle, ~114 M calls a frame on tier2.

// jump flooding on the coarse grid (in place) — far-field nearest-particle field
@compute @workgroup_size(64)
fn jfaCoarse(@builtin(global_invocation_id) g: vec3u, @builtin(num_workgroups) nw: vec3u) {
  let i = g.x;
  if (i >= COARSE * COARSE * COARSE || g.y > 0u) { return; }
  // pass k of 5 (nw.y - 1): stride 16 >> k, and the ping-pong keys -> R1 -> R2 -> R1 -> R2
  // -> R1 between occ's regions, ending in R1, the one liquidDist reads
  let k = nw.y - 1u;
  let src = select(select(3u, 2u, k % 2u == 1u), 1u, k == 0u) * COARSE * COARSE * COARSE;
  let c  = c3(i);
  let cp = DOM_LO + (vec3f(c) + 0.5) * CCELL;
  var best = atomicLoad(&atom[src + i]);
  var bd = 1e9;
  if (best != 0xFFFFFFFFu) { bd = length(cp - parts[best & 0xFFFFu].pos); }
  let st = i32(16u >> k);
  for (var dz = -1; dz <= 1; dz++) {
    for (var dy = -1; dy <= 1; dy++) {
      for (var dx = -1; dx <= 1; dx++) {
        let nc = c + vec3i(dx, dy, dz) * st;
        if (any(nc < vec3i(0)) || any(nc >= vec3i(i32(COARSE)))) { continue; }
        let v = atomicLoad(&atom[src + cIdx(nc)]);
        if (v == 0xFFFFFFFFu) { continue; }
        let dd = length(cp - parts[v & 0xFFFFu].pos);
        if (dd < bd) { bd = dd; best = v; }
      }
    }
  }
  if (best != 0xFFFFFFFFu) { best = best & 0xFFFFu; }
  atomicStore(&atom[select(2u, 3u, k % 2u == 1u) * COARSE * COARSE * COARSE + i], best);
}

fn resolveCell(i: u32) {
  let q = atomicLoad(&fine[i]);
  var d = BAND;
  if (q != INFQ) { d = f32(q) / QMAX * BAND; }
  fineF[i] = d;
}
@compute @workgroup_size(256)
fn resolveFine(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x;
  if (i >= FHALF) { return; }
  resolveCell(i);
  resolveCell(i + FHALF);         // two cells per thread, as in clearFine
  // and pack the coarse cells for the render (see the note above)
  if (i < COARSE * COARSE * COARSE) {
    let qi = atomicLoad(&atom[2u * COARSE * COARSE * COARSE + i]);
    var v = vec4f(0.0);
    if (qi != 0xFFFFFFFFu) { v = vec4f(parts[qi].pos, 1.0); }
    if (atomicLoad(&atom[i]) != 0u) { v.w += 2.0; }
    vecs[i] = v;
  }
}

// ═══════════════ liquid distance field ═══════════════
fn fineAt(c: vec3i) -> f32 {
  let cc = clamp(c, vec3i(0), vec3i(i32(FINE) - 1));
  return fineF[fIdx(cc)];
}
fn liquidDist(p: vec3f) -> f32 {
  if (PROF) { pc[2] += 1u; profSprayD = 1e9; profBulkD = 1e9; }
  if (u.noliq > 0.5) { return 1e9; }          // debug: dry glass
  var dPud = 1e9;
  if (u.pudOn > 0.5) { dPud = puddleSDF(p); }
  // the particle toggle must isolate ONLY the particle field - returning early here also
  // disabled the puddle, which made an earlier bisection point at the wrong thing
  if (u.pfield < 0.5) { return min(bulkSDF(p), dPud); }
  // The eight trilerp fetches are scattered reads out of a 125 MiB buffer and they were a
  // third of the whole frame, paid on every march step whether or not a particle is within
  // reach. One read of the coarse cell answers that, and an unmarked block guarantees all
  // eight corners hold BAND (see the dilation in scatterFine), so this is exact, not an
  // approximation. Clamp like fineAt does, so a point outside the domain tests the same
  // border block its corners clamp into.
  //
  // The cell comes from `coarse`, packed by resolveFine, not from `occ`: occ is atomic, and
  // in a fragment shader an atomicLoad is not a cached load. Two of them per call plus the
  // dependent read of the seed particle cost 3.1 ms of tier2's 24.8 ms render, for values
  // that are bit-identical once packed.
  let oc = vec3i(clamp(floor((p - DOM_LO) / CCELL), vec3f(0.0), vec3f(f32(COARSE) - 1.0)));
  let cq = vecs[cIdx(oc)];                 // xyz seed particle, w: +1 seed, +2 occupied
  var tri = BAND;
  if (cq.w > 1.5) {
    if (PROF) { pc[3] += 1u; }
    let gp = (p - DOM_LO) / FCELL - 0.5;
    let b  = floor(gp);
    let f  = gp - b;
    let c  = vec3i(b);
    let x00 = mix(fineAt(c + vec3i(0,0,0)), fineAt(c + vec3i(1,0,0)), f.x);
    let x10 = mix(fineAt(c + vec3i(0,1,0)), fineAt(c + vec3i(1,1,0)), f.x);
    let x01 = mix(fineAt(c + vec3i(0,0,1)), fineAt(c + vec3i(1,0,1)), f.x);
    let x11 = mix(fineAt(c + vec3i(0,1,1)), fineAt(c + vec3i(1,1,1)), f.x);
    tri = mix(mix(x00, x10, f.y), mix(x01, x11, f.y), f.z);
//#D{
    if ((XC & 16u) != 0u) {
      let c2 = vec3i(b + u._w2);
      let y00 = mix(fineAt(c2 + vec3i(0,0,0)), fineAt(c2 + vec3i(1,0,0)), f.x);
      let y10 = mix(fineAt(c2 + vec3i(0,1,0)), fineAt(c2 + vec3i(1,1,0)), f.x);
      let y01 = mix(fineAt(c2 + vec3i(0,0,1)), fineAt(c2 + vec3i(1,0,1)), f.x);
      let y11 = mix(fineAt(c2 + vec3i(0,1,1)), fineAt(c2 + vec3i(1,1,1)), f.x);
      tri = min(tri, mix(mix(y00, y10, f.y), mix(y01, y11, f.y), f.z) + 1.0);
    }
//#D}
  }

  // far field: distance to the nearest-seed particle of the jump flood
  var dc = 1.0;
  if (fract(cq.w * 0.5) > 0.25) { dc = (length(p - cq.xyz) - u.prad) * 0.85; }
//#D{
  if ((XC & 32u) != 0u) {
    let c2 = vec3i(clamp(floor((p + u._w2 - DOM_LO) / CCELL), vec3f(0.0), vec3f(f32(COARSE) - 1.0)));
    let q2 = vecs[cIdx(c2)];
    if (fract(q2.w * 0.5) > 0.25) { dc = min(dc, (length(p - q2.xyz) - u.prad) * 0.85 + 1.0); }
  }
//#D}

  var d = dc;
  if (tri < BAND * 0.98) { d = tri - u.prad; if (PROF) { profSpraySrc = 0u; } }  // inside the exact band
  else {
    d = max(BAND - u.prad, dc);
    if (PROF) { pc[4] += 1u; profSpraySrc = select(2u, 1u, dc > BAND - u.prad); }
  }
  // particle field (spray/stream), the analytic bulk in each glass, and the table puddle
//#D{
  if (PROF) {
    let dsp = max(d, sdBoxDom(p));
    let dbk = bulkSDF(p);
    profSprayD = dsp; profBulkD = dbk;
    return min(min(dsp, dbk), dPud);
  }
//#D}
  return min(min(max(d, sdBoxDom(p)), bulkSDF(p)), dPud);
}

// the table is NOT marched — it is intersected analytically (grazing rays used to burn
// the whole step budget skimming the plane)
// ── magnum (1.5 L): 345 mm tall, 116 mm body, 30 mm neck, deep punt ──
const BOT_H   = 0.345;
const BODY_R  = 0.060;                   // height/width 2.87, matching the reference
const NECK_R  = 0.0150;
const BOT_W   = 0.0030;                  // wall thickness
fn rotX(v: vec3f, a: f32) -> vec3f {
  let c = cos(a); let s = sin(a);
  return vec3f(v.x, c * v.y - s * v.z, s * v.y + c * v.z);
}
fn rotY(v: vec3f, a: f32) -> vec3f {
  let c = cos(a); let s = sin(a);
  return vec3f(c * v.x + s * v.z, v.y, -s * v.x + c * v.z);
}
// The silhouette as radius-vs-height. A champagne shoulder is an S-curve - convex as it
// leaves the body, concave as it meets the neck - which a straight cone cannot produce and
// a wide smooth-min rounds away entirely. Measured off the reference, of 345 mm:
// body 163, shoulder 67, neck 115.
fn bottleR(y: f32) -> f32 {
  // the neck is slightly tapered, wider where it leaves the shoulder
  let nr = mix(NECK_R + 0.0014, NECK_R, clamp((y - 0.275) / 0.060, 0.0, 1.0));
  // Span 175 mm, not 115. Smootherstep is nearly flat at both ends, so only about 60% of
  // the span reads as curvature - the visible shoulder was coming out ~2/3 of the arc the
  // reference shows. The flat tails still leave a ~135 mm straight body and ~105 mm neck.
  let t  = clamp((y - 0.100) / 0.175, 0.0, 1.0);
  // smootherstep, not smoothstep: smoothstep's second derivative jumps at each end, which
  // shows up as a crease where the shoulder meets the body. This is C2, so the silhouette
  // flows from neck to body with no seam.
  let sm = t * t * t * (t * (t * 6.0 - 15.0) + 10.0);
  var r  = mix(BODY_R, nr, sm);
  // heel: 30% of the previous bevel, and eased rather than a straight chamfer so it does
  // not leave a crease where it meets the body
  let hy = clamp(y / 0.0036, 0.0, 1.0);
  let hs = hy * hy * hy * (hy * (hy * 6.0 - 15.0) + 10.0);
  r = min(r, BODY_R - 0.0015 * (1.0 - hs));
  return r;
}
fn sdBottleLocal(p: vec3f) -> f32 {
  // 0.70 keeps the estimate conservative where the shoulder is steepest
  var d = (length(p.xz) - bottleR(p.y)) * 0.70;
  d = max(d, p.y - BOT_H);
  d = max(d, -p.y);
  // lip ring below the mouth
  let lip = sdCyl(p, NECK_R + 0.0019, BOT_H - 0.013, BOT_H - 0.003) - 0.0011;
  d = min(d, lip);
  // punt: a dome pushed up into the base
  let punt = length((p - vec3f(0.0, -0.008, 0.0)) * vec3f(1.0, 0.50, 1.0)) - 0.040;
  d = max(d, -punt);
  // hollow into a shell, then open the bore so the mouth is a mouth
  let sh = max(d, -(d + BOT_W));
  let bore = sdCyl(p, NECK_R - BOT_W - 0.0006, 0.22, BOT_H + 0.02);
  return max(sh, -bore);
}
fn sdBottle(p: vec3f) -> f32 {
  if (u.botOn < 0.5) { return 1e9; }
  // the mouth sits at the emitter, so the bottle follows the pour's wander for free
  var v = p - u.emitPos;
  v = rotY(v, -u.botAz);
  v = rotX(v, -u.botTilt);
  v.y += BOT_H;
  // cheap bounding sphere first: the full profile is a dozen primitives and this runs on
  // every raymarch step, but the bottle occupies a small part of the scene
  let b = length(v - vec3f(0.0, BOT_H * 0.50, 0.0)) - 0.186;
  if (b > 0.015) { return b; }
  if (PROF) { pc[8] += 1u; }
  return sdBottleLocal(v);
}

fn map(p: vec3f) -> f32 {
  if (PROF) { pc[1] += 1u; }
//#D{
  if (XC != 0u) {
    var d = min(min(sdTower(p), liquidDist(p)), sdBottle(p));
    let q = p + vec3f(u._w2);
    if ((XC & 1u) != 0u) { d = min(d, sdTower(q) + 1.0); }
    if ((XC & 2u) != 0u) { d = min(d, liquidDist(q) + 1.0); }
    if ((XC & 4u) != 0u) { d = min(d, bulkSDF(q) + 1.0); }
    if ((XC & 8u) != 0u) { d = min(d, sdBottle(q) + 1.0); }
    return d;
  }
  if (PROF) {
  let dT = sdTower(p);
  let dL = liquidDist(p);
  let dB = sdBottle(p);
  let m  = min(min(dT, dL), dB);
  if (profMarchS != 0.0 && sdBoxDom(p) <= 0.0) {
    if (profMarchS > 0.0) {
      // march steps in air inside the domain box, by what limited them:
      // 80..84 count  tower / spray / bulk liquid / puddle / bottle
      // 85..89 summed step size of each, in 0.1 mm
      // 90..94 step size <0.25 mm, <1, <4, <16, >=16 mm (all limiters)
      // 96/97/98 spray from the narrow band / far-field estimate / band floor
      // 100/101 tower from a coupe's bounding cylinder / its exact shape
      var k = 3u;
      if (dB == m) { k = 4u; } else if (dT == m) { k = 0u; }
      else if (profSprayD == m) { k = 1u; } else if (profBulkD == m) { k = 2u; }
      pc[80u + k] += 1u;
      pc[85u + k] += u32(clamp(m, 0.0, 1.0) * 1e4);
      let mm = m * 1000.0;
      var hb = 4u;
      if (mm < 0.25) { hb = 0u; } else if (mm < 1.0) { hb = 1u; } else if (mm < 4.0) { hb = 2u; } else if (mm < 16.0) { hb = 3u; }
      pc[90u + hb] += 1u;
      if (k == 1u) { pc[96u + profSpraySrc] += 1u; }
      if (k == 0u) { pc[select(101u, 100u, profTowerB)] += 1u; }
    } else {
      pc[103] += 1u;    // steps inside a medium, inside the box
    }
  }
  return m;
  }
//#D}
  return min(min(sdTower(p), liquidDist(p)), sdBottle(p));
}
fn planeT(ro: vec3f, rd: vec3f) -> f32 {
  if (rd.y > -1e-6) { return 1e9; }
  let t = -ro.y / rd.y;
  if (t < 0.0) { return 1e9; }
  return t;
}

fn mapN(p: vec3f) -> vec3f {
  if (PROF) { pc[14] += 1u; }
  let e = vec2f(1.0, -1.0) * 0.0002;
  return normalize( e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx)
                  + e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx) );
}


const FAR      = 14.0;   // the table runs to the horizon; a 4 m clip dropped it to env
const SURF_EPS = 0.00025;
const HIT_EPS  = 0.00012;

// sphere-trace; s = +1 when travelling through air, -1 when inside a medium
// Enhanced sphere tracing (Keinert et al. 2014). Steps are over-relaxed - 1.4x the distance
// rather than the safe 0.9x - and each new sample checks that its bounding sphere still
// overlaps the previous one. If they don't, a surface could lie in the gap: step back to the
// last safe point and march conservatively for the rest of the ray. Long approaches through
// open air get cheaper; near thin shells the fallback trips and it behaves as before.
// tmax: where the caller's analytic table plane would win anyway (see below)
// returns (distance, steps, 1 if it hit)
fn marchS(ro: vec3f, rd: vec3f, s: f32, tmax: f32) -> vec3f {
  var t = 0.0;
  var i = 0.0;
  var w = 1.4;
  var tPrev = 0.0;
  var rPrev = 0.0;
  var stepL = 0.0;
  loop {
    if (i >= u.maxSteps) { if (PROF && profPrim) { pc[79] += 1u; } break; }   // 79: primary hit the step cap
    if (PROF && profPrim) {
      // 64 past the table plane, 65 outside the spray/tower domain box, 66 inside it
      if (t > profTpl) { pc[64] += 1u; }
      else if (sdBoxDom(ro + rd * t) > 0.0) { pc[65] += 1u; }
      else { pc[66] += 1u; }
    }
    if (PROF) { profMarchS = s; }
    let d = map(ro + rd * t) * s;
    if (PROF) { profMarchS = 0.0; }
    if (w > 1.0 && (d < 0.0 || d + rPrev < stepL)) {
      if (PROF) { pc[11] += 1u; }
      // Overshot: either the spheres don't overlap, so a surface could sit in the gap, or
      // the step landed INSIDE something - where the overlap test can still pass and the
      // hit would be reported millimetres under the surface. Back to the last safe point,
      // conservative from here on.
      w = 0.9;
      t = tPrev + max(rPrev * 0.9, 0.00006);
      tPrev = t; rPrev = 0.0; stepL = 0.0;
      i = i + 1.0;
      continue;
    }
    if (d < HIT_EPS) { return vec3f(t, i, 1.0); }
    tPrev = t; rPrev = d;
    // Past the table plane nothing can win - every caller replaces a farther hit with the
    // analytic table. Stop once the last PROVEN-empty sphere reaches it, not merely when t
    // passes it: an over-relaxed step can jump a surface sitting just in front of the table.
    // Rays bound for the table used to march on beneath it to FAR, through the puddle test:
    // 13% of the steps on heavy tier2 and ~2.5-4 ms, for an identical picture. (Bounding
    // the march by where it leaves the scene's bounds as well cut 6.5% more steps and no
    // time: steps out in empty sky are cheap.)
    if (tPrev + rPrev >= tmax) { break; }
    stepL = max(d * w, 0.00006);
    t = t + stepL;
    if (t > FAR) { break; }
    i = i + 1.0;
  }
  return vec3f(t, i, 0.0);
}
fn march(ro: vec3f, rd: vec3f) -> vec3f { return marchS(ro, rd, 1.0, 1e9); }

// 0 air · 1 glass · 2 champagne · 3 table (opaque).
// Priority order resolves coincident glass/liquid surfaces — no double refraction.
fn mediumAt(p: vec3f) -> i32 {
  if (PROF) { pc[15] += 1u; }
  if (p.y < 0.0) { return 3; }
  if (sdBottle(p) < 0.0) { return 4; }
  if (sdTower(p) < 0.0) { return 1; }
  if (liquidDist(p) < 0.0) { return 2; }
  return 0;
}
// per medium: 0 air, 1 glass, 2 champagne, 3 table, 4 bottle glass
fn iorOf(m: i32) -> f32 {
  return array(1.0, 1.50, 1.34, 1.0, 1.52)[m];
}
fn sigmaOf(m: i32) -> vec3f {           // absorption: faint green glass, Beer-Lambert gold, olive bottle
  return array(vec3f(0.0), vec3f(0.6, 0.35, 0.6), vec3f(2.2, 5.5, 16.0), vec3f(0.0),
               vec3f(260.0, 85.0, 310.0))[m];
}

fn turbo(x: f32) -> vec3f {
  let v = clamp(x, 0.0, 1.0);
  return clamp(vec3f(2.0 * v - 0.4, 1.4 - abs(2.0 * v - 1.0) * 1.6, 1.3 - 2.2 * v),
               vec3f(0.0), vec3f(1.0));
}
// out-of-focus party lights: what makes refraction through glass worth looking at
fn bokeh(rd: vec3f) -> vec3f {
  let el = asin(clamp(rd.y, -1.0, 1.0));
  let g  = vec2f(atan2(rd.z, rd.x), el) / 0.20;
  let b  = floor(g);
  var acc = vec3f(0.0);
  for (var i = -1; i <= 1; i++) {
    for (var k = -1; k <= 1; k++) {
      let id = b + vec2f(f32(i), f32(k));
      let r  = rnd3(u32(i32(id.x) + 2048), u32(i32(id.y) + 2048), 17u);
      if (r.z > 0.46) { continue; }
      let ctr = id + 0.5 + (r.xy - 0.5) * 0.7;
      let rad = 0.11 + r.x * 0.15;
      let m   = smoothstep(rad, rad * 0.5, length(g - ctr));
      acc += mix(vec3f(1.0, 0.66, 0.28), vec3f(0.50, 0.70, 1.0), r.y) * m * (0.45 + r.x * 2.2);
    }
  }
  return acc * exp(-abs(el) * 1.9);
}
// lat-long test grid: makes it obvious WHICH direction a reflection or refraction samples
fn envGrid(rd: vec3f) -> vec3f {
  let el = asin(clamp(rd.y, -1.0, 1.0));
  let uv = vec2f(atan2(rd.z, rd.x) / 6.2831853 + 0.5, el / 3.14159265 + 0.5);
  let g  = uv * vec2f(72.0, 36.0);
  let fr = abs(fract(g) - 0.5);
  let ln = smoothstep(0.42, 0.50, max(fr.x, fr.y));
  let g2 = uv * vec2f(12.0, 6.0);
  let f2 = abs(fract(g2) - 0.5);
  let l2 = smoothstep(0.45, 0.50, max(f2.x, f2.y));
  var c = mix(vec3f(uv.x, uv.y, 0.35) * 0.9, vec3f(1.0), ln * 0.55);
  c = mix(c, vec3f(1.0), l2);
  if (abs(el) < 0.015) { c = vec3f(0.1, 1.0, 0.2); }          // horizon
  if (abs(el) > 1.50)  { c = vec3f(1.0, 0.1, 0.9); }          // poles
  if (dot(rd, lightDir()) > 0.995) { c = vec3f(1.0, 0.5, 0.0); } // key direction
  return c;
}
fn env(rd: vec3f) -> vec3f {
  if (u.envg > 0.5) { return envGrid(rd); }
  let h = clamp(rd.y * 0.5 + 0.5, 0.0, 1.0);
  var c = mix(vec3f(0.007, 0.008, 0.013), vec3f(0.034, 0.034, 0.047), h);
  let kd = clamp(dot(rd, lightDir()), 0.0, 1.0);
  c += vec3f(1.00, 0.95, 0.86) * pow(kd,  14.0) *  1.0;    // broad softbox: long specular streaks
  c += vec3f(1.00, 0.97, 0.90) * pow(kd, 420.0) * 34.0;    // hot core
  c += vec3f(1.00, 0.60, 0.26) * pow(clamp(dot(rd, normalize(vec3f(-0.75, 0.10, 0.35))), 0.0, 1.0), 26.0) * 1.3;
  c += vec3f(0.38, 0.52, 0.95) * pow(clamp(dot(rd, normalize(vec3f( 0.10,-0.20, 0.95))), 0.0, 1.0),  7.0) * 0.22;
  return c + bokeh(rd);
}
fn sky(rd: vec3f) -> vec3f { return env(rd); }
const CN     : u32 = 768u;
const CEXT   = 0.55;        // half-extent (m); must contain the lit ellipse
const CSCALE = 3000.0;      // photon energy fixed-point scale
fn lightDir() -> vec3f {
  let ce = cos(u.ltEl);
  return normalize(vec3f(ce * cos(u.ltAz), sin(u.ltEl), ce * sin(u.ltAz)));
}
fn causIdx(c: vec2i) -> u32 {
  let q = clamp(c, vec2i(0), vec2i(i32(CN) - 1));
  return (u32(q.y) * CN + u32(q.x)) * 3u;
}
fn causFetch(c: vec2i) -> vec3f {
  let k = causIdx(c);
  return vec3f(f32(atomicLoad(&atom[A_CAUST + k])), f32(atomicLoad(&atom[A_CAUST + k + 1u])), f32(atomicLoad(&atom[A_CAUST + k + 2u])));
}
fn causFetchF(c: vec2i) -> vec3f {
  let q = clamp(c, vec2i(0), vec2i(i32(CN) - 1));
  return vecs[V_CAUSTF + u32(q.y) * CN + u32(q.x)].xyz;
}
fn causticAt(xz: vec2f) -> vec3f {
  let n = xz / (2.0 * CEXT) + 0.5;
  // clamping the fetch would smear the border texels to infinity as long streaks
  if (any(n < vec2f(0.0)) || any(n > vec2f(1.0))) { return vec3f(0.0); }
  let t = n * f32(CN) - 0.5;
  let b = floor(t);
  let f = t - b;
  let c = vec2i(b);
  let a0 = mix(causFetchF(c),               causFetchF(c + vec2i(1, 0)), f.x);
  let a1 = mix(causFetchF(c + vec2i(0, 1)), causFetchF(c + vec2i(1, 1)), f.x);
  let e = min(min(n.x, n.y), min(1.0 - n.x, 1.0 - n.y));
  return mix(a0, a1, f.y) / CSCALE * smoothstep(0.0, 0.02, e);
}
fn tableShade(p: vec3f) -> vec3f {
  let r = length(p.xz);
  let fall = 1.0 - 0.55 * clamp(r * 1.5, 0.0, 1.0);
  let amb = vec3f(0.013, 0.013, 0.017);
  // direct light AND caustics both come from the photon map: shadows are free
  let c = causticAt(p.xz) * u.cgain;
  return (amb + c) * fall * vec3f(0.97, 0.94, 0.90);

fn tonemap(x: vec3f) -> vec3f {

@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {

  return vec4f(p[i], 0.0, 1.0);
}

// Short refraction-only walk used to COLOUR a reflection. Sampling env() for a reflection
// that actually hits nearby geometry is what paints flat discs on near-grazing surfaces.
// The render, the traced reflection and the photons follow light the same way and differ
// only in what they do with its energy, so the mechanics are shared - it was three copies.
// leg: march from p along d through medium med, stopped by the analytic table plane.
// x = distance travelled; y = what ended it, 0 nothing (escaped), 1 the table, 2 a surface;
// z = march steps, for the profiler.
fn leg(p: vec3f, d: vec3f, med: i32) -> vec3f {
  let tpl = planeT(p, d);
  if (PROF) { profTpl = tpl; }
  var s = 1.0;
  if (med != 0) { s = -1.0; }
  let h = marchS(p, d, s, tpl);
  var r = vec3f(FAR, 0.0, h.y);
  if (h.z > 0.5) { r = vec3f(h.x, 2.0, h.y); }
  if (tpl < r.x) { r = vec3f(tpl, 1.0, h.y); }
  return r;
}
// turn: at the surface a leg ended on, the normal facing the ray, the medium beyond, the
// Fresnel reflectance, and the ray that carries on - refracted into the medium beyond, or
// reflected where refraction is impossible (total internal reflection), staying put.
struct Turn { d: vec3f, F: f32, p: vec3f, med: i32, n: vec3f, medA: i32, tir: bool };
fn turn(hp: vec3f, d: vec3f, med: i32) -> Turn {
  var n = mapN(hp);
  if (dot(n, d) > 0.0) { n = -n; }
  let medA = mediumAt(hp + d * SURF_EPS);
  let i1 = iorOf(med);
  let i2 = iorOf(medA);
  let f0 = pow((i1 - i2) / (i1 + i2), 2.0);
  let F  = f0 + (1.0 - f0) * pow(1.0 - clamp(dot(-d, n), 0.0, 1.0), 5.0);
  let rf = refract(d, n, i1 / i2);
  if (dot(rf, rf) < 1e-6) {
    let r = reflect(d, n);
    return Turn(r, F, hp + r * SURF_EPS, med, n, medA, true);
  }
  return Turn(rf, F, hp + rf * SURF_EPS, medA, n, medA, false);
}

fn reflColour(p0: vec3f, d0: vec3f, med0: i32) -> vec3f {
  if (PROF) { pc[12] += 1u; }
  var p = p0; var d = d0; var med = med0;
  var tp = vec3f(1.0);
  var acc = vec3f(0.0);
  for (var b = 0; b < 3; b++) {
    let lg = leg(p, d, med);
    if (PROF) { pc[13] += u32(lg.z); }
    if (med == 2) { acc += tp * vec3f(0.95, 0.60, 0.20) * (1.0 - exp(-lg.x * 7.0)) * 0.30; }
    tp *= exp(-sigmaOf(med) * lg.x);
    if (lg.y == 0.0) { return acc + tp * env(d); }
    let hp = p + d * lg.x;
    var tab = lg.y == 1.0;
    var sf: Turn;
    if (!tab) { sf = turn(hp, d, med); tab = sf.medA == 3; }
    if (tab) { return acc + tp * tableShade(hp); }
    d = sf.d; p = sf.p; med = sf.med;
  }
  return acc + tp * env(d);
}

@fragment fn fs(@builtin(position) fc: vec4f) -> @location(0) vec4f {

//#D}

  for (const n of ('simParticles puddleUpdate waveUpdate puddleCoarse ' +
                   'clearFine scatterFine jfaCoarse resolveFine ' +
                   'causticDecay photons causticBlur').split(' '))
    P[n] = device.createComputePipeline({ layout, compute: { module, entryPoint: n } });
  const render = device.createRenderPipeline({ layout,
    vertex:   { module, entryPoint: 'vs' },
    fragment: { module, entryPoint: 'fs', targets: [{ format }] },
  });
//#D{
  // the same render pipeline with the profiler compiled in
  const renderProf = device.createRenderPipeline({
    layout,
    vertex:   { module, entryPoint: 'vs' },
    fragment: { module, entryPoint: 'fs', targets: [{ format }], constants: { PROF: 1 } },
    primitive:{ topology: 'triangle-list' },
  });
  let profReq = null;
  // __xc(bits): render with the cost-attribution variant (0 = back to normal)
  let renderX = null;

  window.__variant = async c => {
    renderX = Object.keys(c).length ? await device.createRenderPipelineAsync({ layout,
      vertex: { module, entryPoint: 'vs' },
      fragment: { module, entryPoint: 'fs', targets: [{ format }], constants: c },
      primitive: { topology: 'triangle-list' } }) : null;
    return JSON.stringify(c);
  };

  // Image A/B. __grab() reads the frame on screen (after one more paint); __diff(a, b)
  // returns how many pixels differ and by how much, and shows |a - b| x8 over the canvas
  // until __diff() is called with no arguments.
  const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    await nextFrame();
    const c2 = document.createElement('canvas'); c2.width = canvas.width; c2.height = canvas.height;
    const g = c2.getContext('2d'); g.drawImage(canvas, 0, 0);
    return g.getImageData(0, 0, c2.width, c2.height);
  };
  // A reference frame that survives a reload, so a code change can be diffed against the
  // frame before it: __saveRef(name) stores what __grab() returns, __loadRef(name) gets it
  // back. IndexedDB, since a 1920x1080 frame is 8 MB - far past localStorage.
  const idb = () => new Promise((res, rej) => {
    const r = indexedDB.open('champagne-ref', 1);

    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  window.__saveRef = async (name = 'ref') => {
    const img = await window.__grab(), db = await idb();
    await new Promise(res => { const t = db.transaction('f', 'readwrite'); t.objectStore('f').put({ w: img.width, h: img.height, d: img.data }, name); t.oncomplete = res; });
    return name + ' saved';
  };
  window.__loadRef = async (name = 'ref') => {
    const db = await idb();
    const v = await new Promise(res => { const r = db.transaction('f').objectStore('f').get(name); r.onsuccess = () => res(r.result); });
    return v ? new ImageData(new Uint8ClampedArray(v.d), v.w, v.h) : null;
  };
  let diffEl = null;
  window.__diff = (a, b) => {
    if (diffEl) { diffEl.remove(); diffEl = null; }
    if (!a) return 'diff overlay off';
    const n = a.width * a.height, out = new ImageData(a.width, a.height);
    let sum = 0, gt4 = 0, gt16 = 0, gt48 = 0, mx = 0;
    for (let i = 0; i < n; i++) {
      let m = 0;
      for (let k = 0; k < 3; k++) { const d = Math.abs(a.data[i*4+k] - b.data[i*4+k]); m = Math.max(m, d); out.data[i*4+k] = Math.min(255, d * 8); }
      out.data[i*4+3] = 255; sum += m; mx = Math.max(mx, m);
      if (m > 4) gt4++; if (m > 16) gt16++; if (m > 48) gt48++;
    }
    diffEl = document.createElement('canvas'); diffEl.width = a.width; diffEl.height = a.height;
    diffEl.getContext('2d').putImageData(out, 0, 0);
    diffEl.style.cssText = 'position:fixed;pointer-events:none;z-index:5';
    const r = canvas.getBoundingClientRect();
    Object.assign(diffEl.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    document.body.appendChild(diffEl);
    const pc = x => +(100 * x / n).toFixed(2);
    return { meanAbs: +(sum / n).toFixed(3), max: mx, pctOver4: pc(gt4), pctOver16: pc(gt16), pctOver48: pc(gt48) };
  };
  // One profiled frame: counters cleared, the profiling pipeline used, banks read back and
  // summed. Index map: 0 pixels, 1 map, 2 liquidDist, 3 spray trilerp, 4 spray far field,
  // 5 wave fetch, 6 coupe calls, 7 coupe exact, 8 bottle exact, 9 marches, 10 march steps,
  // 11 over-relaxation fallbacks, 12 reflection traces, 13 reflection steps, 14 normals,
  // 15 medium lookups, 16..26 rays ending at bounce 0..10, 27 missed everything, 28 table,
  // 29 too dim to matter, 30 out of bounces, 31..41 march steps at bounce 0..10, 43 bubbles,
  // 42/44..55 what out-of-bounce rays were doing (see the fs end), 56..59 the same for all rays.
  window.__profile = () => new Promise(res => { profReq = res; if (cfg.paused) requestAnimationFrame(frameOnce); });
  function flushProfile(r) {
    profRd.mapAsync(GPUMapMode.READ).then(() => {
      const a = new Uint32Array(profRd.getMappedRange().slice(0)); profRd.unmap();
      const t = new Array(112).fill(0);
      for (let b = 0; b < 64; b++) for (let k = 0; k < 112; k++) t[k] += a[b * 128 + k];
      r(t);
    });
  }
//#D}
  const verr = await device.popErrorScope();
  if (verr) fail('pipeline', verr.message);

  // ── timing: 3 labelled pass groups ──
  //#D{
  const LABELS = ['sim', 'build', 'photon', 'render'];
  let qset = null, qres = null, qrd = null, qbusy = false;
  if (hasTS) {
    qset = device.createQuerySet({ type: 'timestamp', count: LABELS.length * 2 });
    qres = device.createBuffer({ size: LABELS.length * 16, usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC });
    qrd  = device.createBuffer({ size: LABELS.length * 16, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  }
  const ts = i => hasTS ? { querySet: qset, beginningOfPassWriteIndex: i * 2, endOfPassWriteIndex: i * 2 + 1 } : undefined;
  //#D}

  let lastVW = -1, lastVH = -1;
  function resize() {
    const bw = Math.max(1, Math.floor(cfg.w || canvas.clientWidth));
    const bh = Math.max(1, Math.floor(cfg.h || canvas.clientHeight));
    if (canvas.width  !== bw) canvas.width  = bw;
    if (canvas.height !== bh) canvas.height = bh;
    if (!cfg.w || !cfg.h) return;
    // The CSS stretches the canvas to the viewport, so an explicit w/h of a different
    // aspect silently distorts the picture. Letterbox rather than lie about proportions.
    // A viewport of zero (pane hidden at load, tab restored in the background) scaled it
    // to 0px and left it there - invisible, while the GPU went on rendering full size -
    // because the explicit-size path skipped the resize listener. Never apply a zero, and
    // re-check whenever the viewport changes rather than only at load.
    if (innerWidth < 1 || innerHeight < 1) return;
    if (innerWidth === lastVW && innerHeight === lastVH) return;
    lastVW = innerWidth; lastVH = innerHeight;
    const k = Math.min(innerWidth / cfg.w, innerHeight / cfg.h);
    canvas.style.width  = (cfg.w * k) + 'px';
    canvas.style.height = (cfg.h * k) + 'px';
    canvas.style.margin = ((innerHeight - cfg.h * k) / 2) + 'px auto 0';
  }
  if (!cfg.gate) { resize(); addEventListener('resize', resize); }

  const SIM_DT = 1 / 60;
  const LAG_STEPS = 30;        // 0.5 s behind the clock before we give up the missed steps
  let clockT = 0;              // master clock, seconds; the sim step index derives from it
  let showStep = 0;            // show time in whole SIM_DT steps - the clock the music owns
  let showPend = 0, showT = 0, burstSteps = 0;
  let frameSteps = 1;          // sim steps this rendered frame stands for; sizes the streak
  // A redraw while paused (a slider moved) must re-render the CURRENT state and nothing
  // else. As a plain frame it stepped the sim whenever the clock was ahead - and pausing in
  // det mode always leaves exactly one step pending - and re-shot the photons, so every
  // slider drag advanced the spill and nudged the caustics. A/B on one frame was impossible.
  let redrawOnly = false;
  const f32 = new Float32Array(48);
  const t0 = performance.now();
  let last = t0, acc = 0, accN = 0, frameNo = 0, simStep = 0, ffSteps = 0;
  const pudBound = [0, 0, 0.02];   // wet-region bounding circle, from the coarse readback

  function writeUniforms(time) {
    let ang, dist = ui.dist, camY = ui.camY, tgtY = ui.tgtY;
    if (ui.show) {
      const sh = evalShow(showT);
      ang = sh.angle / 57.3; dist = sh.dist; camY = sh.camY; tgtY = sh.tgtY;   // deg -> rad, 0.007% off: -6 bytes
      // Sliders follow for readout only. Driving the camera THROUGH them would quantise it
      // to the slider step - dist steps by 0.01, visible stepping on a push-in that only
      // covers 0.01 in eight seconds.
      setUI('angle', sh.angle.toFixed(1)); setUI('dist', sh.dist.toFixed(2));
      setUI('camY', sh.camY.toFixed(3));   setUI('tgtY', sh.tgtY.toFixed(3));
    }
    else if (ui.spin) { ang = time * 0.25; setUI('angle', (ang * 180 / Math.PI) % 360); }
    else              { ang = ui.angle * Math.PI / 180; }
    // a real pour is not perfectly aimed: let the bottle wander on a slow Lissajous
    const K = ui.wanderSpd;
    const wob = tt => [Math.sin(tt * 0.37 * K) * 0.62 + Math.sin(tt * 0.91 * K + 1.3) * 0.38,
                       Math.cos(tt * 0.29 * K + 2.1) * 0.62 + Math.sin(tt * 0.73 * K + 0.7) * 0.38];

             Math.sin(ang) * dist, camY, Math.cos(ang) * dist, ui.shutter * SIM_DT * frameSteps,
             0, tgtY, 0, (w1[0] - w0[0]) * W / 0.02,            // target; bottle drift velocity x
             w0[0] * W, 0.555, w0[1] * W, (w1[1] - w0[1]) * W / 0.02]);   // emitter; drift z
//#D{
    // ...then the harness controls, which the release folds into the shader
    f32.set([ui.view, 1.6, cfg.steps, SIM_DT, Math.max(1, Math.round((cfg.npart / 6) / ui.pourRate)),
             cfg.npart, ui.dropVol * 1e-9, cfg.nphoton, ui.cgain, cfg.single ? 1 : 0, cfg.noliq ? 1 : 0,
             ui.bubbles ? 1 : 0, ui.expo, ui.waves ? 1 : 0, ui.drops ? 1 : 0, ui.bounces,
             ui.reflect ? 1 : 0, ui.autofill ? -1 : ui.fill / 100, ui.gridEnv ? 1 : 0, ui.rtrace,

  //#D{
  async function readTimestamps() {
    if (!hasTS || qbusy || qrd.mapState !== 'unmapped') return;
    qbusy = true;
    try {
      await qrd.mapAsync(GPUMapMode.READ);
      const b = new BigInt64Array(qrd.getMappedRange().slice(0));
      qrd.unmap();
      let tot = 0;
      LABELS.forEach((l, i) => {
        const ms = Number(b[i * 2 + 1] - b[i * 2]) / 1e6;
        probe.gpuMs[l] = ms; tot += ms;
      });
      probe.gpuMs.total = tot;
    } catch (e) {}
    qbusy = false;
  }

  let dbusy = false;
  async function readPuddle() {
    if (dbusy || pudRd.mapState !== 'unmapped') return;
    dbusy = true;
    try {
      await pudRd.mapAsync(GPUMapMode.READ);
      const a = new Float32Array(pudRd.getMappedRange().slice(0));
      pudRd.unmap();
      let mx = 0, wet = 0, x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
      const PEXT = 0.55, CELL = 2 * PEXT / PCN;
      for (let k = 0; k < PCN * PCN; k++) {
        const h = a[k];
        if (h > mx) mx = h;
        if (h > 0.0004) {
          wet++;
          const bx = (k % PCN) * CELL - PEXT, bz = Math.floor(k / PCN) * CELL - PEXT;
          if (bx < x0) x0 = bx; if (bx + CELL > x1) x1 = bx + CELL;
          if (bz < z0) z0 = bz; if (bz + CELL > z1) z1 = bz + CELL;
        }
      }
      if (wet) {
        pudBound[0] = (x0 + x1) / 2; pudBound[1] = (z0 + z1) / 2;
        pudBound[2] = 0.5 * Math.hypot(x1 - x0, z1 - z0) + CELL;
      } else { pudBound[0] = 0; pudBound[1] = 0; pudBound[2] = 0; }
      probe.puddle = { maxMM: +(mx * 1000).toFixed(2), wetBlocks: wet, ofBlocks: PCN * PCN,
                       boundR: +pudBound[2].toFixed(3) };
    } catch (e) {}
    dbusy = false;
  }

  let pbusy = false;
  async function readParts() {
    if (pbusy || partRd.mapState !== 'unmapped') return;
    pbusy = true;
    try {
      await partRd.mapAsync(GPUMapMode.READ);
      const a = new Float32Array(partRd.getMappedRange().slice(0));
      partRd.unmap();
      const POOL = Math.max(Math.floor(cfg.npart / 6), 1);
      let alive = 0, aliveBottle = 0, ymin = 1e9, ymax = -1e9;
      for (let k = 0; k < PSAMP; k++) {
        const life = a[k * 8 + 3];

        }

  }

    if (gbusy || glassRd.mapState !== 'unmapped') return;
    gbusy = true;
    try {
      await glassRd.mapAsync(GPUMapMode.READ);
      const a = new Float32Array(glassRd.getMappedRange().slice(0));
      glassRd.unmap();

    gbusy = false;
  }

  //#D}
  const WG = (n, s) => Math.ceil(n / s);

  function frame() {
    const now = performance.now();

    // ── master clock ──────────────────────────────────────────────────────────────
    // Everything is a function of one clock: the sim advances in whole SIM_DT steps
    // derived from it, and the camera reads it directly. Stepping once per rendered
    // frame instead tied the fluid's rate to whatever the renderer managed - 23% fast
    // at 74 fps, 37% slow at 38 - and against music that error accumulates over the
    // whole run. A deficit is now KEPT and worked off over the following frames rather
    // than discarded, which is the part that makes a hitch cost nothing in the end.
    // The show clock advances in whole SIM_DT steps locked to wall time (later, to the
    // audio clock). The sim clock is the INTEGRAL of the timeline's speed over those
    // steps - integrating against the wall delta instead would make a timeline that
    // varies speed frame-rate dependent all over again, the bug this replaced.
    // Behind the gate (always, in the release) the show clock is the AUDIO clock: as many
    // whole steps as the music has played since it started, so the picture follows the
    // music. Otherwise wall time, banked and capped as before.
    let nShow;
    if (cfg.gate) {
      nShow = Math.max(0, Math.floor((ac.currentTime - tA) / SIM_DT) - showStep);
    } else {
      showPend += redrawOnly ? 0 : (cfg.det ? SIM_DT : Math.min((now - last) / 1000, 0.25));
      nShow = Math.floor(showPend / SIM_DT);
      showPend -= nShow * SIM_DT;
    }
    for (let i = 0; i < nShow; i++) {
      const sp = ui.show ? evalShow((showStep + i) * SIM_DT).speed : 1;
      clockT += SIM_DT * sp * ui.simSpeed;
    }
    showStep += nShow; showT = showStep * SIM_DT;
    if (ui.show && nShow) { setUI('showT', Math.min(showT, SHOW_END).toFixed(2)); }
    // Fast-forward is a deliberate burst, not a hitch: it has to actually simulate its
    // steps or the glasses never fill, so it raises the ceiling for this frame only. The
    // substep slots wrap every 16, so a burst reuses RNG streams - fine when skipping
    // ahead, not fine as a steady state.
    const ffNow = ffSteps; ffSteps = 0;
    clockT += ffNow * SIM_DT;

    // 16 is the steady-state ceiling: the sub-step index reaches the shader through 16
    // uniform slots, and reusing one would make two substeps share an RNG stream - the
    // bug that used to thin the pour whenever a frame ran long.
    const burst = burstSteps; burstSteps = 0;
    const want = Math.floor(clockT / SIM_DT) - simStep;
    const simSteps = redrawOnly ? 0 : Math.max(0, Math.min(16 + ffNow + burst, want));
    if (!redrawOnly && want - simSteps > LAG_STEPS) {
      // Persistently too slow to hold the clock. In a demo sync beats continuity: drop
      // the steps we cannot afford so the picture stays with the music, and count it so
      // the cost is visible rather than silent.
      simStep = Math.floor(clockT / SIM_DT) - simSteps;
      probe.resyncs++;
    }

    // The narrow band is rebuilt ONCE per frame, but a particle moved `simSteps` steps to
    // get where it is. A streak sized to one step therefore leaves a gap whenever the
    // frame rate is under 60 - the pour breaks back into the bead chain the swept capsule
    // was introduced to fix, and fast drops pin to the length cap. Size the shutter to the
    // motion this frame actually represents.
    // Bounded, and never from a deliberate burst: a seek runs thousands of steps in one
    // frame and would size the streak to all of them.
    if (!redrawOnly) { frameSteps = (ffNow + burst > 0) ? 1 : Math.max(1, Math.min(simSteps, 4)); }
    const time = cfg.t !== null ? cfg.t : clockT;
    probe.time  = time;
    probe.step  = simStep + simSteps;
    probe.drift = clockT - probe.step * SIM_DT;
    probe.showT = showT; probe.shot = ui.show ? evalShow(showT).shot : -1;
    probe.frameSteps = frameSteps; probe.streakMM = ui.shutter * SIM_DT * frameSteps * 1000;
    writeUniforms(time);

    const enc = device.createCommandEncoder();
    const doProf = !!profReq;
    if (doProf) { enc.clearBuffer(profB); }

    // One compute pass per group (each timed in the harness). A dispatch is
    // [entry point, workgroups, index]; the index reaches the shader as the grid's height
    // (see simParticles), and defaults to 0.
    const pass = (i, list) => {
      const cp = enc.beginComputePass({ timestampWrites: ts(i) });
      cp.setBindGroup(0, bg0);
      for (const [n, w, k = 0] of list) { cp.setPipeline(P[n]); cp.dispatchWorkgroups(w, k + 1); }
      cp.end();
    };

    // 1 — the simulation. Everything that ADVANCES STATE runs once per sim step, on the
    // clock: particles, the table puddle, the per-glass volume ODE and the wave field
    // (three wave sub-steps). The last three used to sit in the per-frame build pass, so
    // the bulk advanced at the FRAME rate while the particles advanced on the clock; it hid
    // at 60 fps and showed when a seek ran 3000 steps in one frame and filled one glass.
    const sim = [];
    for (let k = 0; k < simSteps; k++) {
      const wv = ['waveUpdate', WG(NG * WN * WN, 64)];
      sim.push(['simParticles', WG(cfg.npart, 64), k % 16], ['puddleUpdate', WG(PN * PN, 256)],
               wv, wv, wv);
    }
    pass(0, sim);

    // 2 — structures for rendering, from the final state, once per frame
    pass(1, [
      ['puddleCoarse', WG(PCN * PCN, 64)],
      ['clearFine', WG(FINE_N / 2, 256)], ['scatterFine', WG(cfg.npart, 64)],
      ...JFA_STRIDES.map((_, k) => ['jfaCoarse', WG(COARSE_N, 64), k]),
      ['resolveFine', WG(FINE_N / 2, 256)],
    ]);

    // 2b — caustics: fade the photon map, shoot this frame's photons, blur. A redraw keeps
    // the photon map it already has.
    pass(2, redrawOnly ? [] : [['causticDecay', WG(CN * CN * 3, 256)],
                               ['photons', WG(cfg.nphoton, 64)], ['causticBlur', WG(CN * CN, 256)]]);

    // 3 — render
    const rp = enc.beginRenderPass({
      colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store' }],
      timestampWrites: ts(3),
    });
